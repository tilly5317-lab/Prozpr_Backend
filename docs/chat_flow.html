<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Prozpr — Chat Flow (interactive)</title>
<style>
  :root {
    --bg:        #0f1115;
    --panel:     #161922;
    --panel-2:   #1c2030;
    --border:    #2a2f42;
    --text:      #d6deeb;
    --muted:     #8da0c4;
    --accent:    #82aaff;

    --t-http:        #4ade80;
    --t-orch:        #82aaff;
    --t-classifier:  #c792ea;
    --t-sequence:    #ff79c6;
    --t-module:      #f78c6c;
    --t-agent:       #ffcb6b;
    --t-persist:     #ff6b6b;
    --t-telemetry:   #8da0c4;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    height: 100%; overflow: hidden;
  }
  header {
    padding: 12px 22px;
    background: linear-gradient(180deg, #1a1f2e 0%, #131722 100%);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap;
  }
  header h1 { margin: 0; font-size: 17px; font-weight: 600; color: #fff; }
  header .sub { color: var(--muted); font-size: 12px; }
  header .controls { margin-left: auto; display: flex; gap: 8px; }
  button.btn {
    background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 5px;
    padding: 5px 12px; font-size: 12px; cursor: pointer;
  }
  button.btn:hover { border-color: var(--accent); color: var(--accent); }
  button.btn.active { background: rgba(130,170,255,0.12); border-color: var(--accent); color: var(--accent); }

  main {
    display: grid;
    grid-template-columns: 1fr 340px;
    height: calc(100vh - 52px);
  }
  .canvas-wrap {
    position: relative;
    overflow: auto;
    background:
      radial-gradient(circle at 1px 1px, rgba(130,170,255,0.06) 1px, transparent 0);
    background-size: 24px 24px;
  }
  .canvas {
    position: relative;
    width: 2000px;
    height: 1200px;
  }
  svg.edges {
    position: absolute; left: 0; top: 0;
    width: 100%; height: 100%;
    pointer-events: none;
  }
  svg.edges path {
    fill: none;
    stroke-width: 1.6;
    opacity: 0.75;
    transition: opacity 0.15s, stroke-width 0.15s;
  }
  svg.edges path.dim { opacity: 0.10; }
  svg.edges path.hi  { stroke-width: 2.8; opacity: 1; }
  svg.edges path.dashed { stroke-dasharray: 6 4; }
  svg.edges text {
    fill: var(--muted);
    font: 10px ui-monospace, "SF Mono", Consolas, monospace;
    paint-order: stroke; stroke: var(--bg); stroke-width: 4;
  }
  svg.edges text.hi { fill: var(--text); }

  /* nodes */
  .folder, .file, .fn {
    position: absolute;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--panel);
    user-select: none;
  }
  .folder {
    padding: 10px 12px;
    min-width: 180px;
    cursor: grab;
  }
  .folder:hover { border-color: var(--accent); }
  .folder.open  {
    background: var(--panel-2);
    box-shadow: 0 0 0 2px rgba(130,170,255,0.18);
  }
  .folder.dragging {
    cursor: grabbing;
    z-index: 50;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55), 0 0 0 2px var(--accent);
  }
  .folder .ftitle {
    font-weight: 600; font-size: 12px; color: #fff;
    display: flex; align-items: center; gap: 6px;
  }
  .folder .fpath {
    font: 10px ui-monospace, "SF Mono", Consolas, monospace;
    color: var(--muted); margin-top: 2px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .folder .badge {
    background: rgba(130,170,255,0.12);
    color: var(--accent);
    border: 1px solid rgba(130,170,255,0.25);
    border-radius: 9px;
    padding: 0 7px;
    font-size: 10px;
    margin-left: auto;
  }
  .folder .toggle { color: var(--muted); font-size: 10px; }
  .folder .rule-badge {
    background: rgba(255, 107, 107, 0.13);
    color: #ff9b9b;
    border: 1px solid rgba(255, 107, 107, 0.35);
    border-radius: 9px;
    padding: 0 6px;
    font-size: 9px;
    margin-left: 6px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .file {
    padding: 7px 9px;
    min-width: 155px;
    cursor: pointer;
    background: #1a1e2a;
  }
  .file:hover { border-color: var(--accent); }
  .file.open  { background: #20253a; box-shadow: 0 0 0 1.5px rgba(130,170,255,0.2); }
  .file .ftitle {
    font: 11px ui-monospace, "SF Mono", Consolas, monospace;
    color: var(--text); display: flex; align-items: center; gap: 5px;
  }
  .file .toggle { color: var(--muted); font-size: 9px; }

  .fn {
    padding: 5px 8px;
    min-width: 145px;
    cursor: pointer;
    font: 11px ui-monospace, "SF Mono", Consolas, monospace;
  }
  .fn:hover { transform: translateX(2px); }
  .fn .dot {
    display: inline-block;
    width: 7px; height: 7px;
    border-radius: 50%;
    margin-right: 5px;
    vertical-align: middle;
  }

  /* type-tinted left border on functions */
  .fn[data-type="http"]       { border-left: 3px solid var(--t-http); }
  .fn[data-type="orch"]       { border-left: 3px solid var(--t-orch); }
  .fn[data-type="classifier"] { border-left: 3px solid var(--t-classifier); }
  .fn[data-type="sequence"]   { border-left: 3px solid var(--t-sequence); }
  .fn[data-type="module"]     { border-left: 3px solid var(--t-module); }
  .fn[data-type="agent"]      { border-left: 3px solid var(--t-agent); }
  .fn[data-type="persist"]    { border-left: 3px solid var(--t-persist); }
  .fn[data-type="telemetry"]  { border-left: 3px solid var(--t-telemetry); }

  /* folder colour stripe (top border) */
  .folder[data-tone="http"]       { border-top: 3px solid var(--t-http); }
  .folder[data-tone="orch"]       { border-top: 3px solid var(--t-orch); }
  .folder[data-tone="classifier"] { border-top: 3px solid var(--t-classifier); }
  .folder[data-tone="sequence"]   { border-top: 3px solid var(--t-sequence); }
  .folder[data-tone="module"]     { border-top: 3px solid var(--t-module); }
  .folder[data-tone="agent"]      { border-top: 3px solid var(--t-agent); }
  .folder[data-tone="persist"]    { border-top: 3px solid var(--t-persist); }
  .folder[data-tone="telemetry"]  { border-top: 3px solid var(--t-telemetry); }

  .selected { outline: 2px solid var(--accent); outline-offset: 1px; }

  /* right detail panel */
  aside.detail {
    background: var(--panel);
    border-left: 1px solid var(--border);
    padding: 16px;
    overflow: auto;
    font-size: 13px;
  }
  aside.detail h2 { margin: 0 0 4px 0; font-size: 14px; color: #fff; }
  aside.detail h3 {
    margin: 18px 0 6px 0; font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--muted);
  }
  aside.detail code {
    background: var(--panel-2); padding: 1px 5px; border-radius: 3px;
    font: 11.5px ui-monospace, "SF Mono", Consolas, monospace; color: var(--text);
  }
  aside.detail .desc { line-height: 1.5; color: var(--text); }
  aside.detail .legend { display: grid; gap: 6px; margin-top: 4px; }
  aside.detail .legend .row {
    display: flex; align-items: center; gap: 8px; font-size: 11.5px;
  }
  aside.detail .legend .swatch { width: 11px; height: 11px; border-radius: 50%; }
  aside.detail .related { margin: 0; padding: 0; list-style: none; }
  aside.detail .related li {
    padding: 4px 0;
    font: 11px ui-monospace, "SF Mono", Consolas, monospace;
    color: var(--muted);
  }
  aside.detail .related li b { color: var(--text); font-weight: 400; }
  .small-hint { color: var(--muted); font-size: 11.5px; line-height: 1.5; }
  .rule-box {
    background: rgba(255, 107, 107, 0.07);
    border: 1px solid rgba(255, 107, 107, 0.3);
    border-radius: 6px;
    padding: 10px 12px;
    margin: 10px 0;
    font-size: 11.5px;
    color: #ffd1d1;
    line-height: 1.5;
  }
</style>
</head>
<body>
<header>
  <h1>Prozpr — Chat Turn Flow</h1>
  <span class="sub">drag folders to rearrange · click to expand · use the scenario buttons to highlight a single intent's sequence</span>
  <div class="controls">
    <button class="btn scenario-btn" data-scenario="rebalancing" title="Highlight the asset_allocation → rebalancing module sequence">Trace: rebalancing</button>
    <button class="btn scenario-btn" data-scenario="goal_planning" title="Highlight the cashflow-only sequence">Trace: goal_planning</button>
    <button class="btn scenario-btn" data-scenario="general_market_query" title="Highlight the market_commentary → general_chat sequence">Trace: market query</button>
    <button class="btn" id="btn-clear-trace">Clear trace</button>
    <button class="btn" id="btn-expand">Expand all</button>
    <button class="btn" id="btn-collapse">Collapse all</button>
    <button class="btn" id="btn-reset" title="Restore the original folder positions">Reset layout</button>
  </div>
</header>

<main>
  <div class="canvas-wrap" id="wrap">
    <div class="canvas" id="canvas">
      <svg class="edges" id="edges" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
                  markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
          </marker>
        </defs>
      </svg>
    </div>
  </div>

  <aside class="detail" id="detail">
    <h2 id="d-title">Legend</h2>
    <div id="d-body"></div>
  </aside>
</main>

<script>
"use strict";

/* ============================================================================
 * The new architecture (after the SEQUENCES refactor):
 *
 *    POST /chat/sessions/{id}/send
 *      → ChatBrain.run_turn
 *          1.  build_turn_context
 *          2.  intent_classifier_service.run   →  IntentDecision
 *          3.  SEQUENCES[intent.name]          →  ordered list of modules
 *          4.  for each module: outputs[m] = module.run(turn, ctx, outputs)
 *          5.  finalize → ChatBrainResult
 *
 * Rule: each AI module name maps to exactly ONE owning domain service
 * (asset_allocation, rebalancing, cashflow, portfolio_query, market_commentary,
 *  intent_classifier, general_chat). Nothing else in the codebase imports
 * the matching AI_Agents orchestrator — go through the module service.
 * ========================================================================== */


/* ---------------------------------------------------------------------------
 * FOLDERS — hand-positioned to match the flow story.
 * ------------------------------------------------------------------------- */

const FOLDERS = [
  // ---- 1. HTTP ---------------------------------------------------------------
  { id: "http", title: "HTTP entry", tone: "http",
    path: "app/domains/chat/routers/", x: 40, y: 540,
    files: [
      { id: "chat_router", name: "chat_router.py", fns: [
        { id: "send", name: "send_message", type: "http",
          desc: "POST /api/v1/chat/sessions/{id}/send. Builds a ChatTurnInput from the request, awaits ChatBrain.run_turn, persists the assistant message, returns ChatSendMessageResponse." },
      ]},
    ]},

  // ---- 2. Orchestrator -------------------------------------------------------
  { id: "orch", title: "Chat orchestrator", tone: "orch",
    path: "app/domains/ai_engine/services/chat_orchestrator/", x: 280, y: 420,
    files: [
      { id: "brain", name: "brain.py", fns: [
        { id: "run_turn", name: "ChatBrain.run_turn", type: "orch",
          desc: "Per-turn loop: build_turn_context → intent classifier → SEQUENCES lookup → run each module threading outputs → finalize. Wraps each module call in a 60s timeout." },
        { id: "sequence_for", name: "_sequence_for", type: "orch",
          desc: "Picks the module sequence: awaiting_save → cashflow; otherwise _SEQUENCES[intent.name]; unknown → general_chat fallback." },
        { id: "finalize", name: "_finalize", type: "orch",
          desc: "Shapes ChatBrainResult from the last module's ModuleOutput + writes per-turn telemetry under a 5s cap (best-effort)." },
      ]},
      { id: "turn_ctx", name: "turn_context.py", fns: [
        { id: "build_ctx", name: "build_turn_context", type: "orch",
          desc: "Loads history + last AgentRun per module + active_intent + awaiting_save into one frozen TurnContext. Failures degrade to empty ctx — the turn still runs." },
      ]},
    ]},

  // ---- 3. SEQUENCES (the new switch) ----------------------------------------
  { id: "sequences", title: "SEQUENCES (the switch)", tone: "sequence",
    path: "app/domains/ai_engine/services/chat_orchestrator/brain.py", x: 580, y: 460,
    files: [
      { id: "seq_table", name: "_SEQUENCES", fns: [
        { id: "seq_aa",   name: "asset_allocation → [AA]", type: "sequence",
          desc: "Just the asset allocation module — produces an Allocation and a formatted reply." },
        { id: "seq_rb",   name: "rebalancing → [AA, RB]", type: "sequence",
          desc: "Asset allocation FIRST so rebalancing has a fresh target to rebalance towards. The rebalancing module reads prior[asset_allocation].payload." },
        { id: "seq_gp",   name: "goal_planning → [CF]", type: "sequence",
          desc: "Cashflow module (goal planning is implemented via the cashflow_statement engine)." },
        { id: "seq_pq",   name: "portfolio_query → [PQ]", type: "sequence",
          desc: "Portfolio query module — read-only Q&A over the portfolio." },
        { id: "seq_mc",   name: "general_market_query → [MC, GC]", type: "sequence",
          desc: "Market commentary FIRST (produces a macro doc) then general_chat tailors the final reply using prior[market_commentary].payload." },
        { id: "seq_gc",   name: "general_chat → [GC]", type: "sequence",
          desc: "Bare general-chat fallback for off-spec questions." },
        { id: "seq_gate", name: "awaiting_save override", type: "sequence",
          desc: "If chat_session_state.awaiting_save=true, the sequence is forced to [CF] regardless of intent — the cashflow module owns the yes/no confirmation flow." },
      ]},
    ]},

  // ---- 4. Intent classifier (its OWN domain) --------------------------------
  { id: "ic_domain", title: "intent_classifier (domain)", tone: "classifier",
    path: "app/domains/intent_classifier/services/", x: 580, y: 100,
    files: [
      { id: "ic_service", name: "intent_classifier_service.py", fns: [
        { id: "ic_run", name: "run", type: "classifier",
          desc: "Uniform module signature: run(turn, ctx, prior) → ModuleOutput. Payload is the IntentDecision the brain uses to pick the sequence." },
      ]},
    ]},

  // ---- 5. AI module domain services -----------------------------------------
  { id: "aa_domain", title: "asset_allocation (domain)", tone: "module",
    path: "app/domains/asset_allocation/services/", x: 920, y: 260,
    files: [
      { id: "aa_module", name: "asset_allocation_module_service.py", fns: [
        { id: "aa_run", name: "run", type: "module",
          desc: "The ONLY caller of AI_Agents.asset_allocation_pydantic. Returns ModuleOutput with the Allocation payload (read by the rebalancing module when in the rebalancing sequence) and the formatted reply text." },
      ]},
      { id: "aa_persist", name: "allocation_persist_service.py", fns: [
        { id: "aa_persist_fn", name: "write_run", type: "persist",
          desc: "Atomic insert: asset_allocation_runs + run_targets + buckets + bucket children + aggregate." },
      ]},
    ]},

  { id: "rb_domain", title: "rebalancing (domain)", tone: "module",
    path: "app/domains/rebalancing/services/", x: 920, y: 460,
    files: [
      { id: "rb_module", name: "rebalancing_module_service.py", fns: [
        { id: "rb_run", name: "run", type: "module",
          desc: "The ONLY caller of AI_Agents.Rebalancing. Reads the upstream Allocation from prior[asset_allocation].payload — when REBALANCING_ENGINE_ENABLED=false, it surfaces that allocation directly as the reply." },
      ]},
      { id: "rb_persist", name: "rebalancing_persist_service.py", fns: [
        { id: "rb_persist_fn", name: "write_run", type: "persist",
          desc: "Atomic insert: rebalancing_runs + trades + warnings + fund rows + subgroup summaries." },
      ]},
    ]},

  { id: "cf_domain", title: "cashflow (domain)", tone: "module",
    path: "app/domains/cashflow/services/", x: 920, y: 660,
    files: [
      { id: "cf_module", name: "cashflow_module_service.py", fns: [
        { id: "cf_run", name: "run", type: "module",
          desc: "The ONLY caller of AI_Agents.cashflow_statement. Owns the goal_planning intent and the awaiting_save multi-turn save flow." },
      ]},
      { id: "cf_persist", name: "cashflow_persist_service.py", fns: [
        { id: "cf_persist_fn", name: "write_plan_run", type: "persist",
          desc: "Atomic insert: cashflow_plan_runs + headline + annual / monthly rows + fund-flow summary + plan summary." },
      ]},
    ]},

  { id: "pq_domain", title: "portfolio (domain)", tone: "module",
    path: "app/domains/portfolio/services/", x: 920, y: 860,
    files: [
      { id: "pq_module", name: "portfolio_query_module_service.py", fns: [
        { id: "pq_run", name: "run", type: "module",
          desc: "The ONLY caller of AI_Agents.portfolio_query. Read-only — never persists." },
      ]},
    ]},

  { id: "mc_domain", title: "market_commentary (domain)", tone: "module",
    path: "app/domains/market_commentary/services/", x: 920, y: 60,
    files: [
      { id: "mc_module", name: "market_commentary_module_service.py", fns: [
        { id: "mc_run", name: "run", type: "module",
          desc: "The ONLY caller of AI_Agents.market_commentary. Produces a macro doc in ModuleOutput.payload that the general_chat module reads from prior to tailor the final reply." },
      ]},
    ]},

  { id: "gc_module", title: "general_chat (in ai_engine)", tone: "module",
    path: "app/domains/ai_engine/services/", x: 920, y: 1000,
    files: [
      { id: "gc_file", name: "general_chat_module_service.py", fns: [
        { id: "gc_run", name: "run", type: "module",
          desc: "Fallback module + final step of the general_market_query sequence. Reads the IntentDecision from prior[intent_classifier].payload and the macro doc (if any) from prior[market_commentary].payload." },
      ]},
    ]},

  // ---- 6. AI_Agents (Anthropic via LangChain) -------------------------------
  { id: "agents", title: "AI_Agents (Claude via LangChain)", tone: "agent",
    path: "AI_Agents/src/  — ONLY callable by the matching module service",
    x: 1280, y: 400,
    files: [
      { id: "ag_ic", name: "intent_classifier/", fns: [
        { id: "ag_ic_run", name: "IntentClassifier.classify", type: "agent",
          desc: "Anthropic Haiku classification with structured output. Only intent_classifier_service may import this." },
      ]},
      { id: "ag_aa", name: "asset_allocation_pydantic/", fns: [
        { id: "ag_aa_run", name: "AllocationOrchestrator.run", type: "agent",
          desc: "Allocation engine. Only asset_allocation_module_service may import this." },
      ]},
      { id: "ag_rb", name: "Rebalancing/", fns: [
        { id: "ag_rb_run", name: "RebalancingEngine.run", type: "agent",
          desc: "Drift-aware rebalancing engine — trades + warnings. Only rebalancing_module_service may import this." },
      ]},
      { id: "ag_cf", name: "cashflow_statement/", fns: [
        { id: "ag_cf_run", name: "run_cashflow_statement", type: "agent",
          desc: "Cashflow projection — annual / monthly + headline. Only cashflow_module_service may import this." },
      ]},
      { id: "ag_pq", name: "portfolio_query/", fns: [
        { id: "ag_pq_run", name: "PortfolioQuery.answer", type: "agent",
          desc: "Portfolio Q&A over MF + equity + portfolio tables. Only portfolio_query_module_service may import this." },
      ]},
      { id: "ag_mc", name: "market_commentary/", fns: [
        { id: "ag_mc_run", name: "generate_commentary", type: "agent",
          desc: "Macro doc generator. Only market_commentary_module_service may import this." },
      ]},
    ]},

  // ---- 7. Telemetry ---------------------------------------------------------
  { id: "telemetry", title: "Telemetry", tone: "telemetry",
    path: "app/domains/chat/services/", x: 1640, y: 540,
    files: [
      { id: "tel", name: "ai_module_telemetry.py", fns: [
        { id: "rec_run", name: "record_ai_module_run", type: "telemetry",
          desc: "Per-module-call row: module name, intent, input/output payload, latency, success." },
        { id: "log_summary", name: "log_chat_turn_flow_summary", type: "telemetry",
          desc: "End-of-turn row: intent, confidence, ordered step list, total duration." },
      ]},
    ]},
];


/* ---------------------------------------------------------------------------
 * EDGES — {from, to, label, scenario, dashed?}.
 * `scenario` (optional) marks an edge as part of a specific intent's flow so
 * the "Trace" buttons can highlight one path at a time.
 *   "always"        — runs on every turn (HTTP, brain, classifier, telemetry)
 *   "rebalancing"   — the [AA, RB] sequence
 *   "goal_planning" — the [CF] sequence
 *   "general_market_query" — the [MC, GC] sequence
 *   "thread"        — output threading between modules
 * ------------------------------------------------------------------------- */

const EDGES = [
  // HTTP → brain
  { from: "send", to: "run_turn", label: "ChatTurnInput", scenario: "always" },
  { from: "run_turn", to: "send", label: "ChatBrainResult", scenario: "always" },

  // Brain → context
  { from: "run_turn", to: "build_ctx", label: "turn", scenario: "always" },
  { from: "build_ctx", to: "run_turn", label: "TurnContext", scenario: "always" },

  // Brain → intent classifier (always runs first)
  { from: "run_turn", to: "ic_run", label: "(turn, ctx, {})", scenario: "always" },
  { from: "ic_run", to: "ag_ic_run", label: "AI call", scenario: "always" },
  { from: "ag_ic_run", to: "ic_run", label: "ClassificationResult", scenario: "always" },
  { from: "ic_run", to: "run_turn", label: "ModuleOutput(payload=IntentDecision)", scenario: "always" },

  // Brain → SEQUENCES (the switch)
  { from: "run_turn", to: "sequence_for", label: "intent, ctx", scenario: "always" },
  { from: "sequence_for", to: "seq_table", label: "lookup", scenario: "always" },
  { from: "seq_table", to: "sequence_for", label: "[AIModule]", scenario: "always" },

  // ===== Rebalancing scenario: AA → RB =====
  { from: "run_turn", to: "aa_run", label: "step 1: AA", scenario: "rebalancing" },
  { from: "aa_run", to: "ag_aa_run", label: "AI call", scenario: "rebalancing" },
  { from: "aa_run", to: "aa_persist_fn", label: "write allocation", scenario: "rebalancing" },
  { from: "aa_run", to: "run_turn", label: "ModuleOutput(Allocation)", scenario: "rebalancing" },
  // Output threading from AA → RB via the prior_outputs dict
  { from: "aa_run", to: "rb_run", label: "prior[asset_allocation].payload", scenario: "thread", dashed: true },
  { from: "run_turn", to: "rb_run", label: "step 2: RB", scenario: "rebalancing" },
  { from: "rb_run", to: "ag_rb_run", label: "AI call", scenario: "rebalancing" },
  { from: "rb_run", to: "rb_persist_fn", label: "write rebalancing", scenario: "rebalancing" },
  { from: "rb_run", to: "run_turn", label: "ModuleOutput(text + ids)", scenario: "rebalancing" },

  // ===== Goal planning scenario: CF only =====
  { from: "run_turn", to: "cf_run", label: "step 1: CF", scenario: "goal_planning" },
  { from: "cf_run", to: "ag_cf_run", label: "AI call", scenario: "goal_planning" },
  { from: "cf_run", to: "cf_persist_fn", label: "write plan run", scenario: "goal_planning" },
  { from: "cf_run", to: "run_turn", label: "ModuleOutput", scenario: "goal_planning" },

  // ===== Market query scenario: MC → GC =====
  { from: "run_turn", to: "mc_run", label: "step 1: MC", scenario: "general_market_query" },
  { from: "mc_run", to: "ag_mc_run", label: "AI call (120s cap)", scenario: "general_market_query" },
  { from: "mc_run", to: "run_turn", label: "ModuleOutput(macro_doc)", scenario: "general_market_query" },
  // Threading
  { from: "mc_run", to: "gc_run", label: "prior[market_commentary].payload", scenario: "thread", dashed: true },
  { from: "run_turn", to: "gc_run", label: "step 2: GC", scenario: "general_market_query" },
  { from: "gc_run", to: "run_turn", label: "ModuleOutput(text)", scenario: "general_market_query" },

  // ===== Portfolio query (standalone) =====
  { from: "run_turn", to: "pq_run", label: "step 1: PQ", scenario: "portfolio_query" },
  { from: "pq_run", to: "ag_pq_run", label: "AI call", scenario: "portfolio_query" },
  { from: "pq_run", to: "run_turn", label: "ModuleOutput(text)", scenario: "portfolio_query" },

  // Brain → telemetry
  { from: "run_turn", to: "finalize", label: "final ModuleOutput", scenario: "always" },
  { from: "finalize", to: "log_summary", label: "5s cap", scenario: "always" },
];


/* ---------------------------------------------------------------------------
 * STATE
 * ------------------------------------------------------------------------- */

const state = {
  openFolders: new Set(),
  openFiles:   new Set(),
  selected:    null,
  scenario:    null,   // null | "rebalancing" | "goal_planning" | "general_market_query" | "portfolio_query"
};

const FN_BY_ID = {};
const FILE_BY_ID = {};
const FOLDER_BY_FN = {};
const FILE_BY_FN = {};
const FOLDER_BY_FILE = {};

for (const folder of FOLDERS) {
  for (const file of folder.files) {
    FILE_BY_ID[file.id] = file;
    FOLDER_BY_FILE[file.id] = folder.id;
    for (const fn of file.fns) {
      FN_BY_ID[fn.id] = fn;
      FOLDER_BY_FN[fn.id] = folder.id;
      FILE_BY_FN[fn.id]   = file.id;
    }
  }
}

function resolveAnchor(fnId) {
  const fileId   = FILE_BY_FN[fnId];
  const folderId = FOLDER_BY_FN[fnId];
  if (state.openFiles.has(fileId) && state.openFolders.has(folderId)) {
    return { kind: "fn", id: fnId };
  }
  if (state.openFolders.has(folderId)) {
    return { kind: "file", id: fileId };
  }
  return { kind: "folder", id: folderId };
}


/* ---------------------------------------------------------------------------
 * LAYOUT PERSISTENCE
 * ------------------------------------------------------------------------- */

const LAYOUT_KEY = "prozpr.chatflow.layout.v2";
const DEFAULT_POSITIONS = Object.fromEntries(FOLDERS.map(f => [f.id, { x: f.x, y: f.y }]));

function loadSavedLayout() {
  try {
    const raw = localStorage.getItem(LAYOUT_KEY);
    if (!raw) return;
    const saved = JSON.parse(raw);
    for (const folder of FOLDERS) {
      const pos = saved[folder.id];
      if (pos && typeof pos.x === "number" && typeof pos.y === "number") {
        folder.x = pos.x; folder.y = pos.y;
      }
    }
  } catch (_) {}
}
function saveLayout() {
  const out = Object.fromEntries(FOLDERS.map(f => [f.id, { x: f.x, y: f.y }]));
  try { localStorage.setItem(LAYOUT_KEY, JSON.stringify(out)); } catch (_) {}
}
function resetLayout() {
  for (const folder of FOLDERS) {
    const pos = DEFAULT_POSITIONS[folder.id];
    folder.x = pos.x; folder.y = pos.y;
  }
  try { localStorage.removeItem(LAYOUT_KEY); } catch (_) {}
}
loadSavedLayout();


/* ---------------------------------------------------------------------------
 * RENDER
 * ------------------------------------------------------------------------- */

const canvas = document.getElementById("canvas");
const edgesSvg = document.getElementById("edges");

const RULE_BADGE_FOLDERS = new Set([
  "ic_domain", "aa_domain", "rb_domain", "cf_domain", "pq_domain", "mc_domain", "gc_module",
]);

function render() {
  for (const el of [...canvas.children]) if (el !== edgesSvg) el.remove();

  for (const folder of FOLDERS) {
    const isOpen = state.openFolders.has(folder.id);
    const fEl = document.createElement("div");
    fEl.className = "folder" + (isOpen ? " open" : "") + (state.selected === folder.id ? " selected" : "");
    fEl.dataset.tone = folder.tone;
    fEl.dataset.id   = folder.id;
    fEl.dataset.kind = "folder";
    fEl.style.left = folder.x + "px";
    fEl.style.top  = folder.y + "px";
    const ruleBadge = RULE_BADGE_FOLDERS.has(folder.id)
      ? `<span class="rule-badge" title="Only this domain's service may import the matching AI_Agents orchestrator">sole gateway</span>` : "";
    fEl.innerHTML = `
      <div class="ftitle">
        <span class="toggle">${isOpen ? "▾" : "▸"}</span>
        ${escapeHtml(folder.title)}
        ${ruleBadge}
        <span class="badge">${folder.files.length}</span>
      </div>
      <div class="fpath">${escapeHtml(folder.path)}</div>
    `;
    canvas.appendChild(fEl);

    if (isOpen) {
      let cursorY = folder.y + 64;
      const fileX = folder.x + 18;
      for (const file of folder.files) {
        const fileOpen = state.openFiles.has(file.id);
        const flEl = document.createElement("div");
        flEl.className = "file" + (fileOpen ? " open" : "") + (state.selected === file.id ? " selected" : "");
        flEl.dataset.id   = file.id;
        flEl.dataset.kind = "file";
        flEl.style.left = fileX + "px";
        flEl.style.top  = cursorY + "px";
        flEl.innerHTML = `
          <div class="ftitle">
            <span class="toggle">${fileOpen ? "▾" : "▸"}</span>
            ${escapeHtml(file.name)}
          </div>
        `;
        canvas.appendChild(flEl);
        cursorY += 34;

        if (fileOpen) {
          const fnX = fileX + 16;
          for (const fn of file.fns) {
            const fnEl = document.createElement("div");
            fnEl.className = "fn" + (state.selected === fn.id ? " selected" : "");
            fnEl.dataset.type = fn.type;
            fnEl.dataset.id   = fn.id;
            fnEl.dataset.kind = "fn";
            fnEl.style.left = fnX + "px";
            fnEl.style.top  = cursorY + "px";
            fnEl.innerHTML = `<span class="dot" style="background:var(--t-${fn.type})"></span>${escapeHtml(fn.name)}`;
            canvas.appendChild(fnEl);
            cursorY += 28;
          }
        }
      }
    }
  }

  requestAnimationFrame(drawEdges);
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}


/* ---------------------------------------------------------------------------
 * EDGES — bezier paths with anchor on whichever side faces the target.
 * Scenario highlighting dims everything not on the selected path.
 * ------------------------------------------------------------------------- */

function isEdgeOnScenario(edge) {
  if (!state.scenario) return true;
  return edge.scenario === "always" || edge.scenario === state.scenario ||
         (edge.scenario === "thread" && state.scenario);
}

function drawEdges() {
  for (const child of [...edgesSvg.children]) {
    if (child.tagName !== "defs") child.remove();
  }
  const canvasRect = canvas.getBoundingClientRect();

  const drawn = new Map();
  const segments = [];

  for (const edge of EDGES) {
    const aFrom = resolveAnchor(edge.from);
    const aTo   = resolveAnchor(edge.to);
    if (aFrom.id === aTo.id && aFrom.kind === aTo.kind) continue;
    const fk = aFrom.kind + ":" + aFrom.id;
    const tk = aTo.kind   + ":" + aTo.id;
    const key = fk + "→" + tk + "::" + (edge.scenario || "");
    if (drawn.has(key)) {
      drawn.get(key).count += 1;
      continue;
    }
    drawn.set(key, { count: 1 });
    segments.push({
      key, from: aFrom, to: aTo, label: edge.label,
      sourceFnId: edge.from, scenario: edge.scenario || "always",
      dashed: !!edge.dashed,
      onScenario: isEdgeOnScenario(edge),
    });
  }

  for (const seg of segments) {
    const fromEl = canvas.querySelector(`[data-id="${seg.from.id}"][data-kind="${seg.from.kind}"]`);
    const toEl   = canvas.querySelector(`[data-id="${seg.to.id}"][data-kind="${seg.to.kind}"]`);
    if (!fromEl || !toEl) continue;

    const fromRect = fromEl.getBoundingClientRect();
    const toRect   = toEl.getBoundingClientRect();

    const fromCenterX = fromRect.left + fromRect.width / 2;
    const toCenterX   = toRect.left   + toRect.width / 2;
    const goingRight  = toCenterX > fromCenterX;

    const x1 = (goingRight ? fromRect.right : fromRect.left) - canvasRect.left;
    const y1 = fromRect.top  + fromRect.height / 2 - canvasRect.top;
    const x2 = (goingRight ? toRect.left    : toRect.right ) - canvasRect.left;
    const y2 = toRect.top    + toRect.height / 2 - canvasRect.top;

    const dx = Math.abs(x2 - x1);
    const c  = Math.max(40, Math.min(120, dx * 0.4));
    const d  = `M ${x1} ${y1} C ${x1 + (goingRight ? c : -c)} ${y1}, ${x2 - (goingRight ? c : -c)} ${y2}, ${x2} ${y2}`;

    const stroke = edgeColor(seg.sourceFnId);
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", d);
    path.setAttribute("stroke", stroke);
    path.setAttribute("style", `color: ${stroke}`);
    path.setAttribute("marker-end", "url(#arrow)");
    if (seg.dashed) path.classList.add("dashed");
    if (state.scenario && !seg.onScenario) path.classList.add("dim");
    else if (state.scenario && seg.onScenario && seg.scenario !== "always") path.classList.add("hi");
    edgesSvg.appendChild(path);

    if (seg.label) {
      const lx = (x1 + x2) / 2;
      const ly = (y1 + y2) / 2 - 4;
      const txt = document.createElementNS("http://www.w3.org/2000/svg", "text");
      txt.setAttribute("x", lx);
      txt.setAttribute("y", ly);
      txt.setAttribute("text-anchor", "middle");
      if (state.scenario && seg.onScenario && seg.scenario !== "always") txt.classList.add("hi");
      if (state.scenario && !seg.onScenario) txt.style.opacity = "0.18";
      txt.textContent = seg.label;
      edgesSvg.appendChild(txt);
    }
  }
}

function edgeColor(fromFnId) {
  const sourceType = FN_BY_ID[fromFnId]?.type;
  const palette = {
    http: "var(--t-http)", orch: "var(--t-orch)", classifier: "var(--t-classifier)",
    sequence: "var(--t-sequence)", module: "var(--t-module)", agent: "var(--t-agent)",
    persist: "var(--t-persist)", telemetry: "var(--t-telemetry)",
  };
  return palette[sourceType] || "var(--muted)";
}


/* ---------------------------------------------------------------------------
 * INTERACTION — click to expand, drag folders to reposition, scenario buttons.
 * ------------------------------------------------------------------------- */

const DRAG_THRESHOLD_PX = 4;
const drag = { active: false, moved: false, id: null,
               startMouseX: 0, startMouseY: 0, origX: 0, origY: 0 };
let suppressNextClick = false;

canvas.addEventListener("mousedown", (e) => {
  if (e.button !== 0) return;
  const target = e.target.closest("[data-kind='folder']");
  if (!target) return;
  const folder = FOLDERS.find(f => f.id === target.dataset.id);
  if (!folder) return;
  drag.active = true; drag.moved = false; drag.id = folder.id;
  drag.startMouseX = e.clientX; drag.startMouseY = e.clientY;
  drag.origX = folder.x; drag.origY = folder.y;
  e.preventDefault();
});

window.addEventListener("mousemove", (e) => {
  if (!drag.active) return;
  const dx = e.clientX - drag.startMouseX;
  const dy = e.clientY - drag.startMouseY;
  if (!drag.moved && Math.hypot(dx, dy) >= DRAG_THRESHOLD_PX) {
    drag.moved = true;
    const fEl = canvas.querySelector(`[data-kind="folder"][data-id="${drag.id}"]`);
    if (fEl) fEl.classList.add("dragging");
  }
  if (!drag.moved) return;
  const folder = FOLDERS.find(f => f.id === drag.id);
  folder.x = Math.max(0, drag.origX + dx);
  folder.y = Math.max(0, drag.origY + dy);
  render();
});

window.addEventListener("mouseup", () => {
  if (!drag.active) return;
  const wasMoved = drag.moved;
  const draggedId = drag.id;
  drag.active = false; drag.moved = false; drag.id = null;
  const fEl = canvas.querySelector(`[data-kind="folder"][data-id="${draggedId}"]`);
  if (fEl) fEl.classList.remove("dragging");
  if (wasMoved) { suppressNextClick = true; saveLayout(); }
});

canvas.addEventListener("click", (e) => {
  if (suppressNextClick) { suppressNextClick = false; return; }
  const target = e.target.closest("[data-kind]");
  if (!target) return;
  const kind = target.dataset.kind;
  const id   = target.dataset.id;

  if (kind === "folder") {
    if (state.openFolders.has(id)) {
      state.openFolders.delete(id);
      for (const f of FOLDERS.find(x => x.id === id).files) state.openFiles.delete(f.id);
    } else {
      state.openFolders.add(id);
    }
    state.selected = id;
  } else if (kind === "file") {
    if (state.openFiles.has(id)) state.openFiles.delete(id);
    else state.openFiles.add(id);
    state.selected = id;
  } else if (kind === "fn") {
    state.selected = id;
  }

  render();
  showDetail(kind, id);
});

document.getElementById("btn-expand").addEventListener("click", () => {
  state.openFolders = new Set(FOLDERS.map(f => f.id));
  state.openFiles   = new Set(Object.keys(FILE_BY_ID));
  render();
});
document.getElementById("btn-collapse").addEventListener("click", () => {
  state.openFolders.clear(); state.openFiles.clear(); state.selected = null;
  render(); showLegend();
});
document.getElementById("btn-reset").addEventListener("click", () => {
  resetLayout(); render();
});

document.querySelectorAll(".scenario-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    const sc = btn.dataset.scenario;
    state.scenario = (state.scenario === sc) ? null : sc;
    document.querySelectorAll(".scenario-btn").forEach(b => b.classList.toggle("active", b.dataset.scenario === state.scenario));
    drawEdges();
  });
});
document.getElementById("btn-clear-trace").addEventListener("click", () => {
  state.scenario = null;
  document.querySelectorAll(".scenario-btn").forEach(b => b.classList.remove("active"));
  drawEdges();
});


/* ---------------------------------------------------------------------------
 * DETAIL PANEL
 * ------------------------------------------------------------------------- */

const dTitle = document.getElementById("d-title");
const dBody  = document.getElementById("d-body");

function showDetail(kind, id) {
  if (kind === "fn") {
    const fn   = FN_BY_ID[id];
    const file = FILE_BY_ID[FILE_BY_FN[id]];
    const fld  = FOLDERS.find(f => f.id === FOLDER_BY_FN[id]);
    dTitle.textContent = fn.name;
    const inEdges  = EDGES.filter(e => e.to   === id);
    const outEdges = EDGES.filter(e => e.from === id);
    dBody.innerHTML = `
      <h3>Type</h3>
      <div style="display:flex; align-items:center; gap:8px;">
        <span style="width:11px;height:11px;border-radius:50%;background:var(--t-${fn.type})"></span>
        <code>${escapeHtml(fn.type)}</code>
      </div>
      <h3>Where</h3>
      <code>${escapeHtml(fld.path)}${escapeHtml(file.name)}</code>
      <h3>What it does</h3>
      <p class="desc">${escapeHtml(fn.desc)}</p>
      ${renderEdgeList("Called by", inEdges, "from")}
      ${renderEdgeList("Calls", outEdges, "to")}
    `;
  } else if (kind === "file") {
    const file = FILE_BY_ID[id];
    const fld  = FOLDERS.find(f => f.id === FOLDER_BY_FILE[id]);
    dTitle.textContent = file.name;
    dBody.innerHTML = `
      <h3>Where</h3>
      <code>${escapeHtml(fld.path)}${escapeHtml(file.name)}</code>
      <h3>Functions in this file</h3>
      <ul class="related">
        ${file.fns.map(f => `<li><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--t-${f.type});margin-right:6px"></span><b>${escapeHtml(f.name)}</b> — ${escapeHtml(f.desc)}</li>`).join("")}
      </ul>
    `;
  } else if (kind === "folder") {
    const fld = FOLDERS.find(f => f.id === id);
    dTitle.textContent = fld.title;
    const isGateway = RULE_BADGE_FOLDERS.has(fld.id);
    dBody.innerHTML = `
      <h3>Path</h3>
      <code>${escapeHtml(fld.path)}</code>
      ${isGateway ? `<div class="rule-box"><b>Sole gateway rule.</b> This domain's <code>*_module_service.py</code> is the ONLY code in the repo allowed to import the matching <code>AI_Agents</code> orchestrator. Search the codebase for the AI_Agents package name to verify.</div>` : ""}
      <h3>Files</h3>
      <ul class="related">
        ${fld.files.map(file => `<li><b>${escapeHtml(file.name)}</b> — ${file.fns.length} fn${file.fns.length === 1 ? "" : "s"}</li>`).join("")}
      </ul>
    `;
  }
}

function renderEdgeList(title, edges, side) {
  if (!edges.length) return "";
  return `
    <h3>${escapeHtml(title)}</h3>
    <ul class="related">
      ${edges.map(e => {
        const other = e[side];
        const fn = FN_BY_ID[other];
        return `<li><b>${escapeHtml(fn ? fn.name : other)}</b>${e.label ? ` <span style="color:var(--muted)">— ${escapeHtml(e.label)}</span>` : ""}</li>`;
      }).join("")}
    </ul>
  `;
}

function showLegend() {
  dTitle.textContent = "Chat flow — overview";
  dBody.innerHTML = `
    <p class="small-hint">
      The brain runs a chat turn as an ordered <b>sequence of AI modules</b>. The intent
      classifier always runs first; the brain then looks up <code>SEQUENCES[intent.name]</code>
      and runs each module in turn, threading every module's output into the next.
    </p>
    <div class="rule-box">
      <b>Sole gateway rule.</b> Each AI module domain (<code>intent_classifier</code>,
      <code>asset_allocation</code>, <code>rebalancing</code>, <code>cashflow</code>,
      <code>portfolio</code>, <code>market_commentary</code>, plus <code>general_chat</code>
      in <code>ai_engine</code>) owns a <code>*_module_service.py</code> that is the ONLY
      thing in the codebase allowed to import the matching <code>AI_Agents</code>
      orchestrator. Folders that hold a sole gateway are tagged
      <span style="background:rgba(255,107,107,0.13);color:#ff9b9b;border:1px solid rgba(255,107,107,0.35);border-radius:9px;padding:0 5px;font-size:9px;text-transform:uppercase">sole gateway</span>.
    </div>
    <h3>Try a trace</h3>
    <p class="small-hint">
      Click one of the <b>Trace</b> buttons in the header to highlight a single intent's
      sequence. Solid arrows are direct calls; dashed arrows are <i>output threading</i>
      (one module's payload landing in the next module's <code>prior</code> dict).
    </p>
    <h3>Function types</h3>
    <div class="legend">
      <div class="row"><span class="swatch" style="background: var(--t-http)"></span>HTTP entry (FastAPI route)</div>
      <div class="row"><span class="swatch" style="background: var(--t-orch)"></span>Orchestrator (the brain loop)</div>
      <div class="row"><span class="swatch" style="background: var(--t-classifier)"></span>Intent classifier (its own domain)</div>
      <div class="row"><span class="swatch" style="background: var(--t-sequence)"></span>SEQUENCES table (the switch)</div>
      <div class="row"><span class="swatch" style="background: var(--t-module)"></span>AI module domain service</div>
      <div class="row"><span class="swatch" style="background: var(--t-agent)"></span>AI_Agents orchestrator</div>
      <div class="row"><span class="swatch" style="background: var(--t-persist)"></span>DB persistence</div>
      <div class="row"><span class="swatch" style="background: var(--t-telemetry)"></span>Telemetry</div>
    </div>
    <h3>Usage</h3>
    <p class="small-hint">
      Drag any folder to rearrange. Click a folder to expand it; click a file to drill
      into its functions; click a function to see its callers and callees in this panel.
    </p>
  `;
}


/* ---------------------------------------------------------------------------
 * BOOT
 * ------------------------------------------------------------------------- */

window.addEventListener("resize", () => requestAnimationFrame(drawEdges));
render();
showLegend();
</script>
</body>
</html>
