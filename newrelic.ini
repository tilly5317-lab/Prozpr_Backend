# =============================================================================
# New Relic Python agent configuration — Prozpr_Backend (Ask PI API).
#
# Loaded by app/core/observability.py:init_newrelic() at app boot. Contains NO
# secrets: the license key and app name come from the environment (.env), so
# this file is safe to commit. Environment variables OVERRIDE anything here:
#   NEW_RELIC_LICENSE_KEY   (required — agent is a no-op without it)
#   NEW_RELIC_APP_NAME      (overrides app_name below)
#   NEW_RELIC_ENVIRONMENT   (selects the [newrelic:<env>] section, e.g. production)
#
# Docs: https://docs.newrelic.com/docs/apm/agents/python-agent/configuration/python-agent-configuration/
# =============================================================================

[newrelic]

# Service name shown in New Relic APM. Override per-environment with
# NEW_RELIC_APP_NAME (e.g. "Prozpr Backend (Production)").
app_name = Prozpr Backend

# Provided via NEW_RELIC_LICENSE_KEY env var (see .env). Left blank on purpose.
license_key =

# true = report to New Relic. Disabled per-environment below for development.
monitor_mode = true

# Agent self-diagnostic log. "stderr" routes it into PM2's merged process log
# (see ecosystem.config.cjs) rather than a separate file on disk.
log_file = stderr
log_level = info

# Don't strip request params etc. for an internal service; flip on for PII lockdown.
high_security = false

# Distributed tracing across services + the chat/agent pipeline.
distributed_tracing.enabled = true

# Transaction (slow-request) traces.
transaction_tracer.enabled = true
transaction_tracer.transaction_threshold = apdex_f
transaction_tracer.record_sql = obfuscated
transaction_tracer.stack_trace_threshold = 0.5

# --- Error tracking -------------------------------------------------------
# Captures unhandled exceptions automatically; app/core/exceptions.py also
# reports handler-caught 5xx errors via newrelic.agent.notice_error().
error_collector.enabled = true
# 4xx are client errors — don't page on them. (FastAPI raises 404/422/401 etc.)
error_collector.ignore_status_codes = 400 401 403 404 405 409 422

# --- Application logs (logs in context) -----------------------------------
# Forwards stdlib `logging` records straight to New Relic Logs, correlated with
# the originating trace. This is the "backend logs" pipeline; no extra wiring
# needed because the whole app logs through the stdlib logging module.
application_logging.enabled = true
application_logging.forwarding.enabled = true
application_logging.forwarding.max_samples_stored = 10000
application_logging.metrics.enabled = true
# Leave local log lines untouched (PM2 still captures clean stdout/stderr).
application_logging.local_decorating.enabled = false

# This is an API service, not a browser app — no page-load JS injection.
browser_monitoring.auto_instrument = false


# --- Per-environment overrides (selected via NEW_RELIC_ENVIRONMENT) --------

[newrelic:development]
monitor_mode = false
log_level = debug

[newrelic:staging]
app_name = Prozpr Backend (Staging)
monitor_mode = true

[newrelic:production]
app_name = Prozpr Backend (Production)
monitor_mode = true
