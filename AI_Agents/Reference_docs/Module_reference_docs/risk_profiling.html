# `risk_profiling` — one traceable risk number, plus a plain-English summary

> **One line:** turn a client's age, balance sheet and stated appetite into a single **`effective_risk_score` in [1, 10]** — computed by hand-written arithmetic that is fully reproducible — then let Haiku write *only* the warm summary paragraph that explains the number back to the customer.
>
> This is the engineer's guide to the module. For the client-facing philosophy (the "two questions that look like one" thesis), see [Logics_reference_docs/Risk_Profiling.md](../Logics_reference_docs/Risk_Profiling.md). For where every agent sits in the package, see [Tech_reference_docs/ARCHITECTURE.html](../Tech_reference_docs/ARCHITECTURE.html).

## 1. What it's about

The module lives at [`AI_Agents/src/risk_profiling/`](../../src/risk_profiling/). It answers one question the whole downstream allocation stack depends on: **how much risk should this client's portfolio carry?** The answer is a number in `[1, 10]` — the `effective_risk_score` — plus the supporting flags and a customer-facing paragraph.

It is **not a chat intent**. Nothing in the intent classifier routes here. It runs when a client's profile is written (risk answers, finances, onboarding), after a portfolio or statement sync, or on a manual recalculate call — always through the app-layer `_effective_risk` service — and its persisted `effective_risk_score` is later read — *caller-wired, not imported* — by the asset-allocation input builder (see §2). Age is re-derived from date of birth on every recompute, so a birthday reaches the score at the next trigger; no scheduled job runs it.

The defining design decision mirrors `mutual_fund_query`'s in spirit but inverts the ratio: **the numbers are done before the LLM is ever called.** Every score, flag and category is produced by deterministic Python in [`scoring.py`](../../src/risk_profiling/scoring.py). Haiku's only job is [`main.py`](../../src/risk_profiling/main.py)'s trailing step — turn those computed values into 4–5 warm sentences without ever restating a raw score or exposing an internal field name.

```mermaid
flowchart LR
    IN([RiskProfileInput<br/>age · finances · willingness]) --> SC["<b>scoring.py</b><br/>compute_all_scores<br/>Steps A–E · pure Python"]
    SC --> DOC[("open dict<br/>step_name / inputs /<br/>calculations / output")]
    DOC --> LLM["<b>main.py</b> · _generate_summary<br/>Haiku writes ONLY<br/>output.risk_summary"]
    LLM --> OUT([same dict, now with<br/>effective_risk_score + risk_summary])
```

Two things make this shape robust: the scores never depend on the LLM (so a summary failure can't corrupt a number), and the arithmetic is deterministic (so the same profile always yields the same score, category and flags — only the prose can vary). The two steps still run as one unit in production: if the Haiku call fails, nothing is persisted and the previous assessment stays in place (§8).

---

## 2. Where it sits

The engine is a peer agent: it imports **no other agent**, only the shared [`common.py`](../../src/common.py) (`category_for_effective_risk_score`, `format_inr_indian`) and [`persona.py`](../../src/persona.py) (`build_system_prompt`). Everything database-shaped — persistence, incremental re-merge, deriving the willingness input — is the app layer's job.

| Direction | Who | What flows |
|---|---|---|
| **Upstream (trigger)** | `maybe_recalculate_effective_risk` → `upsert_effective_risk_assessment` in [`_effective_risk/service.py`](../../../app/domains/profile/services/_effective_risk/service.py) → [`_effective_risk/merge.py`](../../../app/domains/profile/services/_effective_risk/merge.py) | profile, onboarding and portfolio/ingest routes call it after their write (best-effort — it never raises to the route); `build_computation_input` derives fresh inputs from the DB, `merge_computation_inputs` refreshes only the trigger's own inputs (plus `age`) and carries the rest forward from the stored `inputs`, and scoring then reruns in full (table below) |
| **Gateway (the only caller)** | [`_effective_risk/calculation.py`](../../../app/domains/profile/services/_effective_risk/calculation.py) → `compute_effective_risk_document` | builds the plain-`dict` payload (age truncated to `int`, an `occupation_type` outside `OSI_MAP` mapped to `private_sector`, `risk_willingness` clamped to `[1,10]`) and calls `run_risk_profiling(payload, api_key=get_settings().get_anthropic_risk_profiling_key())` — `RISK_PROFILING_API_KEY`, falling back to `ANTHROPIC_API_KEY`; `service.py` runs it via `asyncio.to_thread` so the sync LLM call never blocks the event loop |
| **Willingness source** | app-layer [`_effective_risk/inputs.py`](../../../app/domains/profile/services/_effective_risk/inputs.py) → `derive_risk_willingness` → **this module's** [`willingness.py`](../../src/risk_profiling/willingness.py) `compute_risk_willingness` | `risk_willingness ∈ [1,10]` is handed in **already resolved**: an explicit stored `RiskProfile.risk_willingness` wins; otherwise the 4-question model (`risk_level` → Q1 plus the three behavioural sentences); otherwise the neutral `5.0` (also used when the customer has no `RiskProfile` row) — §5, §8 |
| **Downstream consumer** | [`asset_allocation/…/aa_engine/input_builder.py`](../../../app/domains/asset_allocation/services/aa_engine/input_builder.py) `build_goal_allocation_input_for_user` | reads the persisted row onto `AllocationInput` — **caller-wired data, not a package import**: `effective_risk_score` (clamped to `[1,10]`; `7.0` when the customer has no row), the `risk_capacity_score` / `risk_willingness` columns, and `calculations.osi`, `savings_rate_adjustment`, `gap_exceeds_3`. The practical input builder wraps this function, so ideal, practical, rebalancing, additional-investment and preferences-screen runs all take the score from here. A chat allocation what-if (`counterfactual_explore`) can substitute a score for one turn via `chat_overrides`; it never re-runs this module or touches the stored row |
| **Other readers** | `GET /profile/effective-risk` (profile router); [`portfolio_query_service.py`](../../../app/domains/portfolio/services/portfolio_query_service.py) | the stored assessment as-is; `effective_risk_score` for the portfolio-query client context |

> **The engine touches no DB.** If you are looking for "where does the stored score get read", it is the AA input builder in the app layer — the engine only ever returns the dict. And note the entry point the app calls is **`run_risk_profiling`**, which threads an explicit `api_key` for per-module spend attribution; the LCEL `risk_profiling_chain` is dev-tooling only. A recompute does not itself re-run any allocation; engines pick the new score up the next time they build their input.

### What triggers a recompute

Each caller passes a `trigger_reason`; `merge.py`'s `_MERGE_KEYS_BY_TRIGGER` decides which inputs are re-read from the DB. `age` is always refreshed; with no stored assessment yet, every input is fresh.

| `trigger_reason` | Fired by | Inputs refreshed from the DB |
|---|---|---|
| `risk_profile_update` | `PUT /profile/risk` | `occupation_type`, `risk_willingness` (+ `age`) |
| `investment_profile_update` | `PUT /profile/investment` | income, expense, financial assets, liabilities, mortgage, properties (+ `age`) |
| `onboarding_profile_update` | `POST /onboarding/profile` | `age`, `annual_income`, `annual_expense` |
| `portfolio_allocation_update` · `finvu_portfolio_sync` · `simbanks_sync` | `PUT /portfolio/allocations` · `POST /portfolio/finvu/sync` (deprecated route) · `POST /simbanks/sync` | `age` only |
| `personal_finance_update` · `cams_pdf_ingest` · `onboarding_generation` · `manual` | `PUT /profile/personal-finance` · `POST /mf-ingest/cams-pdf` · the onboarding-generation job · `POST /profile/effective-risk/recalculate` (optional `as_of` date for age) | all inputs — a trigger absent from the merge table, or `manual`, is a full refresh |

The merge table also defines `birthday` and `scheduled` (age-only), but nothing fires them. A customer with no date of birth is skipped (no row is written; the AA input builder then uses its `7.0` default), and a merge error falls back to the full fresh inputs. Every recompute logs `Effective risk recomputed user=… trigger=… effective_risk_score a -> b | risk_willingness a -> b`, and `PUT /profile/risk` also logs which questionnaire answers changed.

## 3. Input contract

The documented shape is `RiskProfileInput` in [`models.py`](../../src/risk_profiling/models.py). In production, though, the gateway passes a **plain `dict`** with these exact keys — the pydantic model is the contract-on-paper and dev-tooling validator, not what crosses the boundary at runtime. The production source of each field is `build_computation_input` in [`_effective_risk/inputs.py`](../../../app/domains/profile/services/_effective_risk/inputs.py); the household-finance scalars come through `profile_finance` (the same resolver cashflow and allocation use), each floored at `0`.

| Field | Type | Notes |
|---|---|---|
| `age` | `int` | years from `users.date_of_birth` (days ÷ 365.25), truncated to `int` at the gateway; clamped to `[20, 90]` inside Step A. No DOB ⇒ no recompute |
| `occupation_type` | `OccupationType` literal | one of six; keys `OSI_MAP` — but OSI does **not** move the score (§8). Read from `risk_profiles.occupation_type`, `private_sector` when unset or unrecognised |
| `annual_income` | `float` | `personal_finance_profiles.annual_income`; `0` ⇒ savings-rate step skips (sentinel path) |
| `annual_expense` | `float` | `monthly_household_expense × 12` |
| `financial_assets` | `float` | `personal_finance_profiles.financial_assets`; `≤ 0` → `current_debt_percent` sentinel `999.0` ("no financial assets"); expense-coverage collapses to ratio `0.0`, score `1.0` |
| `liabilities_excluding_mortgage` | `float` | `financial_liabilities_excl_mortgage`; feeds `current_debt_percent` and the reported `net_financial_assets` |
| `annual_mortgage_payment` | `float` | counts against expense-coverage + debt, but not as a `liability`. **The live derivation always yields `0`** (§8) |
| `properties_owned` | `int` | `0`, `1`, or `>1` — three-way score. **The live derivation always yields `0`** (§8) |
| `risk_willingness` | `float`, `ge=1, le=10` | **supplied by the caller** — resolved by `derive_risk_willingness` via this module's 4-question `willingness.py` model (§5), clamped to `[1,10]` at the gateway |

---

## 4. Output contract

The engine returns an **open `dict`**, not a fixed pydantic model — the app layer indexes it by key and persists it. The shape:

```
{
  "step_name": "risk_profile",
  "inputs":   { …the payload echoed back verbatim… },
  "calculations": {
     "clamped_age", "age_anchor_low", "age_anchor_high",
     "age_based_score", "age_calculation",
     "savings_rate", "savings_rate_adjustment", "savings_rate_boost_pct",
     "net_financial_assets", "expense_coverage_ratio", "expense_coverage_score",
     "current_debt_percent", "current_debt_score", "own_property_score",
     "net_asset_score",
     "risk_capacity_score_raw", "risk_capacity_score_clamped",
     "was_clamped", "clamp_direction",
     "osi", "osi_category",
     "willingness_capacity_gap", "gap_exceeds_3",
     "effective_risk_score_formula", "risk_profile_category"
  },
  "output": {
     "effective_risk_score": <float, 1 dp>,   # the headline number
     "risk_summary": "<Haiku paragraph>"       # empty string until the LLM step runs
  }
}
```

The two load-bearing outputs are **`output.effective_risk_score`** (consumed downstream) and **`output.risk_summary`** (shown to the customer). `calculations.risk_profile_category` is the human-readable band (Conservative → Aggressive) from `category_for_effective_risk_score`; `gap_exceeds_3` is the "let's talk before allocating" flag.

`service.py` persists one row per user in `effective_risk_assessments` ([`EffectiveRiskAssessment`](../../../app/domains/profile/models/effective_risk_assessment.py), unique `user_id`, upserted in place): the whole dict as `payload`, `calculations` and `output` as their own JSONB columns, and three scalar columns — `effective_risk_score`, `risk_capacity_score` (= `calculations.risk_capacity_score_clamped`) and `risk_willingness` (= `inputs.risk_willingness`) — plus `trigger_reason` and `computed_at`. The stored `payload.inputs` is what the next incremental recompute carries forward.

---

## 5. How it thinks

Scoring is five deterministic steps ([`scoring.py`](../../src/risk_profiling/scoring.py) `compute_all_scores`), then one LLM prose step ([`main.py`](../../src/risk_profiling/main.py) `_generate_summary`). Each score row below links the code that owns it.

```mermaid
flowchart TD
    A["A · age → base capacity<br/>_age_score"] --> C2
    B["B · savings-rate signal<br/>_savings_adjustment<br/>(narrative only)"]:::narr
    C["C · assets &amp; liabilities → net_asset_score<br/>_asset_scores"] --> C2["C-cont · risk_capacity<br/>_risk_capacity + clamp"]
    C2 --> E["D/E · blend + OSI + gap + category<br/>compute_all_scores tail"]
    B -. informs summary, not score .-> LLM["Haiku · risk_summary"]
    E --> LLM
    classDef narr fill:#faf5ee,stroke:#ecdcc6;
```

| Step | File / fn | What it computes |
|---|---|---|
| **A — Age → base capacity** | [`scoring.py`](../../src/risk_profiling/scoring.py) `_age_score` | piecewise-linear interpolation over `AGE_ANCHORS` (20→10, 30→9, 40→8, 50→7, 55→6, 60→5, 65→4, 70→3, 80→2, 90→1), age clamped to `[20,90]` |
| **B — Savings-rate signal** | `_savings_adjustment` | `savings_rate = (income−expense)/income`; `<0.01` → `equity_reduce`, `>0.20` → `equity_boost` (boost % = `min(30, (rate−0.20)/0.40·30)`), else `none`; income `0` → `skipped` with `savings_rate = None`. **Informational — it does not move the score** (§8) |
| **C — Assets & liabilities** | `_asset_scores` | coverage ratio `= assets / (expense + mortgage)` → score `1` below `0.5×`, `10` above `12×`, linear between; debt % `= 100·(liabilities + mortgage) / assets` → score `10` below `6%`, `1` above `100%`, linear between; property score `10` (>1 owned) / `8` (1) / `2` (0). `net_asset_score = 0.40·expense_coverage_score + 0.30·current_debt_score + 0.30·own_property_score` |
| **C-cont — Risk capacity** | `_risk_capacity` | `raw = age_based_score + 0.50·(net_asset_score − 5)`, then **clamped to `[1,10]`** (`was_clamped` / `clamp_direction` record if it hit a rail) |
| **D/E — Blend, OSI, flag, band** | `compute_all_scores` tail | `effective_risk_score = round(0.7·willingness + 0.3·capacity, 1)`; `osi = OSI_MAP[occupation]` (recorded, **not** blended); `gap = \|willingness − capacity\|`, `gap_exceeds_3 = gap > 3`; category via `common.category_for_effective_risk_score`: below `2.125` Conservative · below `4.375` Moderately Conservative · below `6.625` Moderate · below `8.875` Moderately Aggressive · else Aggressive |

### The willingness input

`risk_willingness` is scored before this pipeline runs, by [`willingness.py`](../../src/risk_profiling/willingness.py) `compute_risk_willingness`, which the app's `derive_risk_willingness` calls with the customer's stored answers:

| Question | Stored as | Contributes |
|---|---|---|
| Q1 investment preference | `risk_level` 0–4 (onboarding letter A–E) | score `2 / 4 / 6 / 8 / 10` |
| Q2 investment experience | full option sentence | **cap** `7 / 8 / 9 / 10` (novice → experienced) |
| Q3 investment focus | full option sentence | score `2 / 4 / 6 / 8 / 10` |
| Q4 reaction to a drop | full option sentence | score `2 / 4 / 6 / 8 / 10` |

`avg` = mean of the answered Q1/Q3/Q4 (2 dp); `lift = min + 2` when the lowest of them is below `5`, else `10`; `risk_willingness = min(avg, lift, Q2 cap)`, rounded to 2 dp. An unanswered or unrecognised answer is left out (a missing Q2 drops the cap); with none of Q1/Q3/Q4 answered the Q2 cap alone is the result, and with nothing answered it is `None`, which the app turns into the neutral `5.0`. Example: `risk_level` 3 (8), novice (cap 7), "Balanced" focus (6), "Accept volatility" (8) → `min(7.33, 10, 7) = 7.0`.

### Prompt plumbing

There is no `.md` prompt file — the summary prompt is assembled in [`prompts.py`](../../src/risk_profiling/prompts.py) as a `ChatPromptTemplate`. The system half wraps `_RISK_BODY` with `build_system_prompt(..., format_profile="plain", question_aware=False)` (shared Pi voice + a strict "plain-language translations" table so the model never surfaces terms like *clamped* / *risk capacity* / raw scores). The human half is a fixed field list. Output is pinned with `.with_structured_output(RiskProfileSummary)`, so the reply is always exactly the `summary` string — no fences, no preamble.

**Sentinel pre-formatting matters here.** Before the LLM sees anything, `_generate_summary` converts the numeric sentinels to English so Haiku never has to interpret them: `savings_rate is None` → `"N/A"`, `expense_coverage_ratio ≥ 999.0` → `"N/A (no financial assets)"`, likewise `current_debt_percent`. Rupee amounts are pre-rendered with `format_inr_indian` (Haiku routinely drops an order of magnitude on raw rupees).

## 6. Where the LLM is

**Only the last step is an LLM call.** Steps A–E are ordinary arithmetic; the score, category and flags exist *before* Haiku runs and do not depend on it.

| Part | Where | Determinism |
|---|---|---|
| all scores, flags, category | [`scoring.py`](../../src/risk_profiling/scoring.py) + `common.category_for_effective_risk_score` | **fully deterministic** — same input → identical `effective_risk_score`, `risk_profile_category`, `gap_exceeds_3` |
| `risk_summary` prose | [`main.py`](../../src/risk_profiling/main.py) `_generate_summary` → Haiku | *wording only* can vary; `temperature=0`, `max_tokens=400`, structured output |

The chain is built with LangChain `ChatAnthropic` (repo convention — no raw `anthropic.messages.create`), with `temperature=0` pinned as a literal (the repo-wide `test_temperature_is_pinned.py` scan checks it). `_get_summary_chain` is `@cache`d **per api_key**, so spend is attributed to the risk-profiling key the gateway passes. Never attribute spend by mutating `ANTHROPIC_API_KEY` around the call: that races under async concurrency, and the cached chain keeps whichever key it was first built with.

<div class="callout danger">
  <div class="title">⚠ The failure mode this module designs against</div>
  <p>Haiku will happily <strong>restate a raw score, expose an internal term</strong> ("your capacity was clamped"), or <strong>drop an order of magnitude on a rupee figure</strong> if handed the raw values. The defence is upstream of the prompt: the numbers are already final, the sentinels are pre-translated to English, and rupees are pre-rendered with <code>format_inr_indian</code>. The model's only job is to narrate the pre-cooked facts in Pi's voice. Widen what you feed it and you widen what it can leak — keep the human-message field list (the <code>_HUMAN</code> template in <code>prompts.py</code>) tight.</p>
</div>

## 8. Invariants & landmines

- **`willingness.py` is wired into production — editing it moves live scores.** `compute_risk_willingness` (the Q1–Q4 instrument) is the primary source of `risk_willingness`: the app-layer [`derive_risk_willingness`](../../../app/domains/profile/services/_effective_risk/inputs.py) calls it with the customer's `risk_level` (Q1) and the three behavioural answer sentences (Q2–Q4), preferring an explicit stored `RiskProfile.risk_willingness` when set. So **changing the scores, the lift rule, the experience cap, or the frontend→key reference tables changes live `effective_risk_score` and therefore allocations.** The three text tables must stay byte-exact with the frontend `BEHAV_Q*_OPTIONS` (a `test_willingness.py` guard enforces this); a reworded or retired option is treated as unanswered, never an error.
- **An unanswered questionnaire resolves to `5.0`.** `derive_risk_willingness` still calls `risk_willingness_from_risk_level` (0–4 → 1–10) when the model returns `None`, but that mapping cannot produce a value there: any `risk_level` in 0–4 already gives the model a Q1 score, so the model only returns `None` when `risk_level` is missing or out of range — where the mapping is `None` too. The effective rule is stored override → model → neutral `5.0`.
- **Mortgage and property never reach the live score.** `build_computation_input` reads `annual_mortgage_payment` and `properties_owned` off `InvestmentProfile` with `getattr(…, None) or 0`, and that model has no such columns (property detail lives in `user_current_properties`). The fresh derivation is therefore `0` / `0` for every customer: `own_property_score` is `2.0` (the "owns nothing" score) and the mortgage adds nothing to expense-coverage or debt. Outside dev tooling, a non-zero value can only appear when an incremental trigger carries it forward from an older stored `inputs` block.
- **Occupation usually defaults.** `derive_occupation_type` falls back to `private_sector` (OSI `0.8`) when `risk_profiles.occupation_type` is unset, and the frontend's risk-profile payload does not carry that field. It cannot move the score (next bullet), but it is what the summary's income-stability sentence is built from.
- **OSI is recorded, not blended.** `osi = OSI_MAP[occupation_type]` lands in `calculations`, but `effective_risk_score` is `0.7·willingness + 0.3·capacity` only. Occupation stability does **not** move the headline (matches the Logics thesis's Stage 4 note and its "My job is steady but the score didn't reward it" Q&A). The AA input builder copies `osi` onto `AllocationInput`, but no allocation step reads it. Wiring it in is a deliberate future change, not a bug to "fix".
- **The savings-rate step is narrative-only.** `_savings_adjustment` produces `equity_boost` / `equity_reduce` / `none` / `skipped` for the *summary* to acknowledge, but `_risk_capacity` never reads it — capacity depends solely on `age_based_score` and `net_asset_score`. The AA input builder copies it (and `gap_exceeds_3`) onto `AllocationInput`, where no allocation step reads it either. Don't let a refactor quietly feed it into the score.
- **Scores are deterministic; keep them that way.** Same input ⇒ identical `effective_risk_score`, `risk_profile_category`, `gap_exceeds_3`. Never route a number through the LLM — the LLM writes prose only. A summary failure must never corrupt a score.
- **A Haiku failure blocks the whole recompute.** `run_risk_profiling` scores and then summarises in one call, so an LLM error raises out of the gateway; `upsert_effective_risk_assessment` logs it and returns `None` without writing. The stored row keeps its previous score, and a customer with no row yet stays on the AA input builder's `7.0` default until a later trigger succeeds.
- **Sentinels are contract signals, not junk.** `current_debt_percent = 999.0` means no financial assets; `expense_coverage_ratio = 999.0` means assets are positive but expense + mortgage is `0` (nothing to cover — coverage score `10`); with no assets the coverage ratio is `0.0` (score `1`), not a sentinel; `savings_rate None` means no income. `_generate_summary` pre-translates both `999.0` values to the same English string, `"N/A (no financial assets)"` — right for debt, a mislabel for the zero-expense coverage case (a profile with assets but no household expense entered). Don't strip the translation and hand raw `999.0` to Haiku.
- **Clamp is real and recorded.** `risk_capacity` is clamped to `[1,10]`; `was_clamped` / `clamp_direction` capture it, and the guardrail forbids the word "clamped" reaching the customer. `risk_willingness` is likewise coerced to `[1,10]` at the gateway.
- **Output is an open dict, keyed by string.** The app indexes `calculations`/`output` by key and persists them as JSON. Renaming a key (e.g. `effective_risk_score`, `risk_profile_category`, `osi`, `savings_rate_adjustment`, `gap_exceeds_3`) is a breaking change to persistence and to the AA input builder — grep before you rename.
- **Stale internal references — trust the files that exist.** `scoring.py`'s docstring cites *"risk_profile.md"* and a comment cites *"chain.py"*; `main.py`'s module docstring cites both (`risk_profile.md` and a `from risk_profiling.chain import …` usage line); the module `README.md` diagram names `chain.py`. **Neither file exists** — the real entry is `main.py` and there is no prompt `.md`. Don't go hunting for them. Likewise the `_effective_risk` module docstrings say `risk_profiling.scoring` is used when building `AllocationInput`; it is not — the AA input builder reads only the persisted row.
- **LangChain only, key per call.** All Claude calls go through `ChatAnthropic` (repo rule); the summary chain is `@cache`d per `api_key` so spend attribution can't race — never attribute spend by mutating the env var.

## 9. Extend & test

- **Change scoring math** → edit [`scoring.py`](../../src/risk_profiling/scoring.py) (anchors, weights, clamp). The score grounds every downstream allocation, and [Logics_reference_docs/Risk_Profiling.md](../Logics_reference_docs/Risk_Profiling.md) grounds customer-facing chat answers about it (attached to asset-allocation `narrate` / `educate` replies via `logic_docs.py`), so a math change leaves that thesis out of step with the code. Reference docs are refreshed when a human asks, not as part of the code change (root `CLAUDE.md`) — flag the drift to whoever owns the refresh, and describe production behaviour, not dormant capability (OSI / savings-rate).
- **Change summary wording / guardrails** → edit `_RISK_BODY` and the field list in [`prompts.py`](../../src/risk_profiling/prompts.py). Adding a fact the paragraph may state means adding it to the human-message template *and* pre-formatting any sentinel/rupee value in `_generate_summary` first.
- **Tests** — none of the three suites is tracked in git: each sits under a gitignored path (`AI_Agents/src/*/Testing/`, `app/domains/profile/services/_effective_risk/tests`, `app/core/tests`), so they exist and run only in a local checkout.

  | Level | Where | Covers |
  |---|---|---|
  | willingness engine | [`Testing/test_willingness.py`](../../src/risk_profiling/Testing/test_willingness.py) | Q1–Q4 scoring from **frontend-native inputs** (`risk_level` + full option sentences), the `min(avg, lift, Q2_cap)` combine, every `None`/unrecognised-answer path, and a drift guard that the reference tables match the frontend `BEHAV_Q*_OPTIONS` (skipped when the sibling `Prozpr_Frontend` checkout is absent) |
  | willingness wiring | [`_effective_risk/tests/test_effective_risk_inputs.py`](../../../app/domains/profile/services/_effective_risk/tests/test_effective_risk_inputs.py) | `derive_risk_willingness` — Q1-only and full four-answer model results, stored override wins, an unrecognised answer is ignored, neutral `5.0` when nothing is answered or there is no `RiskProfile` row |
  | per-module key | [`app/core/tests/test_per_module_api_keys.py`](../../../app/core/tests/test_per_module_api_keys.py) | that `compute_effective_risk_document` hands `run_risk_profiling` the `RISK_PROFILING_API_KEY` explicitly and leaves `ANTHROPIC_API_KEY` in the env untouched |

  Run with the mac venv: `.venv-mac/bin/python -m pytest AI_Agents/src/risk_profiling/Testing/ app/domains/profile/services/_effective_risk/tests/ app/core/tests/test_per_module_api_keys.py`.
- **Run scoring without an API key** — `compute_all_scores` is pure Python and needs no Anthropic call. This is the fastest way to check any arithmetic change:

  ```python
  from risk_profiling.scoring import compute_all_scores
  doc = compute_all_scores({
      "age": 35, "occupation_type": "private_sector",
      "annual_income": 2_000_000, "annual_expense": 1_200_000,
      "financial_assets": 5_000_000, "liabilities_excluding_mortgage": 200_000,
      "annual_mortgage_payment": 0, "properties_owned": 0,
      "risk_willingness": 7.0,
  })
  print(doc["output"]["effective_risk_score"], doc["calculations"]["risk_profile_category"])
  # 7.5 Moderately Aggressive — the §5 worked example
  # risk_summary is "" — the LLM step (run_risk_profiling) fills it
  ```

  Hand the same dict to `run_risk_profiling(payload, api_key=…)` to exercise the full chain including the Haiku paragraph. `dev_run.py` runs the deterministic `compute_all_scores` across all 100 canned profiles and the full LLM chain for 5 representative ones.
