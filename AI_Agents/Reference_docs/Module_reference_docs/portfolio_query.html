# `portfolio_query` — grounded answers about *my own* portfolio

> **One line:** when a customer asks about *their* account — "what's my biggest holding?", "how much in mid cap?", "what does an RBI rate cut mean for me?" — this module answers from three context sources we control (fund-house commentary, the client profile, the current portfolio), refuses anything out of scope, and never lets Haiku do the rupee arithmetic.
>
> This is the engineer's guide to the module. Unlike its sibling [`mutual_fund_query`](mutual_fund_query.html), portfolio_query has **no** Logics thesis doc — that is deliberate (the answer-formatter test asserts `get_logic_reference("portfolio_query") is None`); the customer-facing behaviour is defined entirely by the two runtime prompt files in §5. For where every agent sits in the package, see [Tech_reference_docs/ARCHITECTURE.html](../Tech_reference_docs/ARCHITECTURE.html).

## 1. What it's about

The module lives at [`AI_Agents/src/portfolio_query/`](../../src/portfolio_query/). It owns the **`portfolio_query`** chat intent — a question aimed at *the customer's own account*:

- *"What's my current allocation?" / "How much do I have in mid cap?"* → **Path P** (portfolio-specific)
- *"What is the RBI likely to do with rates — and what does that mean for me?"* → **Path M** (general market, always ending with a *Portfolio Impact* paragraph)
- *"Should I sell my small caps?" / "What SIP do I need to retire at 60?"* → **Path X** (out of scope → polite redirect)

It is triggered by the intent classifier's `portfolio_query` label and routed by the chat brain's `FLOWS` table into the app-layer gateway `answer_portfolio_query` (see §2).

The defining design decision, shared with `mutual_fund_query` but stricter here because a whole portfolio's worth of rupee figures is in play: **the LLM never converts a rupee amount.** Every `*_inr` figure is paired with a pre-computed Indian-notation `*_indian` sibling string, and the prompt tells Haiku to copy it verbatim. A confidently-wrong "₹22.6 lakh" for what is really ₹2.26 crore is treated as a worse failure than a plainer answer.

### The 4-step, single-call shape

```mermaid
flowchart LR
    Q([Question + client + portfolio<br/>+ history<br/>+ want_market_commentary]) --> S1{"<b>Step 1</b><br/>market view needed?"}
    S1 -->|"yes"| S1a["load market_commentary_latest.md<br/>(file contract, no import)"]
    S1 -->|"no"| S1b["inject the not-requested placeholder"]
    S1a --> S2
    S1b --> S2
    S1 --> S2["<b>Step 2</b><br/>enrich *_inr → *_indian<br/>+ compact-JSON the context"]
    S2 --> S3["<b>Step 3 · one Haiku call</b><br/>skill + guardrails + persona<br/>forced tool-use"]
    S3 --> S4["<b>Step 4</b><br/>validate → PortfolioQueryResponse"]
    S4 --> R([answer OR redirect_message<br/>+ guardrail_triggered])
```

The engine ([`orchestrator.py`](../../src/portfolio_query/orchestrator.py)) is a single class, ~226 lines, and makes **exactly one** LLM call per turn — the three paths (X/M/P) are all decided *inside* that one call by the prompt, not by separate passes. **The middle "build the facts" work is deliberately outside the engine:** the app-layer gateway does every DB/ORM read and hands the engine finished DTOs, so the orchestrator can be unit-tested without a database.

---

## 2. Where it sits

The engine is a peer agent: it imports **no** other agent. Its only cross-file dependencies under `src/` are the shared [`common.py`](../../src/common.py) (`read_text_bom_aware`, `format_inr_indian`) and [`persona.py`](../../src/persona.py) (`build_system_prompt`). It **reads** two files under `Reference_docs/` — `market_commentary_latest.md` (factual, written by the `market_commentary` agent) and `fund_house_commentry.md` (Prozpr's hand-maintained monthly view) — but imports neither module: the files are the contract. Which one loads is gated by the classifier's `tools_needed`, and view answers cite the named fund houses as research sources.

| Direction | Who | What flows |
|---|---|---|
| **Upstream** | `intent_classifier` → chat brain `FLOWS` → `flow_portfolio_query` | the `portfolio_query` intent routes here |
| **Gateway** | [`app/domains/portfolio/services/portfolio_query_service.py`](../../../app/domains/portfolio/services/portfolio_query_service.py) | `answer_portfolio_query(question, ctx)` — the ONLY caller of the engine; maps the User ORM graph → `ClientContext` / `PortfolioContext` DTOs |
| **Commentary (factual)** | `market_commentary` agent (via the file) | `market_commentary_latest.md`, loaded when `tools_needed` asks, capped to 7 000 chars |
| **Fund-house view** | hand-maintained `fund_house_commentry.md` | loaded when `tools_needed` = `fund_house_view` (judgement questions); reply cites the named houses as research sources |
| **Downstream** | chat brain | `answer or redirect_message` collapsed to a single customer-facing `str` |

> **The engine touches no DB.** XIRR, cost-basis gains, allocation roll-ups, holdings itemization — all of it is computed in the **gateway** before the DTOs are built. If you're looking for "where does the annualised portfolio XIRR come from", it is `_compute_portfolio_xirr` in `portfolio_query_service.py`, not here.

### What `ctx` must carry

The gateway signature is `answer_portfolio_query(question: str, ctx) -> str`, where `ctx` is the chat brain's `TurnContext`. If you're wiring a new caller or debugging a dead turn, `ctx` must provide:

| Attribute | Type | Used for |
|---|---|---|
| `ctx.user_ctx` | pre-loaded `User` graph (portfolios → holdings → `fund_metadata`, risk_profile, investment_profile, mf_transactions, financial_goals) | building both `ClientContext` **and** `PortfolioContext`; no portfolio ⇒ instant "no active portfolio" reply |
| `ctx.conversation_history` | `list[{role, content}]` | last 6 messages are mapped to `ConversationTurn`s so "how is *it* doing?" resolves |

---

## 3. Input contract

One entry method: `PortfolioQueryOrchestrator.run(question, client, portfolio, conversation_history=None)`. All models are in [`models.py`](../../src/portfolio_query/models.py).

**`client: ClientContext`** — every field optional; a missing field means *unknown*, never *zero*:

| Field | Type | Notes |
|---|---|---|
| `age` | `int?` | derived in the gateway from DOB (floored at 18) |
| `risk_category`, `effective_risk_score` | `str?`, `float?` | from `risk_profile` / `effective_risk_assessment` |
| `investment_horizon`, `occupation_type` | `str?` | from `risk_profile` |
| `annual_income_inr`, `total_liabilities_inr` | `float?` | from `investment_profile` — get `*_indian` siblings at serialise time |
| `financial_goals` | `list[str]` | goal **names** only (feasibility math is Path X) |

**`portfolio: PortfolioContext`** — the load-bearing input:

```
PortfolioContext
├── total_value_inr / total_invested_inr / total_gain_percentage
├── xirr_pct                       # Newton-Raphson XIRR over MF cash flows (gateway); None if <2 flows / no convergence
├── holdings: list[Holding]        # LARGEST-by-value only, capped at 30 in the gateway
│     ├── name, instrument_type, asset_class, sub_category, quantity
│     ├── current_value_inr, allocation_percentage
│     ├── return_1y_pct / return_3y_pct       # trailing-window; OFTEN null
│     ├── invested_amount_inr / gain_inr / gain_pct   # cost-basis; populated when avg_cost known
│     └── xirr_pct                       # THIS fund's annualised return (UserMfLatestSnapshot);
│                                        # None for non-MF holdings / too little history
├── allocations: list[AllocationRow]              # Equity/Debt/Others + Cash
├── sub_category_allocations: list[SubCategoryAllocationRow]
└── total_holdings_count / holdings_count_by_type / omitted_holdings_count / omitted_holdings_value_inr
```

The counts and roll-ups are computed over the **full** portfolio *before* the itemization cap, so "how many funds?" stays exact even when `holdings[]` shows only the top 30. `conversation_history: list[ConversationTurn]` carries `{role: "user"|"assistant", content: str}` turns.

---

## 4. Output contract

`run(...)` returns `PortfolioQueryResponse`:

| Field | Type | Notes |
|---|---|---|
| `guardrail_triggered` | `bool` | **required.** True ⇒ the question was out of scope (Path X) |
| `answer` | `str?` | the in-scope reply (Path M / Path P); `null` when the guardrail fires |
| `redirect_message` | `str?` | the polite one-sentence redirect; `null` when in-scope |

A **deterministic backstop** runs in a pydantic `model_validator(mode="after")`: if `guardrail_triggered` is true it *force-clears* `answer` and, if the model forgot to supply a redirect, fills a canned `_DEFAULT_REDIRECT`. Because the gateway renders `answer or redirect_message`, this guarantees no out-of-scope `answer` can ever leak past the LLM's own discipline. The gateway then collapses the model to a single `str` for the chat brain.

---

## 5. How it thinks

The whole engine is [`orchestrator.py`](../../src/portfolio_query/orchestrator.py) — no pipeline of stages, just a 4-step `run` around **one** forced-tool Haiku call.

| Step | Where | What happens |
|---|---|---|
| 1 · load commentary **(conditional)** | [`orchestrator.py`](../../src/portfolio_query/orchestrator.py) `_load_market_commentary` | **only when `want_market_commentary`**. Reads `market_commentary_latest.md` BOM-aware; **missing ⇒ `FileNotFoundError`**, empty ⇒ `ValueError`; truncates to `_MAX_COMMENTARY_CHARS` (7 000). Otherwise a `_COMMENTARY_NOT_REQUESTED` placeholder is substituted and no file is read |
| 2 · enrich + serialise | `_enrich_inr_fields` / `_dump_enriched_json` | walks the DTO dicts, adds an `*_indian` sibling for every `*_inr`, then compact-JSONs (`exclude_none`, no indent, literal `₹`) |
| 3 · one Haiku call | `SkillExecutor.render` + `build_system_prompt` + `LLMClient.call_structured` | renders the skill, prepends the PI persona, forces the `return_portfolio_query_response` tool. `temperature=0`. Streams the `answer` field when the turn has an open token stream (§5.3) |
| 4 · validate | `PortfolioQueryResponse.model_validate` | typed model + the guardrail backstop (§4) |

### 5.1 The commentary gate — the classifier's `tools_needed` in action

Step 1 used to be unconditional. That put fund-house valuation views into the context of **every** "review my portfolio", and the model reached for them: in one live answer it compared a customer's **26.11% small-cap allocation** against a **"35.5x expensive valuation"** — a percentage against a P/E, two quantities that cannot be compared.

The fix moves the decision upstream. The intent classifier emits `tools_needed` (see the `intent_classifier` guide); the gateway passes `want_market_commentary = "market_commentary" in ctx.tools_needed`, and the orchestrator loads the file only then.

When it is **not** wanted, the commentary block is not empty — it carries `_COMMENTARY_NOT_REQUESTED`, an instruction telling the model to answer from holdings and profile, **not** to speculate about market conditions or valuations, and — importantly — **not to mention that commentary is missing**, since the customer never asked for it. If the question genuinely does need a market view, it offers to pull one up.

Two consequences worth holding on to:

- `want_market_commentary` **defaults to `True`**, so every non-chat caller behaves exactly as before. Only the chat bridge passes the classifier's verdict.
- The commentary-missing error path (§ edge cases) now fires far less often, because most portfolio turns never touch the file.

### 5.2 Two different XIRRs reach the prompt

`current_portfolio.xirr_pct` is the whole portfolio's annualised return. `holdings[].xirr_pct` is **one fund's** — new, and a different number.

Per-fund values are read from `UserMfLatestSnapshot`, keyed by `scheme_code`, which *is* the holding's `ticker_symbol` (the same key the `fund_metadata` relationship joins on). The lookup returns `{}` on any failure by design: a missing XIRR should degrade one line of an answer, never fail the turn.

The skill was updated to match, because the model was previously refusing whole questions on a partially-null column. It is now told: per-fund XIRR **is** populated for mutual funds with enough transaction history, so ranking and comparing by it is fair game; say it is unavailable only for the specific holdings where it actually is null — non-MF holdings, or funds bought too recently to solve — and **name** them rather than refusing the question.

A related prompt rule landed alongside: **a ranked answer must actually be in rank order.** When the question says rank/sort/top/best/worst, rows are emitted sorted by that metric (descending for top/best, ascending for worst), not in the order `holdings[]` happens to arrive, with null-metric holdings grouped last and named. This is one of the "prompts can't do mechanical work over many rows" cases — it is guidance, not a guarantee.

### 5.3 Streaming

The narrating call streams when — and only when — the turn has an open token stream (`current_token_stream() is not None`) **and** the caller named a field. With no open stream this is the exact `ainvoke` path it has always been, so the non-streaming endpoint is unaffected.

`stream_field="answer"` is passed from the orchestrator. The `FINE_GRAINED_TOOL_STREAMING` beta is attached only while streaming: without it the API withholds the tool's input JSON until the end of the response and there is nothing to stream. See §4.1 of the ARCHITECTURE walkthrough for the measurements and the trade-off.

### Prompt plumbing

The prompt content lives in **two** runtime markdown files, both loaded in `__init__` and rendered verbatim into the system prompt:

| File | Role |
|---|---|
| [`portfolio_query.md`](../../src/portfolio_query/portfolio_query.md) | YAML front-matter (`model: haiku`, `max_tokens: 1200`) + `## System Prompt` (the three-path routing rules) + `## User Prompt` (the context slots) |
| [`guardrails.md`](../../src/portfolio_query/guardrails.md) | the scope rules (Category A/B allowed, the 2 forbidden buckets + their redirects), embedded into the system prompt via the `{{guardrail_rules}}` placeholder |

[`skill_executor.py`](../../src/portfolio_query/skill_executor.py) splits the front-matter on `---`, carves the two `## ` sections, and fills `{{name}}` **double-brace** placeholders — single-brace JSON in the prompt (the tool schema examples) is left untouched, so you don't need `str.format` gymnastics. Then `build_system_prompt(system_body, format_profile="chat", question_aware=True)` prepends Pi's identity + shared mechanics. Editing product wording — the paths, the "Portfolio Impact" rule, the redirects — means editing these `.md` files; **no code change.**

### The three paths, decided in one call

- **Path X (out of scope):** a guardrail topic — buy/sell/rebalance recommendations, goal-feasibility / SIP math, or off-topic finance (insurance, tax, crypto, direct stock picks). ⇒ `guardrail_triggered = true`, `answer = null`, polite `redirect_message`.
- **Path M (general market):** answered from the fund-house commentary in 1–2 sentences, then **always** a bold **Portfolio Impact:** paragraph tied to the client's actual asset-class / sub-category percentages. Total under 100 words.
- **Path P (portfolio-specific):** answered from the profile + portfolio, routed to the right data source (sub-category rows / allocation rows / holdings / counts / cost-basis gains / XIRR). Under 60 words prose, up to 120 if structured.

### What the customer hears in the edge cases

Not every turn even reaches the model — several failures are caught in the **gateway** before the LLM runs:

| Situation | Decided in | What the customer hears |
|---|---|---|
| No portfolio on the account | gateway (before LLM) | *"I couldn't find an active portfolio on your account yet…"* |
| No / rejected Anthropic key | gateway (before / around call) | a specific "API key isn't configured / was rejected" message |
| Commentary file missing | gateway `except FileNotFoundError` | *"…ask me a quick market question first to refresh it…"* |
| Out-of-scope question | **LLM (Path X)** + validator backstop | the matching guardrail redirect, `answer` force-nulled |
| Any other LLM failure | gateway `except Exception` | a generic "give it another phrasing" reply — never a stack trace |

## 6. Where the LLM is

**One Haiku call per turn, forced-tool-use — and it does no arithmetic.** Everything numeric is deterministic and happens *before* the call:

| Part | Where | Deterministic vs LLM |
|---|---|---|
| XIRR, cost-basis gains, allocation & sub-category roll-ups, itemization + counts | gateway (`portfolio_query_service.py`) | deterministic Python |
| `*_inr` → `*_indian` Indian-notation strings | `orchestrator._enrich_inr_fields` → `common.format_inr_indian` | deterministic |
| path routing (X / M / P) + wording | the single Haiku call | probabilistic |
| guardrail contract enforcement | `PortfolioQueryResponse` validator | deterministic backstop |

The LLM client is [`llm_client.py`](../../src/portfolio_query/llm_client.py) — a thin `ChatAnthropic` (LangChain) wrapper. It binds exactly one tool with `tool_choice={"type":"tool","name":...}`, marks the system prompt `cache_control: ephemeral` (Anthropic prompt caching), returns `(tool_input, usage)`, and resolves the `"haiku"` alias via `MODEL_MAP` to the pinned id.

<div class="callout danger">
  <div class="title">⚠ The failure mode this module designs against</div>
  <p>Haiku <strong>frequently drops an order of magnitude on lakh/crore boundaries</strong> — it will write "₹22.6 lakh" for what is really ₹2.26 crore. The defence isn't a smarter prompt: it's that <strong>there is nothing to convert</strong>. Every rupee value is paired with a pre-built <code>*_indian</code> string (<code>_enrich_inr_fields</code>) and the prompt tells the model to copy it verbatim. If you add a new <code>*_inr</code> field to a DTO, the enrichment sibling is created for free — but if you ever hand the model a raw rupee number with no <code>*_indian</code> partner, you have re-opened this bug.</p>
</div>

## 8. Invariants & landmines

- **The commentary load is CONDITIONAL now.** `want_market_commentary` gates it (§5.1). It defaults to `True`, so if you add a caller and forget to pass the classifier's verdict, you silently get the old always-load behaviour back — and with it the valuation-vs-allocation confusion the gate exists to prevent.
- **`stream_field` must be passed explicitly, and only for `answer`.** The parameter has no default on purpose: an internal field must never be streamed to a customer by accident. `redirect_message` in particular is substituted wholesale by the guardrail backstop, so streaming it would paint text the validator may then null.
- **Streamed turns report usage on `usage_metadata`, not `response_metadata["usage"]`.** `llm_client` carries an explicit fallback; without it, token and cost accounting records **zeros for every streamed turn** and per-module cost attribution quietly goes wrong.
- **Per-fund XIRR failure is swallowed on purpose.** `_xirr_by_scheme` returns `{}` on any exception. That is correct — one missing number must not fail a turn — but it means a broken lookup shows up as "the model stopped citing per-fund XIRR", not as an error. Check the warning log.
- **The market commentary is a file contract, not an import.** `orchestrator._load_market_commentary` reads `Reference_docs/market_commentary_latest.md` and **raises `FileNotFoundError` if it's absent** (empty ⇒ `ValueError`). The gateway catches that and tells the customer to refresh commentary. Don't "fix" it by importing the `market_commentary` module — the file boundary is why this agent stays a peer.
- **Every `*_inr` needs its `*_indian` sibling.** `_enrich_inr_fields` builds them; the prompt says copy verbatim. Hand Haiku a bare rupee number and you re-open the lakh/crore bug (§6). Any new rupee DTO field gets the sibling automatically — but only if it *ends in* `_inr`.
- **The guardrail contract has a deterministic backstop.** `PortfolioQueryResponse`'s validator nulls `answer` and guarantees a redirect whenever `guardrail_triggered` is true. Never rely on the model alone to null the out-of-scope answer, and don't remove the validator.
- **Count questions use `total_holdings_count` / `holdings_count_by_type`, never `len(holdings[])`.** `holdings[]` is capped at 30 largest-by-value in the gateway; the roll-ups and counts are computed over the full portfolio. A field that is absent means *unknown*, not zero — the prompt forbids asserting a customer doesn't hold a fund that may be in the omitted tail.
- **Prompt files define behaviour; edits need the eval gate.** `portfolio_query.md` + `guardrails.md` are rendered verbatim and *are* the Path X/M/P logic and the mandatory "Portfolio Impact" paragraph. There is no Logics thesis doc to bump (unlike sibling agents) — but run the prompt eval gate before merging a wording change.
- **BOM-aware reads, single-brace-safe render.** These `.md` files carry `₹` / em-dashes and inline JSON; `read_text_bom_aware` + the `{{name}}`-only `_render` exist for that reason — don't switch to naive `str.format`.
- **XIRR here is hand-rolled.** `portfolio_query_service._xirr` is a divergent Newton-Raphson; the memory note flags `mutual_funds.services.xirr_service.compute_portfolio_xirr` as the canonical one — prefer it for new portfolio code.
- **Failure is soft.** The gateway wraps the call in `try/except` (incl. `AnthropicAuthenticationError`) and returns a specific-but-friendly reply — a commentary-missing or key problem never surfaces a stack trace.

## 9. Extend & test

- **Change wording / paths / guardrails / redirects** → edit [`portfolio_query.md`](../../src/portfolio_query/portfolio_query.md) or [`guardrails.md`](../../src/portfolio_query/guardrails.md) only, then run the prompt eval gate (`scripts/run_prompt_eval_gate.sh`) before merging — the golden set includes `pq/*` cases in [`golden_cases.py`](../../../app/domains/ai_engine/tests/eval_gate/golden_cases.py).
- **Add a fact the answer may state** → add the field to `PortfolioContext` / `Holding` in [`models.py`](../../src/portfolio_query/models.py), populate it in the gateway's `_build_*` helpers, and describe it in the skill's context list so the model knows it exists. If it's a rupee field, name it `*_inr` so enrichment picks it up.
- **Tests.** This engine has **no `Testing/` subfolder** — coverage lives at two levels:

  | Level | Where | Covers |
  |---|---|---|
  | engine smoke | [`dev_run.py`](../../src/portfolio_query/dev_run.py) | in-scope multi-turn + guardrail scenarios end-to-end (real Haiku call; needs `ANTHROPIC_API_KEY` + a commentary file) |
  | intent gate | [`app/domains/ai_engine/tests/eval_gate/`](../../../app/domains/ai_engine/tests/eval_gate/) | that `pq/*` questions classify to `portfolio_query` (`golden_cases.py` intent cases) |
  | logic-doc guard | [`answer_formatter/tests/test_logic_docs.py`](../../../app/domains/ai_engine/answer_formatter/tests/test_logic_docs.py) | asserts this module has **no** logic doc: `get_logic_reference("portfolio_query") is None` |

  Run the intent gate with the mac venv: `.venv-mac/bin/python -m pytest app/domains/ai_engine/tests/eval_gate/`. The model's actual *wording* under the guardrail lives in that eval gate, not in unit tests.
- **Run the engine without an API key** — inject a stub at the LLM-client boundary. `call_structured` is the entire seam:

  ```python
  class StubLLM:
      total_input_tokens = total_output_tokens = 0
      async def call_structured(self, model, system, user, *, tool, max_tokens=1024):
          return {"guardrail_triggered": False, "answer": "..."}, {}   # any canned tool payload

  orch = PortfolioQueryOrchestrator(StubLLM())
  resp = await orch.run("what's my biggest holding?", my_client, my_portfolio, [])
  ```

  Hand-build a `ClientContext` + `PortfolioContext` (the `dev_run.py` fixtures are a ready template) and you can reproduce any answer quirk — prompt assembly and INR enrichment included — with no database and no Anthropic call. (Note `run` still needs `market_commentary_latest.md` on disk, since Step 1 reads it before the call.)

<script>
(function () {
  const mdSource = document.getElementById('source-md').textContent;

  marked.use({ gfm: true, breaks: false, headerIds: true, mangle: false });

  const rawHtml = marked.parse(mdSource);
  const content = document.getElementById('content');
  content.innerHTML = rawHtml;

  // Convert ```mermaid code blocks into <div class="mermaid"> for rendering.
  content.querySelectorAll('pre code.language-mermaid').forEach((codeEl) => {
    const div = document.createElement('div');
    div.className = 'mermaid';
    div.textContent = codeEl.textContent;
    codeEl.parentElement.replaceWith(div);
  });

  function slugify(text) {
    return text.toLowerCase().replace(/[^a-z0-9\s-]/g, '').trim().replace(/\s+/g, '-');
  }
  content.querySelectorAll('h2, h3').forEach((h) => { if (!h.id) h.id = slugify(h.textContent); });

  const tocList = document.getElementById('toc-list');
  content.querySelectorAll('h2, h3').forEach((h) => {
    const li = document.createElement('li');
    li.className = 'lvl-' + h.tagName.charAt(1);
    const a = document.createElement('a');
    a.href = '#' + h.id;
    a.textContent = h.textContent;
    li.appendChild(a);
    tocList.appendChild(li);
  });

  mermaid.initialize({
    startOnLoad: false,
    theme: 'default',
    flowchart: { curve: 'basis', htmlLabels: true },
    securityLevel: 'loose',
  });
  mermaid.run({ querySelector: '.mermaid' });

  const headings = Array.from(content.querySelectorAll('h2, h3'));
  const tocLinks = Array.from(tocList.querySelectorAll('a'));
  const linkById = new Map(tocLinks.map(a => [a.getAttribute('href').slice(1), a]));
  function onScroll() {
    const fromTop = window.scrollY + 80;
    let active = headings[0];
    for (const h of headings) { if (h.offsetTop <= fromTop) active = h; else break; }
    tocLinks.forEach(a => a.classList.remove('active'));
    if (active) { const link = linkById.get(active.id); if (link) link.classList.add('active'); }
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();
})();
</script>
