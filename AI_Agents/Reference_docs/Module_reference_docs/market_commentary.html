# `market_commentary` — the macro letter the rest of chat reads

> **One line:** `flow_market` runs this module on a `general_market_query` turn unless the classifier asked only for the fund-house view. When the cached snapshot is stale (24h TTL), Claude web-searches 14 Indian macro indicators (repo rate, CPI, index PEs, gold, FII flows, USD/INR…), pins them into a `MacroSnapshot`, and writes a 2-page **monthly** markdown commentary to `Reference_docs/`. The doc string goes back to `flow_market`, which hands it to `general_chat` to write the reply. The `.md` on disk is the cache that later turns serve verbatim. No other agent reads it, `portfolio_query` included.
>
> This is the engineer's guide to the module. There is **no Logics thesis doc** for market commentary (the customer-facing letter *is* the artefact). For where every agent sits in the package, see [Tech_reference_docs/ARCHITECTURE.html](../Tech_reference_docs/ARCHITECTURE.html).

  <div class="cell"><div class="k">Models</div><div class="v">Haiku 4.5 · extract + doc<br/>Sonnet 4.6 · Q&amp;A</div></div>

---

## 1. What it's about

The module lives at [`AI_Agents/src/market_commentary/`](../../src/market_commentary/). It is **not** a chat turn's reply-writer — it is a **data-gathering + document-rendering pipeline**. Its job is to answer one question well: *"what does the Indian macro picture look like right now?"* — and to freeze that answer into a cached file that later turns reuse. The rendered letter is styled as a **monthly** commentary (its letterhead reads *"Market Commentary | {Month YYYY}"*), but the pipeline is triggered **on demand per turn** and refreshed only when the cached snapshot is older than the 24h TTL — there is no scheduler in this codebase.

One thing consumes the output at runtime, and it does not import the module:

- **`general_chat`**, via `flow_market`. The flow puts the doc under a `[LIVE MARKET DATA — current, factual]` header, capped at 15,000 chars. When the house view was asked for, the flow appends that block too. The combined string reaches `general_chat` as `prior[MARKET_COMMENTARY].payload`, and `general_chat` writes the customer's reply from it.

`portfolio_query` does not load this commentary. Its only market source is the Prozpr-only slice of the fund-house view (below). The other caller is a debug endpoint, `POST /api/v1/ai-modules/market-commentary/generate`, which returns the doc as `document_markdown`.

> **Sibling — the fund-house view.** This agent writes only the *factual* commentary. Prozpr's qualitative **view** lives in a separate, hand-maintained file, `Reference_docs/fund_house_commentry.md` (not produced here), sliced by `AI_Agents/src/house_view.py`. When the classifier's `tools_needed` asks for `fund_house_view`, `flow_market` loads the whole multi-house file through `app/domains/market_commentary/services/fund_house_view_module_service.py`, and the reply surfaces the named fund houses as research sources. `portfolio_query` and `rebalancing` load only the Prozpr-only slice, which names no house. A market turn that asks for the view alone (`fund_house_view` without `market_commentary`) skips this module.

The defining design decision: **the numbers are grounded, not invented.** Every indicator comes from Claude's own `web_search` calls against named authoritative sources (RBI, MOSPI, NSE, NSDL…). Anything that can't be verified becomes `null` and lands in `data_gaps` — the doc-gen prompt then says "cannot be assessed from available inputs" rather than guessing.

### The run shape (fast-path first, full-run only when stale)

```mermaid
flowchart TB
    START([general_market_query turn → flow_market]) --> GATE{"tools_needed has market_commentary,<br/>or no fund_house_view?"}
    GATE -->|no| SKIP["module skipped<br/>(view-only answer)"]
    GATE -->|yes| FP{snapshot cache<br/>fresh?}
    FP -->|".md not older than .json"| RET["return .md verbatim<br/>(no LLM)"]
    FP -->|"snapshot fresh, .md stale"| DG1["doc-gen only · Haiku"]
    FP -->|"stale / absent"| WS["<b>Pass 1 · web-search extract</b><br/>Haiku + Anthropic web_search<br/>→ extract_macro_data tool"]
    WS --> SNAP[("MacroSnapshot<br/>14 indicators + data_gaps")]
    SNAP --> DG2["<b>Pass 2 · doc-gen</b><br/>Haiku forced-tool<br/>(reasoned_reply)"]
    DG1 --> MD
    DG2 --> MD[("market_commentary_latest.md<br/>+ .json cache")]
    RET --> OUT
    MD --> OUT([doc string → flow_market → general_chat])
```

The engine ([`main.py`](../../src/market_commentary/main.py)) owns the orchestration; [`document_generator.py`](../../src/market_commentary/document_generator.py) owns the render. **Why a fast path?** A full run is typically 15–25 web searches (capped at `max_uses=25`) plus two Haiku calls — expensive and slow. The rendered `.md` is a **deterministic-enough function of the snapshot** that once it's written, it is reused verbatim within the TTL window (`MARKET_COMMENTARY_CACHE_MAX_AGE_SEC`, default 24h) with no LLM call at all.

---

## 2. Where it sits

The engine is a peer agent: it imports no other agent — only shared [`common.py`](../../src/common.py) (`read_text_bom_aware`, `format_inr_indian`), [`persona.py`](../../src/persona.py) (`build_system_prompt`), and [`reasoned_reply.py`](../../src/reasoned_reply.py) (the discard-the-thinking-field tool contract). The API key, the cache path and the freshness TTL come from the app layer.

| Direction | Who | What flows |
|---|---|---|
| **Upstream** | `intent_classifier` → `general_market_query` → [`flow_market`](../../../app/domains/ai_engine/services/flow.py) | runs this module when `ctx.tools_needed` contains `market_commentary` or lacks `fund_house_view`. Then it runs the fund-house view if asked, then `general_chat` |
| **Gateway (brain-facing)** | [`market_commentary_module_service.run(turn, ctx, prior)`](../../../app/domains/market_commentary/services/market_commentary_module_service.py) | the ONLY brain entry point. A 120s timeout or any exception returns an empty payload, so the turn still continues |
| **AI bridge** | [`market_commentary_engine.generate_market_commentary`](../../../app/domains/market_commentary/services/market_commentary_engine.py) | resolves the cache path (`Reference_docs/`), freshness and API key, then drives `MarketCommentaryAgent` (fast path → full run) |
| **Downstream (chat)** | [`general_chat_module_service`](../../../app/domains/general_chat/services/general_chat_module_service.py) → [`general_chat_engine`](../../../app/domains/general_chat/services/general_chat_engine.py) | reads `prior[MARKET_COMMENTARY].payload` (flow_market's labelled block, capped again at 110,000 chars). Its Haiku research pass reads the block, cites its figures "per our daily snapshot" and calls `web_search` only for gaps (`max_uses=1`). The compose pass sees only the research digest and writes the customer reply |
| **Debug endpoint** | [`market_commentary_router`](../../../app/domains/ai_engine/routers/market_commentary_router.py) | `POST /api/v1/ai-modules/market-commentary/generate` (authenticated) calls `generate_market_commentary` directly, with no timeout and no degrade path, and returns `{document_markdown}` |

> **This module never writes the customer's reply.** `market_commentary_module_service` returns a `ModuleOutput` whose `payload` is the doc string and whose `text` is left unset (`None`). The turn's visible answer is `general_chat`'s. If you're chasing "why did the market answer read oddly", that's a `general_chat` question, not this module.

### What `ctx` / `turn` must carry

`flow_market` calls `run_market_commentary(turn, ctx, {})`. The run is **question-agnostic** — worth knowing before you debug a "why didn't it use my question" report:

| Attribute | Type | Used for |
|---|---|---|
| `turn.user_question` | `str` | **passed but `del`'d** in `generate_market_commentary`, which reserves it for question-conditioned runs |
| `turn.conversation_history` | `list[{role, content}]` | same — accepted then discarded |
| `turn.session_id` | `str` | timeout/failure logging only |
| `ctx.tools_needed` | `tuple[str, ...]` | read by `flow_market`, not by this module — decides whether the module runs at all |

The knobs that actually change behaviour live in config, not `ctx`. `MARKET_COMMENTARY_CACHE_MAX_AGE_SEC` sets freshness (default `86400`). It is read once with `os.getenv` when `market_commentary_engine` is imported, so a change needs a restart. `MARKET_COMMENTARY_API_KEY` falls back to `ANTHROPIC_API_KEY` through `Settings.get_anthropic_market_commentary_key()`.

## 3. Input contract

Unlike `mutual_fund_query`, this engine has **no single pydantic input model** — its "input" is the live web plus a handful of orchestration parameters. The surface is `MarketCommentaryAgent`:

**`MarketCommentaryAgent(api_key=None, output_dir=".", generate_document=True)`**

| Param | Type | Notes |
|---|---|---|
| `api_key` | `str?` | passed explicitly into each LLM builder; `None` ⇒ ambient `ANTHROPIC_API_KEY`. **Never** mutates process-global env (races under async concurrency) |
| `output_dir` | `str` | where `market_commentary_latest.{json,md}` are read/written — the app layer points this at `AI_Agents/Reference_docs/` |
| `generate_document` | `bool` | if `False`, `run()` stops after extraction+cache (snapshot only, no markdown) |

**Two run methods**, each its own entry:

| Method | Signature | Role |
|---|---|---|
| `run()` | `() → MacroSnapshot` | full pipeline: web-search extract → cache → write `.json` + `.md` |
| `run_from_cache(max_age_sec, date=None)` | `→ str \| None` | fast path: return fresh `.md` verbatim, else regen doc from cached snapshot, else `None` |

`date` stamps a regenerated letter's letterhead, and the app passes the current IST time. `run()` always stamps its letter with `datetime.utcnow()`.

The private extraction schema `_MacroExtraction` ([`main.py`](../../src/market_commentary/main.py)) is the **14 indicator fields only** — no `data_gaps`, no `document_md` — so the `extract_macro_data` tool's `input_schema` stays clean. `_to_snapshot` then derives `data_gaps` as "every field that came back `null`".

---

## 4. Output contract

The one durable model is `MacroSnapshot` ([`models.py`](../../src/market_commentary/models.py)):

```
MacroSnapshot
├── repo_rate_pct, rbi_stance                          # RBI / monetary policy
├── cpi_yoy_pct                                        # inflation
├── nifty50_pe, nifty_midcap150_pe, nifty_smallcap250_pe   # equity valuations (trailing PE)
├── gsec_10yr_yield_pct, sbi_fd_1yr_rate_pct           # debt
├── gold_price_inr_per_10g, gold_price_usd_per_oz      # gold (two units, on purpose)
├── fed_funds_rate_pct, fii_net_flows_cr_inr           # global macro / flows
├── brent_crude_usd, usd_inr_rate                      # oil / FX
├── data_gaps: list[str]                               # indicators that came back null
└── document_md: str?                                  # the rendered letter; set AFTER doc-gen, NOT persisted to .json
```

Every indicator field is `Optional[float]` (or `Optional[str]` for `rbi_stance`) — a `null` is a **contract signal** ("we couldn't verify this"), not a missing value to backfill. Two on-disk artefacts fall out of a run, both in `output_dir`:

| File | What | Written by |
|---|---|---|
| `market_commentary_latest.json` | the `MacroSnapshot` cache. `document_md` is `null` because the file is saved before doc-gen sets it. It is written only when at least one indicator is non-null | `CacheManager.save` |
| `market_commentary_latest.md` | the rendered 2-page letter — **the cache the fast path serves verbatim** | `MarketCommentaryAgent._write_document` (full run) / inline write (fast path) |

The brain gateway collapses all of this into a single `ModuleOutput(payload=<doc string>)` for the sequence.

---

## 5. How it thinks

The pipeline is two LLM passes wrapped in a cache-freshness gate. The engine computes no indicator values; the only Python-side figures are two spreads and the gold string in `_build_prompt_vars`. The LLM's job is to **gather** (pass 1) then **narrate** (pass 2).

### The freshness gate — `run_from_cache`

Before any LLM call, `run_from_cache(max_age_sec, date)` decides how much work is needed:

1. No `.json`, or `.json` older than `max_age_sec` (or the loaded snapshot is unreadable or all-null) → return `None` (caller runs the full `run()`).
2. `.json` fresh **and** `.md` mtime ≥ `.json` mtime **and** the `.md` is non-empty → return the `.md` **verbatim** (BOM-aware read, no LLM).
3. `.json` fresh but `.md` missing, older, empty or unreadable → regenerate the doc from the cached snapshot (**doc-gen LLM only**) and persist it. A failed write is swallowed and the doc is still returned.

`generate_market_commentary` catches any exception from the fast path (for example a failed doc-gen call), logs it at debug level and runs the full `run()`.

### Pass 1 — web-search extraction (`run_websearch_extraction`)

1. One Haiku call (`claude-haiku-4-5-20251001`, `max_tokens=4096`, `temperature=0`) bound to **two** tools: Anthropic's server-side `web_search_20250305` (`max_uses=25`) **and** `extract_macro_data`.
2. Claude plans its own searches, disambiguates the known failure modes baked into `EXTRACTION_SYSTEM_PROMPT_WEBSEARCH` (repo vs SDF vs MSF; gold USD/oz vs INR/10g; spot vs forward USD/INR; trailing vs forward index PE), and finalises with one `extract_macro_data` call.
3. `_MacroExtraction(**tool_call["args"])` → `_to_snapshot` → `MacroSnapshot`. If Claude never finalises, an **all-null** snapshot is returned so the caller's fallback fires.
4. In `run()`: an all-null snapshot ⇒ fall back to the **last cached snapshot** and append `"ALL_LIVE_DATA_FAILED — using cached snapshot"` to `data_gaps`. Any non-empty snapshot is then saved to `.json`, and that includes the fallback. Re-saving it resets the `.json` mtime and keeps the tag. With no cache on disk, nothing is saved and the letter is generated from the all-null snapshot, with every figure `N/A`.

### Pass 2 — document generation (`generate_document`)

1. `_build_prompt_vars` turns the snapshot into template strings — including **pre-computed spreads** (`gsec_repo_spread`, `gsec_fd_spread`) and **pre-formatted Indian-notation gold** (`format_inr_indian`, so Haiku never converts raw rupees to lakh/crore and trips its order-of-magnitude bug). `None` → `"N/A"`.
2. One Haiku call (`claude-haiku-4-5-20251001`, `max_tokens=3800`, `temperature=0`), forced to the `return_commentary_document` tool built via `reasoned_reply_tool` — the model writes a private `outline` (discarded) **before** the `document` body, so the letter starts cleanly at the letterhead.
3. `extract_reasoned_reply(..., answer_field="document")` pulls the body; empty ⇒ `RuntimeError`.

The system prompt is `build_system_prompt(_DOC_BODY, format_profile="document", question_aware=False)`. It combines the shared PI identity and mechanics, the document format profile, the persona's one-line disclaimer and the letter body, which holds the writing standards, `EQUITY_PE_BANDS` and the compliance rules. The human message carries the macro block, the required 10-part, two-page structure, the letterhead format and a fixed closing disclaimer. Both `_DOC_BODY` and that disclaimer state that Prozpr is a SEBI-registered investment adviser. The shared persona makes no registration claim.

## 6. Where the LLM is

**Every pass here is an LLM call** — this is an LLM-driven module end to end. What keeps it honest is *grounding* (web_search on named sources) and *pre-computation* (spreads, Indian-notation gold), not determinism.

| Pass | Model (code id) | Determinism |
|---|---|---|
| web-search extract | `claude-haiku-4-5-20251001` | probabilistic; grounded by `web_search` on authoritative sources |
| doc-gen | `claude-haiku-4-5-20251001` | probabilistic wording over the snapshot; then **cached & reused verbatim** within the TTL |
| Q&A (`chat_qa.py`) | `claude-sonnet-4-6` | probabilistic; grounded ONLY in the stored `.md` — **not on the live chat path** (see §8) |

<div class="callout danger">
  <div class="title">⚠ Stale "Sonnet" comments — the two live passes are Haiku</div>
  <p><code>main.py</code>'s cost note ("plus Sonnet tokens"), <code>prompts.py</code>'s "Document generation prompts — Claude Sonnet" header and <code>market_commentary_engine.py</code>'s "Skip 14x web search + Sonnet extraction" comment are <strong>stale</strong>: the live code pins <code>_EXTRACTION_MODEL</code> and <code>_DOCUMENT_MODEL</code> to <code>claude-haiku-4-5-20251001</code>. Sonnet (<code>claude-sonnet-4-6</code>) appears <strong>only</strong> in <code>chat_qa.py</code>, which the production chat flow does not call. Trust the constants, not the prose — and if you're reasoning about cost, a full run is ~15–25 web searches (<code>web_search_20250305</code>, <code>max_uses=25</code>) plus two Haiku calls.</p>
</div>

All three LLMs go through LangChain `ChatAnthropic` (per the repo convention), each pins `temperature=0`, and each is built lazily and `@cache`d so the key is read at call time, never at import (the extraction and doc-gen builders `@cache` per API key; the QA builder reads the ambient key).

## 8. Invariants & landmines

- **The doc string is the contract, not an import.** `general_chat` reads it from `prior[MARKET_COMMENTARY].payload`, wrapped by `flow_market` under the `[LIVE MARKET DATA — current, factual]` header. `general_chat`'s research prompt names that header and the house-view header, so renaming either label in `flow.py` breaks the citation rules with no compile-time signal. The `.md` on disk is the fast path's cache. Besides this module, only the unwired `chat_qa.py` and the dev-only `chat_eval/run_eval.py` presence check touch it. `portfolio_query` does not read it.
- **`chat_qa.py` is orphaned-on-purpose.** `answer_question` (the only Sonnet caller) has **no production caller** — outside its own reasoning test it is referenced only by the dev-only [`chat_eval` reasoning snapshot](../../src/chat_eval/reasoning_surface_snapshot.py) — the production `general_market_query` flow tailors its reply in `general_chat`, not here. Don't "wire it up" without a product decision; don't delete it assuming it's dead code either.
- **`null` indicator = "unavailable", never a guess.** An unverified field stays `null` and lands in `data_gaps`; the doc-gen prompt says "cannot be assessed from available inputs". Widening the extraction to backfill nulls would silently invent macro data.
- **All-null snapshot ⇒ reuse the cache, tag `ALL_LIVE_DATA_FAILED`.** `run()` never writes an empty snapshot over a good one; it falls back to the last cache and flags it. Don't "simplify" that guard away. It re-saves the fallback, though, so the old figures count as fresh for another TTL window. Each further failed run appends the tag again, because the reloaded cache already carries it.
- **Gold is pre-formatted; spreads are pre-computed.** `_build_prompt_vars` sends Indian-notation gold (`format_inr_indian`) and the two rate spreads as strings so Haiku copies rather than computes — this dodges its known order-of-magnitude bug. Keep new derived figures on the Python side of the boundary.
- **Files are written UTF-8, read BOM-aware.** `CacheManager.save` and `_write_document` pin `encoding="utf-8"` (never the OS locale / cp1252); reads go through `read_text_bom_aware` because a `.md` may arrive UTF-16 from PowerShell. Don't swap in a naive `open().read()`.
- **API key is passed explicitly, never via env mutation.** The extraction and doc-gen LLM builders take `api_key` and are `@cache`d per key; process-global `os.environ` mutation races under async concurrency. Preserve the explicit-key plumbing.
- **The fast-path "deterministic" claim is about caching, not generation.** Doc-gen is an LLM (probabilistic). The invariant is that once written, the `.md` is reused verbatim while fresher than the TTL — so regeneration only happens on a stale/missing file. Don't read it as "same snapshot ⇒ byte-identical letter".
- **Failure is soft at the gateway.** `market_commentary_module_service` wraps the run in a 120s `wait_for` and returns `ModuleOutput(payload=None)` on timeout/error, so the sequence still reaches `general_chat` with no macro doc rather than failing the whole turn. The timeout does not stop the work: the run sits in `asyncio.to_thread`, so the thread finishes and still writes the cache files. If `general_chat` itself raises, it retries once without the doc.
- **No lock around a stale cache.** Neither the engine nor the gateway serialises runs. Concurrent turns that find the cache stale each run the full pipeline and each write the same two files.
- **The cache pair is tracked in git.** Both `market_commentary_latest.*` files are committed, and the Dockerfile's `COPY . .` ships them. Git does not keep mtimes, so a checkout that brings in a committed pair makes that snapshot look fresh. The fast path then serves it for up to one TTL window.
- **`MarketCommentaryScores` is not this module.** The allocation engines' `market_commentary` input (`asset_allocation_pydantic/models.py`) defaults to the static `DEFAULT_MARKET_COMMENTARY_SCORES` table in `tables.py`. Nothing in this module or its app layer feeds allocation.

## 9. Extend & test

- **Add / retune an indicator** → add the field to:
  - `MacroSnapshot` ([`models.py`](../../src/market_commentary/models.py));
  - `_MacroExtraction` and the `_is_snapshot_empty` list ([`main.py`](../../src/market_commentary/main.py));
  - the `extract_macro_data` `input_schema` and its `required` list ([`prompts.py`](../../src/market_commentary/prompts.py)).

  Then surface it in `_build_prompt_vars` and `DOCUMENT_GENERATION_USER_PROMPT_TEMPLATE` so the letter can use it. Also update the "14 indicators" counts in `EXTRACTION_SYSTEM_PROMPT_WEBSEARCH` and in the extraction human message in `main.py`. Miss one of these and the field is silently dropped: never requested, never parsed, never shown, or ignored by the all-null check.
- **Change wording / PE bands / structure** → edit [`prompts.py`](../../src/market_commentary/prompts.py) only (`EQUITY_PE_BANDS` carries a "Last reviewed: 2026-05-02" stamp — bump it when you touch the bands). No eval gate scores the letter. `scripts/run_prompt_eval_gate.sh` covers three things. The first is the intent classifier, including the `tools_needed` routing that decides whether this module runs (`mkt/nifty-pe` expects `{market_commentary}`). The others are the chat action detectors and Logics-doc grounding. Run it when you change the classifier's `tools_needed` guidance.
- **Tests** — module tests live beside the module (there is no `Testing/` subfolder here); app-layer tests cover the gate and the key plumbing:

  | Level | Where | Covers |
  |---|---|---|
  | doc-gen reasoning-discard | [`test_document_generator_reasoning.py`](../../src/market_commentary/test_document_generator_reasoning.py) | `outline` field discarded, `document` body returned; LLM stubbed |
  | QA reasoning-discard | [`test_chat_qa_reasoning.py`](../../src/market_commentary/test_chat_qa_reasoning.py) | `reasoning` field discarded, safe fallback on malformed tool call |

  | persona composition | [`test_persona_surfaces.py`](../../src/test_persona_surfaces.py) | doc-gen prompt uses the document profile, not question-aware; QA prompt keeps `{document_content}` |

- **Run doc-gen without hitting the web** — the pattern the tests use: hand-build a `MacroSnapshot`, patch the LLM at the tool boundary (`_get_doc_llm` / `_get_qa_llm`), and assert on the assembled prompt + the discarded-field behaviour. No web_search, no Anthropic call, no database:

  ```python
  import market_commentary.document_generator as dg
  from market_commentary.models import MacroSnapshot

  snap = MacroSnapshot(repo_rate_pct=5.5, rbi_stance="neutral", nifty50_pe=22.4)
  # patch dg._get_doc_llm so .invoke() returns an object whose tool_calls is
  # [{"name": "return_commentary_document", "args": {"outline": "...", "document": "> **Prozpr**\n..."}}]
  md = dg.generate_document(snap)   # exercises _build_prompt_vars + extract path
  ```

  To exercise the freshness gate instead, point `MarketCommentaryAgent(output_dir=tmp)` at a temp dir and prime `market_commentary_latest.{json,md}` with known mtimes — `run_from_cache` is pure file I/O until it decides to call the doc LLM.

<script>
(function () {
  const mdSource = document.getElementById('source-md').textContent;

  marked.use({ gfm: true, breaks: false, headerIds: true, mangle: false });

  const rawHtml = marked.parse(mdSource);
  const content = document.getElementById('content');
  content.innerHTML = rawHtml;

  // Convert ```mermaid code blocks into <div class="mermaid"> for rendering.
  content.querySelectorAll('pre code.language-mermaid').forEach((codeEl) => {
    const div = document.createElement('div');
    div.className = 'mermaid';
    div.textContent = codeEl.textContent;
    codeEl.parentElement.replaceWith(div);
  });

  function slugify(text) {
    return text.toLowerCase().replace(/[^a-z0-9\s-]/g, '').trim().replace(/\s+/g, '-');
  }
  content.querySelectorAll('h2, h3').forEach((h) => { if (!h.id) h.id = slugify(h.textContent); });

  const tocList = document.getElementById('toc-list');
  content.querySelectorAll('h2, h3').forEach((h) => {
    const li = document.createElement('li');
    li.className = 'lvl-' + h.tagName.charAt(1);
    const a = document.createElement('a');
    a.href = '#' + h.id;
    a.textContent = h.textContent;
    li.appendChild(a);
    tocList.appendChild(li);
  });

  mermaid.initialize({
    startOnLoad: false,
    theme: 'default',
    flowchart: { curve: 'basis', htmlLabels: true },
    securityLevel: 'loose',
  });
  mermaid.run({ querySelector: '.mermaid' });

  const headings = Array.from(content.querySelectorAll('h2, h3'));
  const tocLinks = Array.from(tocList.querySelectorAll('a'));
  const linkById = new Map(tocLinks.map(a => [a.getAttribute('href').slice(1), a]));
  function onScroll() {
    const fromTop = window.scrollY + 80;
    let active = headings[0];
    for (const h of headings) { if (h.offsetTop <= fromTop) active = h; else break; }
    tocLinks.forEach(a => a.classList.remove('active'));
    if (active) { const link = linkById.get(active.id); if (link) link.classList.add('active'); }
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();
})();
</script>
