# `market_commentary` — the macro letter the rest of chat reads

> **One line:** when a `general_market_query` turn finds the cache stale (24h TTL), Claude web-searches 14 Indian macro indicators (repo rate, CPI, index PEs, gold, FII flows, USD/INR…), pins them into a `MacroSnapshot`, and writes a 2-page **monthly** markdown commentary to `Reference_docs/`. That **`.md` file is the contract** — `portfolio_query` and `general_chat` read it off disk; neither imports this module.
>
> This is the engineer's guide to the module. There is **no Logics thesis doc** for market commentary (the customer-facing letter *is* the artefact). For where every agent sits in the package, see [Tech_reference_docs/ARCHITECTURE.html](../Tech_reference_docs/ARCHITECTURE.html).

---

## 1. What it's about

The module lives at [`AI_Agents/src/market_commentary/`](../../src/market_commentary/). It is **not** a chat turn's reply-writer — it is a **data-gathering + document-rendering pipeline**. Its job is to answer one question well: *"what does the Indian macro picture look like right now?"* — and to freeze that answer into a file everyone else can quote. The rendered letter is styled as a **monthly** commentary (its letterhead reads *"Market Commentary | {Month YYYY}"*), but the pipeline is triggered **on demand per turn** and refreshed at most once every 24h via a TTL cache — there is no scheduler in this codebase.

Two things consume the output, and neither imports the module — the **file is the contract**:

- **`general_chat`** reads the rendered doc from `prior[MARKET_COMMENTARY].payload` and tailors the customer's reply to it (this is the live chat path).
- **`portfolio_query`** reads `Reference_docs/market_commentary_latest.md` directly off disk as its macro-context block.

> **Sibling — the fund-house view.** This agent writes only the *factual* commentary. Prozpr's qualitative **view** lives in a separate, hand-maintained file, `Reference_docs/fund_house_commentry.md` (not produced here). The same two flows load it when the classifier's `tools_needed` asks for `fund_house_view`, and the reply surfaces the named fund houses as research sources. See `app/domains/market_commentary/services/fund_house_view_module_service.py`.

The defining design decision: **the numbers are grounded, not invented.** Every indicator comes from Claude's own `web_search` calls against named authoritative sources (RBI, MOSPI, NSE, NSDL…). Anything that can't be verified becomes `null` and lands in `data_gaps` — the doc-gen prompt then says "cannot be assessed from available inputs" rather than guessing.

### The run shape (fast-path first, full-run only when stale)

```mermaid
flowchart TB
    START([general_market_query turn]) --> FP{snapshot cache<br/>fresh?}
    FP -->|".md newer than .json"| RET["return .md verbatim<br/>(no LLM)"]
    FP -->|"snapshot fresh, .md stale"| DG1["doc-gen only · Haiku"]
    FP -->|"stale / absent"| WS["<b>Pass 1 · web-search extract</b><br/>Haiku + Anthropic web_search<br/>→ extract_macro_data tool"]
    WS --> SNAP[("MacroSnapshot<br/>14 indicators + data_gaps")]
    SNAP --> DG2["<b>Pass 2 · doc-gen</b><br/>Haiku forced-tool<br/>(reasoned_reply)"]
    DG1 --> MD
    DG2 --> MD[("market_commentary_latest.md<br/>+ .json cache")]
    RET --> OUT
    MD --> OUT([macro doc → general_chat / portfolio_query])
```

The engine ([`main.py`](../../src/market_commentary/main.py)) owns the orchestration; [`document_generator.py`](../../src/market_commentary/document_generator.py) owns the render. **Why a fast path?** A full run is 15–25 web searches plus two LLM calls — expensive and slow. The rendered `.md` is a **deterministic-enough function of the snapshot** that once it's written, it is reused verbatim within the TTL window (`MARKET_COMMENTARY_CACHE_MAX_AGE_SEC`, default 24h) with no LLM call at all.

## 2. Where it sits

The engine is a peer agent: it imports no other agent — only shared [`common.py`](../../src/common.py) (`read_text_bom_aware`, `format_inr_indian`), [`persona.py`](../../src/persona.py) (`build_system_prompt`), and [`reasoned_reply.py`](../../src/reasoned_reply.py) (the discard-the-thinking-field tool contract). Everything scheduling- and key-shaped is the app layer's job.

| Direction | Who | What flows |
|---|---|---|
| **Upstream** | `intent_classifier` → `general_market_query` → [`flow_market`](../../../app/domains/ai_engine/services/flow.py) | the intent runs `market_commentary` **then** `general_chat` in sequence |
| **Gateway (brain-facing)** | [`market_commentary_module_service.run(turn, ctx, prior)`](../../../app/domains/market_commentary/services/market_commentary_module_service.py) | the ONLY brain entry point; 120s timeout → empty payload so the turn still continues |
| **AI bridge** | [`market_commentary_engine.generate_market_commentary`](../../../app/domains/market_commentary/services/market_commentary_engine.py) | resolves cache path (`Reference_docs/`), freshness + API key, drives `MarketCommentaryAgent` (fast path → full run) |
| **Downstream (chat)** | [`general_chat_module_service`](../../../app/domains/general_chat/services/general_chat_module_service.py) | reads `prior[MARKET_COMMENTARY].payload` (the doc string) and writes the actual customer reply |
| **Downstream (file)** | [`portfolio_query`](../../src/portfolio_query/) | reads `market_commentary_latest.md` off disk — the file, not an import |

> **This module never writes the customer's reply.** `market_commentary_module_service` returns a `ModuleOutput` whose `payload` is the doc string and whose `text` is left unset (`None`). The turn's visible answer is `general_chat`'s. If you're chasing "why did the market answer read oddly", that's a `general_chat` question, not this module.

### What `ctx` / `turn` must carry

`flow_market` calls `run_market_commentary(turn, ctx, {})`. In today's code the run is **question-agnostic** — worth knowing before you debug a "why didn't it use my question" report:

| Attribute | Type | Used for |
|---|---|---|
| `turn.user_question` | `str` | **passed but currently `del`'d** in `generate_market_commentary` — reserved for future question-conditioned runs |
| `turn.conversation_history` | `list[{role, content}]` | same — accepted then discarded today |
| `turn.session_id` | `str` | timeout/failure logging only |

The knobs that actually change behaviour live in config, not `ctx`: `MARKET_COMMENTARY_CACHE_MAX_AGE_SEC` (freshness, default `86400`) and `MARKET_COMMENTARY_API_KEY` (→ falls back to `ANTHROPIC_API_KEY`).

## 3. Input contract

Unlike `mutual_fund_query`, this engine has **no single pydantic input model** — its "input" is the live web plus a handful of orchestration parameters. The surface is `MarketCommentaryAgent`:

**`MarketCommentaryAgent(api_key=None, output_dir=".", generate_document=True)`**

| Param | Type | Notes |
|---|---|---|
| `api_key` | `str?` | passed explicitly into each LLM builder; `None` ⇒ ambient `ANTHROPIC_API_KEY`. **Never** mutates process-global env (races under async concurrency) |
| `output_dir` | `str` | where `market_commentary_latest.{json,md}` are read/written — the app layer points this at `AI_Agents/Reference_docs/` |
| `generate_document` | `bool` | if `False`, `run()` stops after extraction+cache (snapshot only, no markdown) |

**Two run methods**, each its own entry:

| Method | Signature | Role |
|---|---|---|
| `run()` | `() → MacroSnapshot` | full pipeline: web-search extract → cache → write `.json` + `.md` |
| `run_from_cache(max_age_sec, date=None)` | `→ str \| None` | fast path: return fresh `.md` verbatim, else regen doc from cached snapshot, else `None` |

The private extraction schema `_MacroExtraction` ([`main.py`](../../src/market_commentary/main.py)) is the **14 indicator fields only** — no `data_gaps`, no `document_md` — so the `extract_macro_data` tool's `input_schema` stays clean. `_to_snapshot` then derives `data_gaps` as "every field that came back `null`".

---

## 4. Output contract

The one durable model is `MacroSnapshot` ([`models.py`](../../src/market_commentary/models.py)):

```
MacroSnapshot
├── repo_rate_pct, rbi_stance                          # RBI / monetary policy
├── cpi_yoy_pct                                        # inflation
├── nifty50_pe, nifty_midcap150_pe, nifty_smallcap250_pe   # equity valuations (trailing PE)
├── gsec_10yr_yield_pct, sbi_fd_1yr_rate_pct           # debt
├── gold_price_inr_per_10g, gold_price_usd_per_oz      # gold (two units, on purpose)
├── fed_funds_rate_pct, fii_net_flows_cr_inr           # global macro / flows
├── brent_crude_usd, usd_inr_rate                      # oil / FX
├── data_gaps: list[str]                               # indicators that came back null
└── document_md: str?                                  # the rendered letter; set AFTER doc-gen, NOT persisted to .json
```

Every indicator field is `Optional[float]` (or `Optional[str]` for `rbi_stance`) — a `null` is a **contract signal** ("we couldn't verify this"), not a missing value to backfill. Two on-disk artefacts fall out of a run, both in `output_dir`:

| File | What | Written by |
|---|---|---|
| `market_commentary_latest.json` | the `MacroSnapshot` cache (**no** `document_md` — it's saved before doc-gen sets that field) | `CacheManager.save` |
| `market_commentary_latest.md` | the rendered 2-page letter — **the file everyone reads** | `MarketCommentaryAgent._write_document` (full run) / inline write (fast path) |

The brain gateway collapses all of this into a single `ModuleOutput(payload=<doc string>)` for the sequence.

---

## 5. How it thinks

The pipeline is two LLM passes wrapped in a cache-freshness gate. No numbers are ever computed by the engine — the LLM's job is to **gather** (pass 1) then **narrate** (pass 2).

### The freshness gate — `run_from_cache`

Before any LLM call, `run_from_cache(max_age_sec, date)` decides how much work is needed:

1. No `.json`, or `.json` older than `max_age_sec` (or the loaded snapshot is empty) → return `None` (caller runs the full `run()`).
2. `.json` fresh **and** `.md` mtime ≥ `.json` mtime → return the `.md` **verbatim** (BOM-aware read, no LLM).
3. `.json` fresh but `.md` missing/stale → regenerate the doc from the cached snapshot (**doc-gen LLM only**) and persist it.

### Pass 1 — web-search extraction (`run_websearch_extraction`)

1. One Haiku call (`claude-haiku-4-5-20251001`, `max_tokens=4096`) bound to **two** tools: Anthropic's server-side `web_search_20250305` (`max_uses=25`) **and** `extract_macro_data`.
2. Claude plans its own searches, disambiguates the known failure modes baked into `EXTRACTION_SYSTEM_PROMPT_WEBSEARCH` (repo vs SDF vs MSF; gold USD/oz vs INR/10g; spot vs forward USD/INR; trailing vs forward index PE), and finalises with one `extract_macro_data` call.
3. `_MacroExtraction(**tool_call["args"])` → `_to_snapshot` → `MacroSnapshot`. If Claude never finalises, an **all-null** snapshot is returned so the caller's fallback fires.
4. In `run()`: an all-null snapshot ⇒ fall back to the **last cached snapshot** and append `"ALL_LIVE_DATA_FAILED — using cached snapshot"` to `data_gaps`. A non-empty snapshot is saved to `.json`.

### Pass 2 — document generation (`generate_document`)

1. `_build_prompt_vars` turns the snapshot into template strings — including **pre-computed spreads** (`gsec_repo_spread`, `gsec_fd_spread`) and **pre-formatted Indian-notation gold** (`format_inr_indian`, so Haiku never converts raw rupees to lakh/crore and trips its order-of-magnitude bug). `None` → `"N/A"`.
2. One Haiku call (`claude-haiku-4-5-20251001`, `max_tokens=3800`), forced to the `return_commentary_document` tool built via `reasoned_reply_tool` — the model writes a private `outline` (discarded) **before** the `document` body, so the letter starts cleanly at the letterhead.
3. `extract_reasoned_reply(..., answer_field="document")` pulls the body; empty ⇒ `RuntimeError`.

## 6. Where the LLM is

**Every pass here is an LLM call** — this is an LLM-driven module end to end. What keeps it honest is *grounding* (web_search on named sources) and *pre-computation* (spreads, Indian-notation gold), not determinism.

| Pass | Model (code id) | Determinism |
|---|---|---|
| web-search extract | `claude-haiku-4-5-20251001` | probabilistic; grounded by `web_search` on authoritative sources |
| doc-gen | `claude-haiku-4-5-20251001` | probabilistic wording over the snapshot; then **cached & reused verbatim** within the TTL |
| Q&A (`chat_qa.py`) | `claude-sonnet-4-6` | probabilistic; grounded ONLY in the stored `.md` — **not on the live chat path** (see §8) |

All three LLMs go through LangChain `ChatAnthropic` (per the repo convention), each built lazily and `@cache`d so the key is read at call time, never at import (the extraction and doc-gen builders `@cache` per API key; the QA builder reads the ambient key).

## 8. Invariants & landmines

- **The `.md` file is the contract, not an import.** `portfolio_query` reads `market_commentary_latest.md` off disk and `general_chat` reads the doc from `prior[MARKET_COMMENTARY].payload`. Neither imports this module. Change the file's shape/location and you break two consumers with no compile-time signal — grep for `market_commentary_latest.md`.
- **`chat_qa.py` is orphaned-on-purpose.** `answer_question` (the only Sonnet caller) has **no production caller** — outside its own reasoning test it is referenced only by the dev-only [`chat_eval` reasoning snapshot](../../src/chat_eval/reasoning_surface_snapshot.py) — the production `general_market_query` flow tailors its reply in `general_chat`, not here. Don't "wire it up" without a product decision; don't delete it assuming it's dead code either.
- **`null` indicator = "unavailable", never a guess.** An unverified field stays `null` and lands in `data_gaps`; the doc-gen prompt says "cannot be assessed from available inputs". Widening the extraction to backfill nulls would silently invent macro data.
- **All-null snapshot ⇒ reuse the cache, tag `ALL_LIVE_DATA_FAILED`.** `run()` never writes an empty snapshot over a good one; it falls back to the last cache and flags it. Don't "simplify" that guard away.
- **Gold is pre-formatted; spreads are pre-computed.** `_build_prompt_vars` sends Indian-notation gold (`format_inr_indian`) and the two rate spreads as strings so Haiku copies rather than computes — this dodges its known order-of-magnitude bug. Keep new derived figures on the Python side of the boundary.
- **Files are written UTF-8, read BOM-aware.** `CacheManager.save` and `_write_document` pin `encoding="utf-8"` (never the OS locale / cp1252); reads go through `read_text_bom_aware` because a `.md` may arrive UTF-16 from PowerShell. Don't swap in a naive `open().read()`.
- **API key is passed explicitly, never via env mutation.** The extraction and doc-gen LLM builders take `api_key` and are `@cache`d per key; process-global `os.environ` mutation races under async concurrency. Preserve the explicit-key plumbing.
- **The fast-path "deterministic" claim is about caching, not generation.** Doc-gen is an LLM (probabilistic). The invariant is that once written, the `.md` is reused verbatim while fresher than the TTL — so regeneration only happens on a stale/missing file. Don't read it as "same snapshot ⇒ byte-identical letter".
- **Failure is soft at the gateway.** `market_commentary_module_service` wraps the run in a 120s `wait_for` and returns `ModuleOutput(payload=None)` on timeout/error, so the sequence still reaches `general_chat` with no macro doc rather than failing the whole turn.

## 9. Extend & test

- **Add / retune an indicator** → add the field to `MacroSnapshot` ([`models.py`](../../src/market_commentary/models.py)) **and** `_MacroExtraction` + the `extract_macro_data` `input_schema` ([`prompts.py`](../../src/market_commentary/prompts.py)), then surface it in `_build_prompt_vars` and the doc-gen structure so the letter can use it. Missing any one of those three and the field is silently dropped.
- **Change wording / PE bands / structure** → edit [`prompts.py`](../../src/market_commentary/prompts.py) only (`EQUITY_PE_BANDS` was last reviewed 2026-05-02 — bump the date when you touch it). Because the letter is a customer-facing surface, run the prompt eval gate (`scripts/run_prompt_eval_gate.sh`) before merging.
- **Tests** live beside the module (there is no `Testing/` subfolder here):

  | Level | Where | Covers |
  |---|---|---|
  | doc-gen reasoning-discard | [`test_document_generator_reasoning.py`](../../src/market_commentary/test_document_generator_reasoning.py) | `outline` field discarded, `document` body returned; LLM stubbed |
  | QA reasoning-discard | [`test_chat_qa_reasoning.py`](../../src/market_commentary/test_chat_qa_reasoning.py) | `reasoning` field discarded, safe fallback on malformed tool call |

  Run with the mac venv: `.venv-mac/bin/python -m pytest AI_Agents/src/market_commentary/`.
- **Run doc-gen without hitting the web** — the pattern the tests use: hand-build a `MacroSnapshot`, patch the LLM at the tool boundary (`_get_doc_llm` / `_get_qa_llm`), and assert on the assembled prompt + the discarded-field behaviour. No web_search, no Anthropic call, no database:

  ```python
  import market_commentary.document_generator as dg
  from market_commentary.models import MacroSnapshot

  snap = MacroSnapshot(repo_rate_pct=5.5, rbi_stance="neutral", nifty50_pe=22.4)
  # patch dg._get_doc_llm to a stub returning {"outline": "...", "document": "# Prozpr\n..."}
  md = dg.generate_document(snap)   # exercises _build_prompt_vars + extract path
  ```

  To exercise the freshness gate instead, point `MarketCommentaryAgent(output_dir=tmp)` at a temp dir and prime `market_commentary_latest.{json,md}` with known mtimes — `run_from_cache` is pure file I/O until it decides to call the doc LLM.

<script>
(function () {
  const mdSource = document.getElementById('source-md').textContent;

  marked.use({ gfm: true, breaks: false, headerIds: true, mangle: false });

  const rawHtml = marked.parse(mdSource);
  const content = document.getElementById('content');
  content.innerHTML = rawHtml;

  // Convert ```mermaid code blocks into <div class="mermaid"> for rendering.
  content.querySelectorAll('pre code.language-mermaid').forEach((codeEl) => {
    const div = document.createElement('div');
    div.className = 'mermaid';
    div.textContent = codeEl.textContent;
    codeEl.parentElement.replaceWith(div);
  });

  function slugify(text) {
    return text.toLowerCase().replace(/[^a-z0-9\s-]/g, '').trim().replace(/\s+/g, '-');
  }
  content.querySelectorAll('h2, h3').forEach((h) => { if (!h.id) h.id = slugify(h.textContent); });

  const tocList = document.getElementById('toc-list');
  content.querySelectorAll('h2, h3').forEach((h) => {
    const li = document.createElement('li');
    li.className = 'lvl-' + h.tagName.charAt(1);
    const a = document.createElement('a');
    a.href = '#' + h.id;
    a.textContent = h.textContent;
    li.appendChild(a);
    tocList.appendChild(li);
  });

  mermaid.initialize({
    startOnLoad: false,
    theme: 'default',
    flowchart: { curve: 'basis', htmlLabels: true },
    securityLevel: 'loose',
  });
  mermaid.run({ querySelector: '.mermaid' });

  const headings = Array.from(content.querySelectorAll('h2, h3'));
  const tocLinks = Array.from(tocList.querySelectorAll('a'));
  const linkById = new Map(tocLinks.map(a => [a.getAttribute('href').slice(1), a]));
  function onScroll() {
    const fromTop = window.scrollY + 80;
    let active = headings[0];
    for (const h of headings) { if (h.offsetTop <= fromTop) active = h; else break; }
    tocLinks.forEach(a => a.classList.remove('active'));
    if (active) { const link = linkById.get(active.id); if (link) link.classList.add('active'); }
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();
})();
</script>
