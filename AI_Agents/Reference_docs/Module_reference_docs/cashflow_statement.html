# `cashflow_statement` — will this household's money reach its goals?

> **One line:** given a household's profile, retirement plan, properties, and goals, this module projects the money **month by month to the end of the horizon** and answers one question honestly — *are the goals funded, and if not, by how much and what would close the gap?* The arithmetic is 100% deterministic Python; the LLM only ever narrates numbers it was handed.
>
> This is the engineer's guide to the module. For the client-facing philosophy (the planning thesis, inflation/ROI approach), see [Logics_reference_docs/Cashflow_Statement.md](../Logics_reference_docs/Cashflow_Statement.md). For where every agent sits in the package, see [Tech_reference_docs/ARCHITECTURE.html](../Tech_reference_docs/ARCHITECTURE.html).

## 1. What it's about

The module lives at [`AI_Agents/src/cashflow_statement/`](../../src/cashflow_statement/) and owns the **`goal_planning`** chat intent — anything about goal feasibility, retirement adequacy, shortfalls, or "what if" counterfactuals:

- *"Will I meet my goals?"* / *"When do I reach ₹1 crore?"* → **narrate** — the plan as it stands (a milestone crossing is resolved in code)
- *"What if I retire at 50?"* / *"What if I invest ₹50k more a month?"* / *"Can I afford a ₹10 lakh trip next June?"* → **counterfactual_explore** — the engine re-run with one allow-listed input changed, never saved
- *"What if I retire earlier?"* (no number) → **clarify** — one question back, no engine run

It has **two faces**. The **engine** ([`engine/pipeline.py`](../../src/cashflow_statement/engine/pipeline.py)) is an 8-stage pure-Python projection validated against an Excel baseline — no LLM, no I/O, fully reproducible. The **agent** ([`agent/graph.py`](../../src/cashflow_statement/agent/graph.py)) is a LangGraph `StateGraph` — the *only* LangGraph agent in the whole `AI_Agents` package — that turns natural language into engine inputs, runs the engine as a tool, and proposes deterministic levers. Production uses the engine through the app-layer chat bridge (one Haiku detector + an override allow-list); the agent is not wired in.

The defining design decision mirrors every other Prozpr module: **the LLM never produces a number.** The engine does all the math; rupee values are pre-formatted to Indian notation before they reach any model, which is told to copy them verbatim. A confidently-wrong corpus figure is treated as a worse failure than a plain one.

```mermaid
flowchart TB
    Q([goal_planning question]) --> DET["<b>Goal-action detector (Haiku)</b><br/>narrate · counterfactual_explore · clarify<br/>+ overrides · milestone_target_inr"]
    DET -->|clarify| CQ(["one question back<br/>(no engine run)"])
    DET --> GW["<b>App bridge</b><br/>build GoalPlanningInput from<br/>profile + goals + properties<br/>+ allow-listed overrides"]
    GW --> ENG["<b>Engine · 8 stages</b><br/>compute_full_projection<br/>(pure Python, deterministic)"]
    ENG --> OUT[("GoalPlanningOutput<br/>headline · goals · cashflow")]
    OUT --> FP["<b>facts_pack</b><br/>raw + pre-formatted ₹ facts<br/>(plan run persisted on base turns)"]
    FP --> R(["shared answer formatter (Haiku)<br/>+ annual cashflow chart"])
    ENG -. "wrapped by (agent path,<br/>test-only)" .-> AG["<b>LangGraph agent</b><br/>NL → tools → engine → levers"]
```

> **The production chat path runs the engine directly, not the agent.** See §2 — this is the single most important thing to know before you touch this module.

---

## 2. Where it sits

The engine is a near-peer: within `src/` it imports **no other agent**, only the shared [`financial_primitives`](../../src/financial_primitives/) numeric-kernel library (TVM, Indian-FY dates, `eomonth`) — a library, not a blessed cross-agent edge. The summarizer and the agent nodes also use the shared `src/` helpers `common.format_inr_indian` and `persona.build_system_prompt`. Everything database-shaped is the app layer's job.

| Direction | Who | What flows |
|---|---|---|
| **Upstream** | `intent_classifier` → chat brain `FLOWS` (`flow_goal_planning` in `ai_engine/services/flow.py`) | the `goal_planning` intent routes here |
| **Gateway** | [`cashflow_module_service.run(turn, ctx, prior)`](../../../app/domains/cashflow/services/cashflow_module_service.py) | the ONLY module-level entry the brain calls; delegates to the chat dispatcher (`dispatch_chat("goal_planning", ctx)`) |
| **Chat handler** | [`goal_planning_engine/chat.py`](../../../app/domains/cashflow/services/goal_planning_engine/chat.py) `goal_planning_chat` | runs the Haiku detector (`_detect_goal_action`), short-circuits `clarify`, calls the bridge, maps refusals to fixed relay messages, hands `facts_pack` to the shared answer formatter, attaches the `cashflow_annual_bar` chart payload |
| **Bridge + engine run** | [`goal_planning_engine/service.py`](../../../app/domains/cashflow/services/goal_planning_engine/service.py) `compute_goal_planning_snapshot` | builds `GoalPlanningInput` from the ORM `User`, applies any counterfactual overrides ([`overrides.py`](../../../app/domains/cashflow/services/goal_planning_engine/overrides.py)), runs `compute_full_projection` in a thread, persists the run **on base turns only**, emits `facts_pack` + a deterministic `fallback_text` (no `summarize_plan` — see the callout) |
| **Input build** | `goal_planning_engine/input_builder.py` `build_goal_planning_input_for_user` | profile + properties + active goals → `GoalPlanningInput`; **hard-refuses** incomplete profiles (`missing_date_of_birth`, `missing_required_inputs:<keys>`) rather than zero-filling |
| **Non-chat entry** | [`cashflow_compute_service.run_cashflow_projection_for_user`](../../../app/domains/cashflow/services/cashflow_compute_service.py) | the `/cashflow` router's path — same builder + engine, output wrapped as a `GoalPlanningSnapshot`. `GET /cashflow/latest` recomputes and persists when no run exists, the latest run is stale, its `engine_version` differs from `ENGINE_VERSION`, or it was computed before today; `POST /cashflow/compute` forces a run; `GET /cashflow/readiness` serves the input gate |
| **Staleness** | `cashflow_persist_service.mark_stale` | the goals router, onboarding, CAMS CAS ingest and a persisted monthly SIP from `additional_investment` (which also writes the SIP into `starting_monthly_investment`) mark the latest plan run stale |
| **Goal FV for allocation** | `aa_engine/input_builder.py` (feeds the ideal and practical allocation input builders) | imports `custom_goal_fv` + the bridge's `map_custom_goal` and sets each active future goal's `amount_needed_fv` with default `Assumptions()` — the goal waterfall funds the same FV this projection pays out |

<div class="callout danger">
  <div class="title">⚠ The LangGraph agent is orphaned on the production path</div>
  <p>Despite being the codebase's only LangGraph agent, <code>run_cashflow_statement</code> / <code>cashflow_statement_graph</code> is <strong>not invoked by any production caller</strong> — every reference outside the module's own definition and its lazy re-export is a test or a dev script (the module's <code>Testing/agent/</code> suite, <code>scripts/probe_cashflow_statement.py</code>, and a monkeypatch in <code>goal_planning_engine/tests/test_service.py</code> that targets an attribute <code>service.py</code> does not have). The live chat path (<code>service.py</code>) calls <code>compute_full_projection</code> (the pure engine) directly and does <em>not</em> call <code>summarize_plan</code>: a second narration would compete with the shared answer formatter, and <code>test_no_summarizer_in_chat.py</code> asserts the chat module never imports it. Production what-ifs run through the app's own override allow-list (§5), not the agent's tools. The agent — tools, levers, overrides, what-ifs — is fully built and unit-tested but dark. If you're debugging a live goal-planning turn, the agent graph is <em>not</em> in the call stack; the snapshot comes straight from the engine.</p>
</div>

### What `ctx` must carry

The bridge signature is `compute_goal_planning_snapshot(*, user, user_question, chat_session_id, anchor_date, db=None, overrides=None, milestone_target_inr=None)`. The chat handler pulls these off the turn context:

| Attribute | Type | Used for |
|---|---|---|
| `ctx.user_ctx` | pre-loaded `User` (personal-finance profile, investment profile + current properties, tax profile, financial goals) | the sole source of engine inputs; the input builder maps it to `GoalPlanningInput`; the detector reads current expense / SIP / retirement age off it |
| `ctx.db` | `AsyncSession` | primary-portfolio value lookup (folded into the starting corpus) + persisting the plan run on base turns; `None` ⇒ `ValueError` |
| `anchor_date` | `date` | chat passes `date.today()`; the input builder uses it to drop goals dated on/before it and to resolve the Retirement goal's age. The engine's own "today" is `profile._current_date()` (`date.today()`), not this argument |
| `ctx.user_question` + `ctx.conversation_history` | `str` / list | the detector's input (the last `DETECT_HISTORY_TURNS` = 6 turns, marked as background that is never a source of overrides); the engine itself is question-agnostic (it always projects the full plan) |
| `ctx.session_id` | UUID | `chat_session_id` on the persisted plan run |

## 3. Input contract

The load-bearing input is `GoalPlanningInput` in [`models.py`](../../src/cashflow_statement/models.py) — the single source of truth for the engine↔agent boundary.

| Field | Type | Notes |
|---|---|---|
| `profile` | `ClientProfile` | income, `effective_tax_rate` (contract: blended, **not** marginal), `financial_assets`, `financial_liabilities_excl_mortgage`, monthly expense, optional starting SIP (`None` ⇒ invest 75% of each month's surplus; `0` ⇒ invest nothing). **Product path:** `financial_assets` = cash & debt + `equity_shares` + the primary portfolio's `total_value` (the manual `current_portfolio_corpus` when no portfolio is linked); the tax rate is the tax profile's `income_tax_rate` — the marginal slab the profile screen collects — then the legacy PFP rate, then 25% |
| `retirement` | `RetirementInput` | DOB, `retirement_age`, `assumed_lifespan_years` (no model defaults — the engine never guesses when a household retires), optional corpus override in today's ₹. **Product path:** age = the Retirement goal's target year − birth year, else `investment_profile.retirement_age`, else 60; lifespan = the user's stored value, else 100; `investment_profile.target_corpus` → the corpus override |
| `assumptions` | `Assumptions` | all inflation / ROI / growth rates + horizon knobs. Defaults (the product path always sends `Assumptions()`): inflation 6% (8% child abroad education); income growth 8%; SIP step-up 8%/yr; post-tax ROI 5% / 7% / 9% for goals and corpus months ≤2 yrs / 2–5 yrs / beyond; retired-portfolio ROI 9%; default SIP share 75% |
| `current_properties` | `list[CurrentProperty]` | existing homes (product path: `investment_profile.current_properties`); `has_mortgage=True` requires `mortgage_emi` + `mortgage_end_date` (validated) |
| `goal_properties` | `list[GoalProperty]` | future purchases; cash or `is_downpayment_only` mortgage path (XOR `upfront_amount` / `downpayment_pct`). **Product path: always empty** — a `HOME_PURCHASE` goal arrives as a cash custom goal (with a validation note) |
| `custom_goals` | `list[CustomGoal]` | life goals; PV **or** FV value, `goal_type` picks the inflation rate. **Product path:** ACTIVE goals dated after `anchor_date` only, duplicate names skipped; `CHILD_EDUCATION` → `child_local_education`, `HOME_PURCHASE` → `property`, everything else (Retirement included) → `custom`; a per-goal `inflation_rate` becomes `inflation_rate_override` (values > 1 read as percent) |
| `one_off_inflows` / `one_off_outflows` | `list[OneOffEvent]` | dated lump sums; an outflow past the projection end is **dropped with a warning**. **Product path: empty**, except that a `one_off_outflow` counterfactual appends one outflow |
| `detail_level` | `"default" \| "full"` | `"full"` returns the month-by-month `monthly_cashflow`. The product builder sets `"default"` on both paths (see §8) |
| `model_retirement` | `bool` | **True** (agent/dev, the model default): inject retirement as a goal + stop salary income at retirement. **False** (product path): no injected payout and salary income never stops; retirement is funded only if the user adds it as an explicit goal. Either way the **horizon** still runs to `max(last_goal, retirement_date)` |

Cross-cutting validators live on the models: names (goals, properties, one-off descriptions, plus a reserved `"retirement"` when `model_retirement=True`) must be unique case-insensitively; past-dated goals raise before any compute (`validate_input_only` in [`pipeline.py`](../../src/cashflow_statement/engine/pipeline.py)). The product builder gates first: only `date_of_birth`, `annual_income` and `monthly_household_expense` are required ([`readiness.py`](../../../app/domains/cashflow/services/goal_planning_engine/readiness.py) `REQUIRED_CASHFLOW_FIELDS`); retirement age, tax rate, portfolio corpus, cash & debt, equities and liabilities are optional.

---

## 4. Output contract

The engine returns `GoalPlanningOutput`; the agent path returns `GoalPlanningSnapshot` (a subclass adding per-turn metadata), and the REST path wraps the engine output in one too (its agent-only fields stay empty). Both in [`models.py`](../../src/cashflow_statement/models.py).

| Field | Type | Notes |
|---|---|---|
| `engine_version` | `str` | `"0.3.1"` (`ENGINE_VERSION` in `pipeline.py`); **bump on any math change** so cached plan runs auto-recompute |
| `input_echo` / `computed_at` | `GoalPlanningInput` / `datetime` | the exact input the run used; UTC compute time (persisted on the plan run) |
| `headline` | `HeadlineStatus` | the top line: `is_feasible` (canonical: all goals funded **and** `corpus_closing >= 0`), `total_shortfall_fv`, `corpus_today`, `surplus_or_shortfall_today` (PV view) |
| `retirement` | `RetirementSnapshot` | corpus required (FV at retirement + PV today), years-to-retirement, real ROI |
| `goals` | `list[GoalFundingStatus]` | per-goal `is_funded` / `funded_amount` / `shortfall_fv` / `corpus_required_fv` |
| `one_off_outflow_status` | `list[OneOffFundingStatus]` | per one-off funded/shortfall |
| `annual_cashflow` | `list[AnnualCashflowRow]` | per-FY P&L **and** corpus evolution (reconciles per row) |
| `monthly_cashflow` | `list[MonthlyCashflowRow]?` | present only when `detail_level == "full"` |
| `fund_flow_summary` | `FundFlowSummary` | horizon bridge: opening + invest + ROI + one-offs − goals = closing |
| `goal_property_details` | `list[GoalPropertyDetail]` | resolved EMI / interest / payoff per property goal |
| `warnings` | `list[str]` | soft issues (e.g. dropped late one-off) |

**Snapshot-only extras** (`GoalPlanningSnapshot`): `extracted_events_this_turn`, `actions_taken_this_turn` (tool audit log), `levers`, `validation_issues`, `error_log`, and `summary: PlanSummary | None` (the LLM narrative written by the agent's `finalize` node). No production path fills `summary`, so the REST response's `plan_summary` is always null.

**The chat `facts_pack`** (`service._build_facts_pack`) is what the formatter sees: `headline`, `retirement` (profile retirement date/age, years to it, expense today, post-retirement years, `is_funded_as_a_goal`; the corpus-required figures only when `model_retirement` is true), `cashflow_horizon` (the fund-flow bridge), `goals[]` (with a `verdict` of `funded` / `partially_funded` / `unfunded`), `corpus_composition`, `annual_cashflow[]` (eight `*_indian` amounts per FY plus `corpus_closing` raw + formatted), `validation_issues` (shipped as an empty list), and `corpus_milestone` when the detector extracted a target. Every rupee amount has an `_indian` sibling.

## 5. How it thinks

### The engine — 8 deterministic stages

`compute_full_projection` runs the stages in strict order; each stage's output feeds the next. Every stage is one file under [`engine/`](../../src/cashflow_statement/engine/), pure Python, no LLM.

| # | Stage | Entry (file) | What it does |
|---|---|---|---|
| 1 | profile | `build_initial_context` — [`profile.py`](../../src/cashflow_statement/engine/profile.py) | builds the internal `RunContext` (starting corpus = `financial_assets − financial_liabilities_excl_mortgage`, tax, "today" = `date.today()`, ROI-band cutoffs, 100-yr horizon cap) |
| 2 | retirement | `compute_retirement_snapshot` — [`retirement.py`](../../src/cashflow_statement/engine/retirement.py) | corpus required at retirement (FV) + PV-today; sets income-stop when `model_retirement` |
| 3 | mortgages | `build_existing_mortgages` — [`mortgages.py`](../../src/cashflow_statement/engine/mortgages.py) | projects existing-home EMI outflows through each end date |
| 4 | properties | `build_goal_properties` / `build_goal_property_details` — [`properties.py`](../../src/cashflow_statement/engine/properties.py) | future purchases: cash vs mortgage, downpayment FV, amortization |
| 5 | goals_table | `build_goals_table` — [`goals_table.py`](../../src/cashflow_statement/engine/goals_table.py) | unifies retirement + property + custom goals into one internal goal list (inflates PV→FV) |
| 6 | cashflow | `project_cashflow` + `derive_annual_cashflow` — [`cashflow.py`](../../src/cashflow_statement/engine/cashflow.py) | month-by-month P&L (income, tax, expense, EMI, savings) across the horizon |
| 7 | funding | `compute_funding` — [`funding.py`](../../src/cashflow_statement/engine/funding.py) | walks the monthly cashflow, evolves **one shared corpus pool**, pays goals, splits shortfalls proportionally. Each month: a deficit is drawn from the corpus; a surplus funds the stated SIP (grown 8%/FY, capped at the surplus) or 75% of it when no SIP is set; returns follow the 5/7/9% bands, earn nothing on a negative corpus, and are **zero for the partial current FY** (the stub only establishes the starting corpus) |
| 8 | summary | `build_headline_status` + `build_fund_flow_summary` — [`summary.py`](../../src/cashflow_statement/engine/summary.py) | rolls the funded monthly view into the headline + horizon bridge |

Internal types (`RunContext`, `MortgageSchedule`, `GoalInternal`, `FundingResult`, …) live in [`engine/_types.py`](../../src/cashflow_statement/engine/_types.py) and are **not** re-exported — only [`models.py`](../../src/cashflow_statement/models.py) types cross the boundary.

### The production chat turn — detect, (re-)run, format

[`chat.py`](../../../app/domains/cashflow/services/goal_planning_engine/chat.py) `goal_planning_chat` is what a live `goal_planning` turn executes:

1. **Detect.** `_detect_goal_action` makes one Haiku call (`classify_action`, temperature 0, `max_tokens=300`, the goal-planning API key) with structured output `GoalChatAction`: `mode` (`narrate` default · `counterfactual_explore` · `clarify`), `overrides`, `clarification_question`, `milestone_target_inr`. The user block carries TODAY, the recent history as background, and the current expense and SIP (read through `personal_finance_scalars`) plus `investment_profile.retirement_age`, so a relative change ("₹50k more a month") resolves to an absolute value. A feasibility question that names a value different from the plan's ("can I retire at 55?" on a plan retiring at 60) routes to `counterfactual_explore`. A detector failure falls back to `narrate`.
2. **Clarify short-circuits.** `clarify` returns the question (or `_DEFAULT_CLARIFY_FALLBACK` when empty) with no engine run and no formatter.
3. **Re-run with overrides.** On `counterfactual_explore`, `apply_overrides` copies the built input with an allow-listed change — exactly four keys (`ALLOWED_OVERRIDE_KEYS`): `retirement_age` → `RetirementInput`; `starting_monthly_investment`, `monthly_household_expense` → `ClientProfile`; `one_off_outflow` → **appended** to `one_off_outflows`. An unknown key raises `ValueError`; return / inflation assumptions are deliberately not overridable. The base input is never mutated, and a counterfactual run is **not persisted**. With `model_retirement=False`, a `retirement_age` override moves only the profile retirement date in the `retirement` facts and, when no goal is dated later, the horizon end — salary does not stop and the customer's own Retirement goal keeps its date, so the funding verdict typically matches the base plan.
4. **Facts.** The bridge builds `facts_pack`; when `milestone_target_inr` is set, `_corpus_milestone` writes `corpus_milestone` (`already_reached` against `corpus_today`, else the first FY whose `corpus_closing` reaches the target, else null) so "when do I reach ₹X?" is answered in code.
5. **Format.** `format_with_telemetry` (module `goal_planning`, the detector's mode as `action_mode`, `_BODY_PROMPT`) writes the reply; `fallback_text` covers a formatter failure. The Logics thesis `Cashflow_Statement.md` is attached on `narrate` only. Refusals — `missing_date_of_birth`, `missing_required_inputs:<keys>` (labels from `REQUIRED_CASHFLOW_FIELDS`) — go through `format_relay_or_canned` with a fixed message; a `missing_financial_profile` branch exists but nothing raises it.

### The narration passes — LCEL, not LangGraph

The module's own LLM code (none of it on the production path) has two plain **LCEL** chains (`prompt | llm.with_structured_output(...)`), each a single linear pass with no state or looping:

- **`summarize_plan`** ([`summarizer.py`](../../src/cashflow_statement/summarizer.py)) — Haiku turns a `GoalPlanningOutput` into a `PlanSummary`. `_build_facts` pre-formats **every rupee value** into Indian notation (`₹X.XX crore`); Haiku is told to quote those strings verbatim and do no arithmetic. `next_steps` is **not** LLM-generated — it's `[l.description for l in levers]`. Callers: `dev_run.py` and the agent's `finalize` node only.
- **`extract_event`** ([`agent/extractor.py`](../../src/cashflow_statement/agent/extractor.py)) — Haiku parses one NL message into an `ExtractedFinancialEvent`, with a rapidfuzz collision check (`token_set_ratio ≥ 85`) that promotes a near-duplicate goal name to a mutation. Agent-only.

### The agent — a 4-node StateGraph (LangGraph)

The agent ([`agent/graph.py`](../../src/cashflow_statement/agent/graph.py)) is the stateful counterpart: a loop that lets **Sonnet** call engine tools until it has what it needs, capped at 15 iterations, no checkpointer (each invocation is a fresh state).

```mermaid
flowchart LR
    IB["ingest_baseline<br/>validate overrides,<br/>reset per-turn fields"] --> AG
    AG["agent<br/>Sonnet + 6 bound tools"] -->|tool_calls| TN["tools<br/>ToolNode"]
    TN --> AG
    AG -->|no tool_calls| FN["finalize<br/>ensure engine output<br/>+ summarize_plan"]
    FN --> E([GoalPlanningSnapshot])
```

The six tools ([`agent/tools.py`](../../src/cashflow_statement/agent/tools.py)): `extract_financial_event`, `apply_override`, `clear_overrides`, `mutate_goal`, `compute_projection`, `propose_levers`. Each has a pure-Python `*_impl` (unit-testable without LangGraph) plus a `@tool` wrapper returning a `Command` that propagates state mutations. The agent node is a **router**, not a writer — its final message is discarded; only the structured snapshot flows onward (per [`agent/prompts.py`](../../src/cashflow_statement/agent/prompts.py)). `propose_levers` runs the deterministic A–F lever search in [`agent/levers.py`](../../src/cashflow_statement/agent/levers.py) — each lever bisects/steps one parameter (SIP, defer, reduce, retire-later, step-up, expense) and re-runs the engine until feasible, so even the "recommendations" are engine-verified, not model opinion.

## 6. Where the LLM is

| Part | Deterministic or LLM | Model |
|---|---|---|
| 8-stage projection engine | **deterministic** — pure Python, Excel-parity | none |
| override application, milestone crossing, facts pack, fallback text (app bridge) | **deterministic** | none |
| A–F lever search (`levers.py`, agent-only) | **deterministic** — bisection over engine re-runs | none |
| goal-action detector (`chat.py`, **production**) | LLM — picks the mode, extracts override values / a milestone target, writes no prose | Haiku `claude-haiku-4-5-20251001`, temperature 0 |
| shared answer formatter (`ai_engine/answer_formatter`, **production**) | LLM — *narrates* the `facts_pack` | Haiku `claude-haiku-4-5-20251001`, temperature `AILAX_FORMATTER_TEMPERATURE` (default 0) |
| `summarize_plan` (LCEL, `dev_run.py` + agent `finalize` only) | LLM — *narrates* pre-formatted ₹ facts | Haiku `claude-haiku-4-5-20251001`, temperature 0 |
| `extract_event` (LCEL, agent-only) | LLM — NL → structured event | Haiku `claude-haiku-4-5-20251001`, temperature 0 |
| agent node (LangGraph, agent-only) | LLM — *routes* to tools, writes no prose | Sonnet `claude-sonnet-4-6`, temperature 0 |

The engine **never calls an LLM**, and that is the whole point: a goal plan must be reproducible and auditable. Run it twice on the same input and you get byte-identical numbers — no temperature, no drift, testable against a fixed Excel baseline. The LLMs sit strictly *around* the numbers: on the live path one routes the question and pulls override values out of words, one narrates finished figures. Neither is allowed to compute, because a hallucinated corpus figure quoted with confidence is the failure this whole design exists to prevent — the rupee values are pre-formatted precisely so the model's only job is to copy.

> On the agent-node default: [`graph.py`](../../src/cashflow_statement/agent/graph.py) `build_graph(model="claude-sonnet-4-6")` wins — `nodes.AGENT_MODEL_DEFAULT` (Haiku) is only the fallback default of `make_agent_node`, which the compiled graph overrides. So the compiled agent runs on **Sonnet** (the stale "Haiku-driven" phrasing in `run_cashflow_statement`'s docstring notwithstanding).

## 8. Invariants & landmines

- **The agent graph is dark on the production path** (§2). Wiring it in is a real change, not a refactor — do it deliberately, and flag the Logics thesis and this guide for a refresh when you do.
- **Bump `ENGINE_VERSION` on any projection-math change** ([`pipeline.py`](../../src/cashflow_statement/engine/pipeline.py)). `GET /cashflow/latest` recomputes any stored plan run whose version differs; skip the bump and customers see stale corpus figures.
- **The LLM must never state a number that isn't pre-formatted in the facts.** `service._build_facts_pack` gives every rupee amount an `_indian` sibling and `_BODY_PROMPT` tells the formatter to quote those verbatim and never re-derive lakh/crore (`summarizer._build_facts` does the same for the dormant `summarize_plan`). Widen the facts only with values you can source from the engine.
- **One deliberate exception: `corpus_closing` also ships RAW in `annual_cashflow`.** Formatted strings are lossy for reasoning — compared as strings, `"₹98.5 lakh"` and `"₹1.02 crore"` mis-order. `corpus_closing` is the one per-year figure that is **compared across years**, so each row carries the raw number plus `corpus_closing_indian` for display. The other eight annual amounts are only ever *quoted*, so they ship formatted-only (`*_indian`); raw values for them would add ~1,400 tokens per goal-planning turn for no benefit. The generalisable rule: **format at the last moment for display, keep raw whatever the model must reason over.**
- **"When do I reach ₹X?" is resolved in code, not by the formatter.** The detector extracts `milestone_target_inr` (guidance lives in the Pydantic field description, not the prompt body) and `_corpus_milestone` writes the first crossing into `facts_pack["corpus_milestone"]`; the body prompt forbids scanning `annual_cashflow` for a crossing. Keep the scan out of `_BODY_PROMPT` — a model scanning 20–40 rows picks different years run to run.
- **`corpus_today` is NOT "their portfolio".** It is cash & debt + directly-held equity + the primary portfolio's value (or the manual portfolio corpus when none is linked), **minus non-mortgage liabilities** — usually **larger** than the portfolio value the customer sees on screen. The chat facts pack carries a `corpus_composition` split (`linked_portfolio_value`, `direct_equity_shares`, `cash_and_debt`) so the answer can say "everything you hold" versus "your portfolio" correctly; that split shows neither the liabilities nor a manual portfolio corpus, so its parts need not sum to `corpus_today`. Quoting the merged corpus as their portfolio overstates it. The projection models only the **combined** corpus — there is no year-by-year forecast for any single component, so never project one forward.
- **A counterfactual run is never persisted.** `plan_run_id = None if is_counterfactual else await _persist_plan_run(...)`, gated on `bool(overrides)`: a base chat turn writes the plan run the Goal Planning screen reads back, so persisting a hypothetical would overwrite the real plan (`service.py`).
- **The override allow-list is the safety boundary.** Exactly four keys (`overrides.ALLOWED_OVERRIDE_KEYS`); an unknown key raises rather than silently modelling something the customer did not ask. Return / inflation assumptions are excluded on purpose — a customer must not be able to shop for an ROI that makes the plan "work".
- **`custom_goal_fv` is shared with the allocation engines.** `aa_engine/input_builder.py` (ideal + practical) prices every goal's `amount_needed_fv` with it and the bridge's `map_custom_goal`, so a change to goal FV math or the ORM goal-type mapping moves the allocation's short-term goal amounts as well as this projection.
- **`summarize_plan` has no production caller, so no `PlanSummary` exists in production.** `next_steps` is deterministic, from levers — not the LLM; don't "fix" an empty narrative by having the model invent action items.
- **No production path produces monthly rows.** The builder sets `detail_level="default"`; `run_cashflow_projection_for_user` overrides it only when the caller asks for something other than `"full"`, so the router's `detail_level="full"` leaves it at `"default"` — `monthly_cashflow` is `None`, no `cashflow_monthly_rows` are written, and the chat chart payload's `monthly_cashflow` list is empty.
- **The engine's "today" is `date.today()`** (`profile._current_date()`, monkeypatchable in tests) — not the caller's `anchor_date`, which only filters goals and resolves the Retirement goal's age in the input builder.
- **The partial current FY earns no return.** When today is past 1 April, the stub months add SIP/withdrawals but `investment_returns` is 0 until the first full FY (`funding.py`).
- **Time convention is day-precise `EOMONTH(date)/365`.** Inflation FV and PV-discount both use it, symmetrically, across every stage (`retirement.py`, `properties.py`, `goals_table.py`). Don't swap in whole-year or 360-day math — it breaks Excel parity.
- **`_round_thousand` applies only to FV anchors** (`corpus_required_fv`, `target_fv`, the retirement expense and corpus FVs); PV/display fields stay unrounded (`engine/dates.py`). Rounding a PV field silently shifts totals.
- **Indian FY is April–March; `fy_for_date` returns the closing year** (April 2026 → 2027, labelled `FY2027`). Off-by-one here mis-buckets every annual row.
- **One shared corpus pool, not per-goal.** Funding walks the monthly cashflow and splits shortfalls proportionally across a month's outflows (`funding.py`). Sign conventions: shortfalls positive, EMI/expense/payout positive magnitudes, `surplus_or_shortfall_today` signed.
- **`model_retirement` governs income-stop + the injected retirement payout, NOT the horizon.** The projection always runs to `max(last_goal, retirement_date)` regardless (`pipeline.py`). Conflating the two is the classic bug this flag's long comment warns against.
- **Incomplete profiles are hard-refused, never zero-filled** (`input_builder.py`): no DOB raises `missing_date_of_birth`; a missing annual income or monthly household expense raises `missing_required_inputs:<keys>`. The optional inputs take stated planning assumptions instead (retirement age 60, lifespan 100, tax 25%, ₹0 for absent assets / liabilities).
- **The agent submodule loads lazily** ([`__init__.py`](../../src/cashflow_statement/__init__.py) `__getattr__`) so the pure-engine path imports cleanly without `langgraph` installed. Don't move the agent import to module top level.
- **Failure is soft.** On the live path a detector failure falls back to `narrate`, a formatter failure to the deterministic `fallback_text`, and a plan-run persist failure is logged with `plan_run_id=None`. On the agent path `run_cashflow_statement` catches any graph error (incl. the 15-iter recursion cap) and returns an error-snapshot built from a plain baseline compute — a customer never sees a stack trace.

| engine unit | [`Testing/unit/`](../../src/cashflow_statement/Testing/unit/) | per-stage math (`test_engine_cashflow.py`, `test_engine_retirement.py`, `test_engine_dates.py`, `test_engine_funding.py`, …) + model validation (`test_models_*.py`) |
| engine integration | [`Testing/integration/`](../../src/cashflow_statement/Testing/integration/) | end-to-end pipeline (`test_engine_pipeline.py`), smoke (`test_smoke.py`), performance (`test_engine_performance.py`), property-goal details (`test_goal_property_details.py`) |
| agent | [`Testing/agent/`](../../src/cashflow_statement/Testing/agent/) | `test_e2e.py`, `test_extractor.py`, `test_levers.py`, `test_state.py`, `test_tools.py` — LLM stubbed |
| boundary | [`Testing/boundary/`](../../src/cashflow_statement/Testing/boundary/) | `test_engine_no_llm.py` (the engine imports with no LLM libs) + `test_public_api_only.py` |

Outside the module: the chat bridge's tests sit in `app/domains/cashflow/services/goal_planning_engine/tests/` (`test_chat.py`, `test_input_builder.py`, `test_service.py` tracked; the overrides, counterfactual-run, detector-wiring, annual-facts, retirement-facts and no-summarizer suites local only), and `AI_Agents/tests/test_custom_goal_fv.py` pins the shared goal-FV helper.

> **Excel parity is not a pytest.** The Excel-baseline comparison lives in the dev eval harness under `AI_Agents/tests/cashflow_statement/` (CSV artifacts in `runs/_current_excel_compare/`), not the `Testing/` suite. The pytest integration layer proves the pipeline runs and reconciles; the eval harness is what you re-run to confirm the numbers still match the spreadsheet.

Run with the mac venv:

```
.venv-mac/bin/python -m pytest AI_Agents/src/cashflow_statement/Testing/
```

- **Run one engine stage in isolation** — the engine is pure functions, so build a `GoalPlanningInput` and call `compute_full_projection` (or a single stage entry from [`engine/`](../../src/cashflow_statement/engine/)) directly; assert on the returned pydantic. No API key, no DB. See `Testing/unit/` for the per-stage patterns and `dev_run.py` for a full sample profile.
- **Run the agent without an API key** — the tests stub the LLM at the chain/tool boundary (`extract_event(..., _chain=<stub>)` is an explicit test hook; tools have pure `*_impl` fns). Assert on state mutations and tool routing, never on model wording.
- **Change engine math** → update the stage file, **bump `ENGINE_VERSION`**, then re-run the end-to-end pipeline tests (`test_engine_pipeline.py`) and re-check the Excel-parity comparison in the dev eval harness (`AI_Agents/tests/cashflow_statement/`) before anything else — parity is the contract. If the *approach* changed, flag the Logics thesis [Cashflow_Statement.md](../Logics_reference_docs/Cashflow_Statement.md) for a refresh — it grounds `narrate` answers in chat, and reference docs are refreshed on request, not as part of the code change. A goal-FV change also moves the allocation input (`custom_goal_fv`, §8).
- **Change what chat can model** → extend `ALLOWED_OVERRIDE_KEYS` + `apply_overrides` and the detector's `GoalChatAction.overrides` field description together; a key the detector can emit but `apply_overrides` rejects fails the turn with `ValueError`.
- **Change narration** → the live reply is written by the shared formatter from `_BODY_PROMPT` in [`chat.py`](../../../app/domains/cashflow/services/goal_planning_engine/chat.py); the dormant narrators are the prompt bodies in [`summarizer.py`](../../src/cashflow_statement/summarizer.py) and `agent/prompts.py`. The model's wording under guardrails is checked by the chat eval gate (`scripts/run_prompt_eval_gate.sh`), not these unit tests.

<script>
(function () {
  const mdSource = document.getElementById('source-md').textContent;

  marked.use({ gfm: true, breaks: false, headerIds: true, mangle: false });

  const rawHtml = marked.parse(mdSource);
  const content = document.getElementById('content');
  content.innerHTML = rawHtml;

  // Convert ```mermaid code blocks into <div class="mermaid"> for rendering.
  content.querySelectorAll('pre code.language-mermaid').forEach((codeEl) => {
    const div = document.createElement('div');
    div.className = 'mermaid';
    div.textContent = codeEl.textContent;
    codeEl.parentElement.replaceWith(div);
  });

  function slugify(text) {
    return text.toLowerCase().replace(/[^a-z0-9\s-]/g, '').trim().replace(/\s+/g, '-');
  }
  content.querySelectorAll('h2, h3').forEach((h) => { if (!h.id) h.id = slugify(h.textContent); });

  const tocList = document.getElementById('toc-list');
  content.querySelectorAll('h2, h3').forEach((h) => {
    const li = document.createElement('li');
    li.className = 'lvl-' + h.tagName.charAt(1);
    const a = document.createElement('a');
    a.href = '#' + h.id;
    a.textContent = h.textContent;
    li.appendChild(a);
    tocList.appendChild(li);
  });

  mermaid.initialize({
    startOnLoad: false,
    theme: 'default',
    flowchart: { curve: 'basis', htmlLabels: true },
    securityLevel: 'loose',
  });
  mermaid.run({ querySelector: '.mermaid' });

  const headings = Array.from(content.querySelectorAll('h2, h3'));
  const tocLinks = Array.from(tocList.querySelectorAll('a'));
  const linkById = new Map(tocLinks.map(a => [a.getAttribute('href').slice(1), a]));
  function onScroll() {
    const fromTop = window.scrollY + 80;
    let active = headings[0];
    for (const h of headings) { if (h.offsetTop <= fromTop) active = h; else break; }
    tocLinks.forEach(a => a.classList.remove('active'));
    if (active) { const link = linkById.get(active.id); if (link) link.classList.add('active'); }
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();
})();
</script>
