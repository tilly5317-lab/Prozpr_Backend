# `cashflow_statement` — will this household's money reach its goals?

> **One line:** given a household's profile, retirement plan, properties, and goals, this module projects the money **month by month to the end of the horizon** and answers one question honestly — *are the goals funded, and if not, by how much and what would close the gap?* The arithmetic is 100% deterministic Python; the LLM only ever narrates numbers it was handed.
>
> This is the engineer's guide to the module. For the client-facing philosophy (the planning thesis, inflation/ROI approach), see [Logics_reference_docs/Cashflow_Statement.md](../Logics_reference_docs/Cashflow_Statement.md). For where every agent sits in the package, see [Tech_reference_docs/ARCHITECTURE.html](../Tech_reference_docs/ARCHITECTURE.html).

## 1. What it's about

The module lives at [`AI_Agents/src/cashflow_statement/`](../../src/cashflow_statement/) and owns the **`goal_planning`** chat intent — anything about goal feasibility, retirement adequacy, shortfalls, or "what if" counterfactuals:

- *"Am I on track to retire at 60?"* → **feasibility**
- *"Can I afford a ₹2 crore house in 2032 and still fund my kid's college?"* → **new goal + projection**
- *"What if I bump my SIP?"* / *"How do I fix the shortfall?"* → **what-if + levers**

It has **two faces**. The **engine** ([`engine/pipeline.py`](../../src/cashflow_statement/engine/pipeline.py)) is an 8-stage pure-Python projection validated against an Excel baseline — no LLM, no I/O, fully reproducible. The **agent** ([`agent/graph.py`](../../src/cashflow_statement/agent/graph.py)) is a LangGraph `StateGraph` — the *only* LangGraph agent in the whole `AI_Agents` package — that turns natural language into engine inputs, runs the engine as a tool, and proposes deterministic levers.

The defining design decision mirrors every other Prozpr module: **the LLM never produces a number.** The engine does all the math; rupee values are pre-formatted to Indian notation before they reach any model, which is told to copy them verbatim. A confidently-wrong corpus figure is treated as a worse failure than a plain one.

```mermaid
flowchart TB
    Q([goal_planning question]) --> GW["<b>App gateway</b><br/>build GoalPlanningInput from<br/>profile + goals + properties"]
    GW --> ENG["<b>Engine · 8 stages</b><br/>compute_full_projection<br/>(pure Python, deterministic)"]
    ENG --> OUT[("GoalPlanningOutput<br/>headline · goals · cashflow")]
    OUT --> SUM["<b>Summarizer (Haiku LCEL)</b><br/>narrate pre-formatted ₹ facts"]
    SUM --> R([facts_pack → chat formatter])
    ENG -. "wrapped by (agent path,<br/>test-only today)" .-> AG["<b>LangGraph agent</b><br/>NL → tools → engine → levers"]
```

> **The production chat path runs the engine directly, not the agent.** See §2 — this is the single most important thing to know before you touch this module.

## 2. Where it sits

The engine is a near-peer: within `src/` it imports **no other agent**, only the shared [`financial_primitives`](../../src/financial_primitives/) numeric-kernel library (TVM, Indian-FY dates, `eomonth`) — a library, not a blessed cross-agent edge. Everything database-shaped is the app layer's job.

| Direction | Who | What flows |
|---|---|---|
| **Upstream** | `intent_classifier` → chat brain `FLOWS` | the `goal_planning` intent routes here |
| **Gateway** | [`cashflow_module_service.run(turn, ctx, prior)`](../../../app/domains/cashflow/services/cashflow_module_service.py) | the ONLY module-level entry the brain calls; delegates to the chat dispatcher (`dispatch_chat("goal_planning", ctx)`) |
| **Bridge + engine run** | [`goal_planning_engine/service.py`](../../../app/domains/cashflow/services/goal_planning_engine/service.py) `compute_goal_planning_snapshot` | builds `GoalPlanningInput` from the ORM `User`, runs `compute_full_projection`, calls `summarize_plan`, persists the run, emits `facts_pack` |
| **Input build** | `goal_planning_engine/input_builder.py` | profile + properties + active goals → `GoalPlanningInput`; **hard-refuses** incomplete profiles (`missing_required_inputs:<keys>`) rather than zero-filling |
| **Non-chat entry** | [`cashflow_compute_service.run_cashflow_projection_for_user`](../../../app/domains/cashflow/services/cashflow_compute_service.py) | REST/detail path (the `/cashflow` router + the `additional_investment` input builder both call it) — same engine, wraps output as a `GoalPlanningSnapshot` |

<div class="callout danger">
  <div class="title">⚠ The LangGraph agent is orphaned on the production path</div>
  <p>Despite being the codebase's only LangGraph agent, <code>run_cashflow_statement</code> / <code>cashflow_statement_graph</code> is <strong>not invoked by any production caller</strong> — grep the app and every reference outside the module's own definition and its lazy re-export is test-only (a monkeypatch in <code>goal_planning_engine/tests/</code>). The live chat path (<code>service.py</code>) calls <code>compute_full_projection</code> (the pure engine) plus <code>summarize_plan</code> (Haiku LCEL) directly. The agent — tools, levers, overrides, what-ifs — is fully built and unit-tested but currently dark. If you're debugging a live goal-planning turn, the agent graph is <em>not</em> in the call stack. Don't assume ARCHITECTURE.html's "responder consumes the snapshot" flow is wired; today the snapshot comes straight from the engine.</p>

### What `ctx` must carry

The bridge signature is `compute_goal_planning_snapshot(*, user, user_question, chat_session_id, anchor_date, db)`. The chat handler pulls these off the turn context:

| Attribute | Type | Used for |
|---|---|---|
| `ctx` user graph | pre-loaded `User` (profile → goals → properties → holdings) | the sole source of engine inputs; the input builder maps it to `GoalPlanningInput` |
| `ctx.db` | `AsyncSession` | portfolio-value lookup (folded into starting corpus) + persisting the plan run; `None` ⇒ `ValueError` |
| `anchor_date` | `date` | the engine's notion of "today" (past-goal validation, FY math) — chat passes `date.today()` |
| `user_question` | `str` | classified upstream; the engine itself is question-agnostic (it always projects the full plan) |

## 3. Input contract

The load-bearing input is `GoalPlanningInput` in [`models.py`](../../src/cashflow_statement/models.py) — the single source of truth for the engine↔agent boundary.

| Field | Type | Notes |
|---|---|---|
| `profile` | `ClientProfile` | income, `effective_tax_rate` (blended, **not** marginal), assets, liabilities, monthly expense, optional starting SIP |
| `retirement` | `RetirementInput` | DOB, `retirement_age`, `assumed_lifespan_years` (no defaults — the engine never guesses when a household retires), optional corpus override in today's ₹ |
| `assumptions` | `Assumptions` | all inflation / ROI / growth rates + horizon knobs; every rate has a documented default |
| `current_properties` | `list[CurrentProperty]` | existing homes; `has_mortgage=True` requires `mortgage_emi` + `mortgage_end_date` (validated) |
| `goal_properties` | `list[GoalProperty]` | future purchases; cash or `is_downpayment_only` mortgage path (XOR `upfront_amount` / `downpayment_pct`) |
| `custom_goals` | `list[CustomGoal]` | life goals; PV **or** FV value, `goal_type` picks the inflation rate |
| `one_off_inflows` / `one_off_outflows` | `list[OneOffEvent]` | dated lump sums; an outflow past the projection end is **dropped with a warning** |
| `detail_level` | `"default" \| "full"` | `"full"` returns the month-by-month `monthly_cashflow` |
| `model_retirement` | `bool` | **True** (agent/dev, the default): inject retirement as a goal + stop salary income at retirement. **False** (product path): retirement modelled only if the user adds it as an explicit goal. Either way the **horizon** still runs to `max(last_goal, retirement_date)` |

Cross-cutting validators live on the models: goal names must be unique case-insensitively; past-dated goals raise before any compute (`validate_input_only` in [`pipeline.py`](../../src/cashflow_statement/engine/pipeline.py)).

---

## 4. Output contract

The engine returns `GoalPlanningOutput`; the agent path returns `GoalPlanningSnapshot` (a subclass adding per-turn metadata). Both in [`models.py`](../../src/cashflow_statement/models.py).

| Field | Type | Notes |
|---|---|---|
| `engine_version` | `str` | `"0.3.0"`; **bump on any math change** so cached plan runs auto-recompute |
| `headline` | `HeadlineStatus` | the top line: `is_feasible` (canonical: all goals funded **and** `corpus_closing >= 0`), `total_shortfall_fv`, `corpus_today`, `surplus_or_shortfall_today` (PV view) |
| `retirement` | `RetirementSnapshot` | corpus required (FV at retirement + PV today), years-to-retirement, real ROI |
| `goals` | `list[GoalFundingStatus]` | per-goal `is_funded` / `funded_amount` / `shortfall_fv` / `corpus_required_fv` |
| `one_off_outflow_status` | `list[OneOffFundingStatus]` | per one-off funded/shortfall |
| `annual_cashflow` | `list[AnnualCashflowRow]` | per-FY P&L **and** corpus evolution (reconciles per row) |
| `monthly_cashflow` | `list[MonthlyCashflowRow]?` | present only when `detail_level == "full"` |
| `fund_flow_summary` | `FundFlowSummary` | horizon bridge: opening + invest + ROI + one-offs − goals = closing |
| `goal_property_details` | `list[GoalPropertyDetail]` | resolved EMI / interest / payoff per property goal |
| `warnings` | `list[str]` | soft issues (e.g. dropped late one-off) |

**Snapshot-only extras** (`GoalPlanningSnapshot`): `extracted_events_this_turn`, `actions_taken_this_turn` (tool audit log), `levers`, `validation_issues`, `error_log`, and `summary: PlanSummary | None` (the LLM narrative written by the agent's `finalize` node).

## 5. How it thinks

### The engine — 8 deterministic stages

`compute_full_projection` runs the stages in strict order; each stage's output feeds the next. Every stage is one file under [`engine/`](../../src/cashflow_statement/engine/), pure Python, no LLM.

| # | Stage | Entry (file) | What it does |
|---|---|---|---|
| 1 | profile | `build_initial_context` — [`profile.py`](../../src/cashflow_statement/engine/profile.py) | builds the internal `RunContext` (starting corpus, tax, "today", horizon cap) |
| 2 | retirement | `compute_retirement_snapshot` — [`retirement.py`](../../src/cashflow_statement/engine/retirement.py) | corpus required at retirement (FV) + PV-today; sets income-stop when `model_retirement` |
| 3 | mortgages | `build_existing_mortgages` — [`mortgages.py`](../../src/cashflow_statement/engine/mortgages.py) | projects existing-home EMI outflows through each end date |
| 4 | properties | `build_goal_properties` / `build_goal_property_details` — [`properties.py`](../../src/cashflow_statement/engine/properties.py) | future purchases: cash vs mortgage, downpayment FV, amortization |
| 5 | goals_table | `build_goals_table` — [`goals_table.py`](../../src/cashflow_statement/engine/goals_table.py) | unifies retirement + property + custom goals into one internal goal list (inflates PV→FV) |
| 6 | cashflow | `project_cashflow` + `derive_annual_cashflow` — [`cashflow.py`](../../src/cashflow_statement/engine/cashflow.py) | month-by-month P&L (income, tax, expense, EMI, savings) across the horizon |
| 7 | funding | `compute_funding` — [`funding.py`](../../src/cashflow_statement/engine/funding.py) | walks the monthly cashflow, evolves **one shared corpus pool**, pays goals, splits shortfalls proportionally |
| 8 | summary | `build_headline_status` + `build_fund_flow_summary` — [`summary.py`](../../src/cashflow_statement/engine/summary.py) | rolls the funded monthly view into the headline + horizon bridge |

Internal types (`RunContext`, `MortgageSchedule`, `GoalInternal`, `FundingResult`, …) live in [`engine/_types.py`](../../src/cashflow_statement/engine/_types.py) and are **not** re-exported — only [`models.py`](../../src/cashflow_statement/models.py) types cross the boundary.

### The narration passes — LCEL, not LangGraph

Two of the three LLM touchpoints are plain **LCEL** chains (`prompt | llm.with_structured_output(...)`), a single linear pass with no state or looping:

- **`summarize_plan`** ([`summarizer.py`](../../src/cashflow_statement/summarizer.py)) — Haiku turns a `GoalPlanningOutput` into a `PlanSummary`. `_build_facts` pre-formats **every rupee value** into Indian notation (`₹X.XX crore`); Haiku is told to quote those strings verbatim and do no arithmetic. `next_steps` is **not** LLM-generated — it's `[l.description for l in levers]`, so on the production path (no levers) it's empty.
- **`extract_event`** ([`agent/extractor.py`](../../src/cashflow_statement/agent/extractor.py)) — Haiku parses one NL message into an `ExtractedFinancialEvent`, with a rapidfuzz collision check (`token_set_ratio ≥ 85`) that promotes a near-duplicate goal name to a mutation. Agent-only.

### The agent — a 4-node StateGraph (LangGraph)

The agent ([`agent/graph.py`](../../src/cashflow_statement/agent/graph.py)) is the stateful counterpart: a loop that lets **Sonnet** call engine tools until it has what it needs, capped at 15 iterations, no checkpointer (each invocation is a fresh state).

```mermaid
flowchart LR
    IB["ingest_baseline<br/>validate overrides,<br/>reset per-turn fields"] --> AG
    AG["agent<br/>Sonnet + 6 bound tools"] -->|tool_calls| TN["tools<br/>ToolNode"]
    TN --> AG
    AG -->|no tool_calls| FN["finalize<br/>ensure engine output<br/>+ summarize_plan"]
    FN --> E([GoalPlanningSnapshot])
```

The six tools ([`agent/tools.py`](../../src/cashflow_statement/agent/tools.py)): `extract_financial_event`, `apply_override`, `clear_overrides`, `mutate_goal`, `compute_projection`, `propose_levers`. Each has a pure-Python `*_impl` (unit-testable without LangGraph) plus a `@tool` wrapper returning a `Command` that propagates state mutations. The agent node is a **router**, not a writer — its final message is discarded; only the structured snapshot flows onward (per [`agent/prompts.py`](../../src/cashflow_statement/agent/prompts.py)). `propose_levers` runs the deterministic A–F lever search in [`agent/levers.py`](../../src/cashflow_statement/agent/levers.py) — each lever bisects/steps one parameter (SIP, defer, reduce, retire-later, step-up, expense) and re-runs the engine until feasible, so even the "recommendations" are engine-verified, not model opinion.

## 6. Where the LLM is

| Part | Deterministic or LLM | Model |
|---|---|---|
| 8-stage projection engine | **deterministic** — pure Python, Excel-parity | none |
| A–F lever search (`levers.py`) | **deterministic** — bisection over engine re-runs | none |
| `summarize_plan` (LCEL) | LLM — *narrates* pre-formatted ₹ facts | Haiku `claude-haiku-4-5-20251001` |
| `extract_event` (LCEL, agent-only) | LLM — NL → structured event | Haiku `claude-haiku-4-5-20251001` |
| agent node (LangGraph, agent-only) | LLM — *routes* to tools, writes no prose | Sonnet `claude-sonnet-4-6` |

The engine **never calls an LLM**, and that is the whole point: a goal plan must be reproducible and auditable. Run it twice on the same input and you get byte-identical numbers — no temperature, no drift, testable against a fixed Excel baseline. The LLMs sit strictly *around* the numbers: one names goals from words, one narrates finished figures. Neither is allowed to compute, because a hallucinated corpus figure quoted with confidence is the failure this whole design exists to prevent — the rupee values are pre-formatted precisely so the model's only job is to copy.

> On the agent-node default: [`graph.py`](../../src/cashflow_statement/agent/graph.py) `build_graph(model="claude-sonnet-4-6")` wins — `nodes.AGENT_MODEL_DEFAULT` (Haiku) is only the fallback default of `make_agent_node`, which the compiled graph overrides. So the compiled agent runs on **Sonnet** (the stale "Haiku-driven" phrasing in `run_cashflow_statement`'s docstring notwithstanding).

## 8. Invariants & landmines

- **The agent graph is dark on the production path** (§2). Wiring it in is a real change, not a refactor — do it deliberately, and update the Logics thesis + this doc when you do.
- **Bump `ENGINE_VERSION` on any projection-math change** ([`pipeline.py`](../../src/cashflow_statement/engine/pipeline.py)). Stored plan runs auto-recompute when their version differs; skip the bump and customers see stale corpus figures.
- **The LLM must never state a number that isn't pre-formatted in the facts.** `summarizer._build_facts` hands Haiku `_indian` strings; the prompt forbids arithmetic. Widen the facts only with values you can source from the engine.
- **One deliberate exception: `corpus_closing` also ships RAW.** Formatting *everything* turned out to be lossy for reasoning — asked "when do I cross ₹1 crore?", the model was comparing the strings `"₹98.5 lakh"` and `"₹1.02 crore"` and getting it wrong. `corpus_closing` is the one figure that has to be **compared across years**, so the chat facts pack carries both the raw number and a `corpus_closing_indian` sibling for display. The other nine annual-cashflow amounts are only ever *quoted*, so they ship formatted-only (`*_indian`); shipping raw values for all of them cost ~1,400 tokens per goal-planning turn and bought nothing. The generalisable lesson: **format at the last moment for display, keep raw whatever the model must reason over.**
- **`corpus_today` is NOT "their portfolio".** It merges three sources — the linked mutual-fund portfolio, directly-held equity, and cash/debt — so it is usually **larger** than the portfolio value the customer sees on screen. The chat facts pack now carries a `corpus_composition` split (`linked_portfolio_value`, `direct_equity_shares`, `cash_and_debt`) precisely so the answer can say "everything you hold" versus "your portfolio" correctly. Quoting the merged corpus as their portfolio overstates it. Note also that the projection models only the **combined** corpus — there is no year-by-year forecast for any single component, so never project one forward.
- **`next_steps` is deterministic, from levers — not the LLM.** On the production path no levers are computed, so `next_steps` is empty; don't "fix" this by having the model invent action items.
- **Time convention is day-precise `EOMONTH(date)/365`.** Inflation FV and PV-discount both use it, symmetrically, across every stage (`retirement.py`, `properties.py`, `goals_table.py`). Don't swap in whole-year or 360-day math — it breaks Excel parity.
- **`_round_thousand` applies only to FV cashflow anchors** (`corpus_required_fv`, `target_fv`); PV/display fields stay unrounded (`engine/dates.py`). Rounding a PV field silently shifts totals.
- **Indian FY is April–March; `fy_for_date` returns the closing year** (April 2026 → FY27). Off-by-one here mis-buckets every annual row.
- **One shared corpus pool, not per-goal.** Funding walks the monthly cashflow and splits shortfalls proportionally across a month's outflows (`funding.py`). Sign conventions: shortfalls positive, EMI/expense/payout positive magnitudes, `surplus_or_shortfall_today` signed.
- **`model_retirement` governs income-stop + the injected retirement payout, NOT the horizon.** The projection always runs to `max(last_goal, retirement_date)` regardless (`pipeline.py`). Conflating the two is the classic bug this flag's long comment warns against.
- **Incomplete profiles are hard-refused, never zero-filled** (`input_builder.py`): the builder raises `missing_required_inputs:<keys>` so the engine only ever sees real numbers.
- **The agent submodule loads lazily** ([`__init__.py`](../../src/cashflow_statement/__init__.py) `__getattr__`) so the pure-engine path imports cleanly without `langgraph` installed. Don't move the agent import to module top level.
- **Failure is soft.** `run_cashflow_statement` catches any graph error (incl. the 15-iter recursion cap) and returns an error-snapshot built from a plain baseline compute — a customer never sees a stack trace.

## 9. Extend & test

Tests live at four levels under [`Testing/`](../../src/cashflow_statement/Testing/) — the paths below all exist:

| Level | Where | Covers |
|---|---|---|
| engine unit | [`Testing/unit/`](../../src/cashflow_statement/Testing/unit/) | per-stage math (`test_engine_cashflow.py`, `test_engine_retirement.py`, `test_engine_dates.py`, `test_engine_funding.py`, …) + model validation (`test_models_*.py`) |
| engine integration | [`Testing/integration/`](../../src/cashflow_statement/Testing/integration/) | end-to-end pipeline (`test_engine_pipeline.py`), smoke (`test_smoke.py`), performance (`test_engine_performance.py`), property-goal details (`test_goal_property_details.py`) |
| agent | [`Testing/agent/`](../../src/cashflow_statement/Testing/agent/) | `test_e2e.py`, `test_extractor.py`, `test_levers.py`, `test_state.py`, `test_tools.py` — LLM stubbed |
| boundary | [`Testing/boundary/`](../../src/cashflow_statement/Testing/boundary/) | `test_engine_no_llm.py` (the engine imports with no LLM libs) + `test_public_api_only.py` |

> **Excel parity is not a pytest.** The Excel-baseline comparison lives in the dev eval harness under `AI_Agents/tests/cashflow_statement/` (CSV artifacts in `runs/_current_excel_compare/`), not the `Testing/` suite. The pytest integration layer proves the pipeline runs and reconciles; the eval harness is what you re-run to confirm the numbers still match the spreadsheet.

Run with the mac venv:

```
.venv-mac/bin/python -m pytest AI_Agents/src/cashflow_statement/Testing/
```

- **Run one engine stage in isolation** — the engine is pure functions, so build a `GoalPlanningInput` and call `compute_full_projection` (or a single stage entry from [`engine/`](../../src/cashflow_statement/engine/)) directly; assert on the returned pydantic. No API key, no DB. See `Testing/unit/` for the per-stage patterns and `dev_run.py` for a full sample profile.
- **Run the agent without an API key** — the tests stub the LLM at the chain/tool boundary (`extract_event(..., _chain=<stub>)` is an explicit test hook; tools have pure `*_impl` fns). Assert on state mutations and tool routing, never on model wording.
- **Change engine math** → update the stage file, **bump `ENGINE_VERSION`**, then re-run the end-to-end pipeline tests (`test_engine_pipeline.py`) and re-check the Excel-parity comparison in the dev eval harness (`AI_Agents/tests/cashflow_statement/`) before anything else — parity is the contract. Then bump the Logics thesis [Cashflow_Statement.md](../Logics_reference_docs/Cashflow_Statement.md) if the *approach* changed (per the repo's "Logics docs track the engines" rule).
- **Change narration** → edit the prompt body in [`summarizer.py`](../../src/cashflow_statement/summarizer.py) (or `agent/prompts.py`); the model's wording under guardrails is checked by the chat eval gate (`scripts/run_prompt_eval_gate.sh`), not these unit tests.

<script>
(function () {
  const mdSource = document.getElementById('source-md').textContent;

  marked.use({ gfm: true, breaks: false, headerIds: true, mangle: false });

  const rawHtml = marked.parse(mdSource);
  const content = document.getElementById('content');
  content.innerHTML = rawHtml;

  // Convert ```mermaid code blocks into <div class="mermaid"> for rendering.
  content.querySelectorAll('pre code.language-mermaid').forEach((codeEl) => {
    const div = document.createElement('div');
    div.className = 'mermaid';
    div.textContent = codeEl.textContent;
    codeEl.parentElement.replaceWith(div);
  });

  function slugify(text) {
    return text.toLowerCase().replace(/[^a-z0-9\s-]/g, '').trim().replace(/\s+/g, '-');
  }
  content.querySelectorAll('h2, h3').forEach((h) => { if (!h.id) h.id = slugify(h.textContent); });

  const tocList = document.getElementById('toc-list');
  content.querySelectorAll('h2, h3').forEach((h) => {
    const li = document.createElement('li');
    li.className = 'lvl-' + h.tagName.charAt(1);
    const a = document.createElement('a');
    a.href = '#' + h.id;
    a.textContent = h.textContent;
    li.appendChild(a);
    tocList.appendChild(li);
  });

  mermaid.initialize({
    startOnLoad: false,
    theme: 'default',
    flowchart: { curve: 'basis', htmlLabels: true },
    securityLevel: 'loose',
  });
  mermaid.run({ querySelector: '.mermaid' });

  const headings = Array.from(content.querySelectorAll('h2, h3'));
  const tocLinks = Array.from(tocList.querySelectorAll('a'));
  const linkById = new Map(tocLinks.map(a => [a.getAttribute('href').slice(1), a]));
  function onScroll() {
    const fromTop = window.scrollY + 80;
    let active = headings[0];
    for (const h of headings) { if (h.offsetTop <= fromTop) active = h; else break; }
    tocLinks.forEach(a => a.classList.remove('active'));
    if (active) { const link = linkById.get(active.id); if (link) link.classList.add('active'); }
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();
})();
</script>
