# `practical_asset_allocation` — the ideal plan, re-shaped around what you already own

> **One line:** take the clean *ideal* allocation and translate it into the portfolio the customer can actually hold today — ELSS units frozen under lock-in, near-term goals funded first from held short-term money and the SIP, and the long-term pool split across the same equity styles. Same output shape as the ideal engine, plus one `corpus_breakdown` block that makes the locked holdings visible.
>
> This is the engineer's guide to the module. For the client-facing philosophy (the "translation layer, not a tax optimiser" thesis), see [Logics_reference_docs/Practical_Asset_Allocation.md](../Logics_reference_docs/Practical_Asset_Allocation.md). For where every agent sits in the package, see [Tech_reference_docs/ARCHITECTURE.html](../Tech_reference_docs/ARCHITECTURE.html).

## 1. What it's about

The module lives at [`AI_Agents/src/practical_asset_allocation/`](../../src/practical_asset_allocation/). The engine is, by design, a **single [`pipeline.py`](../../src/practical_asset_allocation/pipeline.py)** — models, orchestrator, and the long-term R157–R222 math all in one file — with the preference model in `human_override.py` and the snap-to-current pass in `allocation_snap.py`.

The *ideal* engine, [`asset_allocation_pydantic`](../../src/asset_allocation_pydantic/pipeline.py), answers *how to invest a fresh rupee*. This module answers the messier question: *how to invest the rupees you already own*, given that

- some are locked in **ELSS** funds under a 3-year SEBI lock-in (can't sell, must count toward the growth target),
- near-term goals are funded **nearest first from held short-term money** (debt and arbitrage funds), then the monthly SIP, and only then from corpus, and
- everything else follows the *same* growth-fund discipline as the ideal plan.

**Direct stocks / PMS are not an input.** The app's holdings snapshot skips direct-equity rows, so stocks never enter the corpus, a target or a trade; they appear only in cashflow projections and display rollups.

It adds one corpus input (`elss_corpus`) plus the customer's resolved preference to the ideal `AllocationInput`, reuses steps 1–2 verbatim, **reimplements step 4** to be holdings-aware, then wraps step 5 to add the frozen ELSS row. The output is **shape-parity** with `GoalAllocationOutput` plus one extras block.

```mermaid
flowchart LR
    IN([PracticalAllocationInput<br/>AllocationInput + elss_corpus]) --> FREEZE["<b>ELSS freeze</b><br/>rebalancing_corpus =<br/>total − elss"]
    FREEZE --> S12["<b>Steps 1–2</b><br/>emergency / short-term<br/>goal waterfall (upstream, verbatim)"]
    S12 --> S4["<b>Step 4 — rewritten</b><br/>ELSS floor · others-gate ·<br/>multi-asset sleeve · v2 slider"]
    S4 --> S5["<b>Step 5 wrapped</b><br/>aggregate + frozen ELSS row"]
    S5 --> REP["<b>Preference report</b><br/>apply_human_override"]
    REP --> SNAP["<b>Snap-to-current</b><br/>allocation_snap"]
    SNAP --> OUT([PracticalAllocationOutput<br/>8 shared fields + corpus_breakdown])
```

The defining design decision: **the ideal portfolio is the destination, not the starting line.** The practical layer only re-shapes the *path* to it — it never picks a fund, never realises gains, and never emits a trade. It decides *targets*; the [Rebalancing](../../src/Rebalancing/pipeline.py) engine (which imports this module) decides *trades*.

---

## 2. Where it sits

This is the **first explicit cross-agent import** under `AI_Agents/src/` (spec §B.1): `pipeline.py` imports models, steps 1, 2 and 5, selected `step4_long_term` helpers, the shared `equity_subgroup_slider`, `tables`, and `utils.round_to_rupee` from `asset_allocation_pydantic`; `human_override.py` imports `CANONICAL_SUBGROUP_ORDER` and `SUBGROUP_TO_ASSET_CLASS`. Those upstream names are a **contract** — a rename there is a cross-module change. `Rebalancing` then imports `run_practical_allocation` from *here* (the next blessed edge).

| Direction | Who | What flows |
|---|---|---|
| **Upstream (import)** | [`asset_allocation_pydantic`](../../src/asset_allocation_pydantic/pipeline.py) | steps 1, 2 and 5, `phase1_bounds`/`phase2_asset_class_pcts`/`phase4_multi_asset`/`phase5_equity_subgroups`, the slider, tables, `round_to_rupee` |
| **Chat gateway** | [`practical_asset_allocation_module_service.py`](../../../app/domains/practical_asset_allocation/services/practical_asset_allocation_module_service.py) | `run(turn, ctx, prior)` for the rebalancing flow → dispatches to the `paa_engine` chat handler, which persists the run |
| **Input builder** | [`paa_engine/input_builder.py`](../../../app/domains/practical_asset_allocation/services/paa_engine/input_builder.py) | reuses asset_allocation's `build_goal_allocation_input_for_user` for the shared fields, then adds `elss_corpus` (overridable via `CorpusPin`), held short-term money, an optional `monthly_sip`, and the resolved preference |
| **Compute** | [`paa_engine/service.py`](../../../app/domains/practical_asset_allocation/services/paa_engine/service.py) | `compute_practical_allocation_result(...)` runs the engine off-thread (`asyncio.to_thread`) — no LLM, no await inside the engine |
| **Downstream (import)** | [`Rebalancing/pipeline.py`](../../src/Rebalancing/pipeline.py) | `run_rebalancing` calls `run_practical_allocation` first; its `aggregated_subgroups` (minus the frozen row) become the per-subgroup rebalance targets |

> **The engine touches no DB.** Corpus scalars, goals, risk score and preferences are all *wired in by the app layer* — caller-supplied data is **not** an import edge. If you're looking for "where does `elss_corpus` come from", it is a `CorpusPin` built from the holdings snapshot, never this module.

### Who runs it in production

| Caller | How its input differs from the default builder | What it reads off the result |
|---|---|---|
| Rebalancing flow, chat (`flow_rebalancing` → `paa_engine/chat.py`) | none | persisted to `practical_asset_allocation_runs`; the reply comes from the rebalancing module |
| `run_rebalancing` — every rebalancing run (chat, Invest page, post-statement auto-refresh, preference save) | `total_corpus` re-pointed at the held MF value; `short_term_holdings` valued from the ledger rows it trades; `elss_corpus` = the held ELSS value | `aggregated_subgroups` → per-fund targets |
| asset_allocation chat (`aa_engine/service.py`) | none | shown in place of the ideal (the ideal is still what `asset_allocation_runs` stores); falls back to the ideal if the practical run fails |
| additional_investment SIP (`ainv_engine/service.py`) | `monthly_sip` = the SIP amount; when the plan's long-term column is under ₹10,000, a second run on a notional ₹1 Cr `CorpusPin` (ELSS 0) supplies the long-term split | `goal_funding.monthly_sip_to_goals` as the goal share, the long-term column for the rest; the real-corpus run is persisted as the deployment's source run |
| additional_investment lumpsum | `CorpusPin(snapshot total + lump sum, snapshot ELSS)`, `short_term_holdings` from the same snapshot, `monthly_sip = 0` so the goals' full remaining need lands on corpus | `goal_funding.from_corpus` as the goal share, long-term rows against current holdings for the deficits; the run is persisted as the deployment's source run |
| Preferences screen GET (`profile/services/screen_preference_service.py`) | `apply_saved_preferences=False` — the neutral run | Prozpr's class recommendation and the sub-group catalog; `carve_outs_at_risk` for the warning |
| Preferences preview / save (`profile/services/preference_save_service.py`) | a one-off `human_override_preferences` override | the preview plan; the latest plan's sub-group shares for resolving relative asks |

### What `ctx` must carry

The input builder reads everything off the turn `ctx` (loaded once per turn):

| Attribute | Type | Used for |
|---|---|---|
| `ctx.user_ctx` | pre-loaded `User` graph (risk assessment, personal-finance profile, goals, portfolios + holdings with fund metadata, saved preference) | every input field: the shared profile / goal / risk fields via the reused asset_allocation builder, held short-term money via `short_term_holdings_for_user`, the saved preference via `load_human_override_for_user`. **`elss_corpus` is not derived here** — it is 0.0 unless a `CorpusPin` supplies it. |
| `ctx.chat_overrides` | `dict` or `None` | per-turn overrides read through `effective_param`: the asset_allocation builder's counterfactual keys (`total_corpus`, `additional_cash_inr`, `emergency_fund_needed`, …) and the one-off `human_override_preferences`, merged field-level over the saved row |
| `ctx.db`, `ctx.effective_user_id`, `ctx.session_id` | `AsyncSession`, ids | persisting the run (chat handler only) — input building issues no query |

No market-commentary block is wired: the builder leaves `AllocationInput.market_commentary` at its defaults (5.0 for every asset class and equity sub-group). In production every asset class therefore starts at the midpoint of its risk band, and the engine never allocates the value and sector sub-groups on its own (phase-5 gate: view ≤ 7) — only a customer pin places them.

---

## 3. Input contract

`PracticalAllocationInput` **extends** `AllocationInput` — every ideal field (age, goals, `effective_risk_score`, `months_to_fy_end`, `monthly_sip`, `short_term_holdings`, `multi_asset_composition`, …) is inherited unchanged. It adds three fields and forbids unknown ones (`extra="forbid"`):

| Field | Type | Notes |
|---|---|---|
| `elss_corpus` | `float ≥ 0` (default 0.0) | ELSS MF holdings (part of `total_corpus`); frozen under 3-year lock-in |
| `human_override` | `HumanOverridePreferences?` (default `None`) | the customer's standing investment preference, already resolved to absolutes app-side. `None` → the preference path is a strict no-op (see §6a) |
| `current_subgroup_allocation` | `dict[str, float]?` (default `None`) | current MF holdings per `asset_subgroup`, in rupees; feeds snap-to-current. `None` → the snap is a strict no-op. **No production caller sets it**, so the snap does not run in the live app |

One implicit corpus quantity is *derived, not an input*:

```
rebalancing_corpus = total_corpus − elss_corpus
```

What the production builder puts in the inherited fields that matter here:

| Inherited field | Production value |
|---|---|
| `total_corpus` | the largest of the profile's financial assets, the investment-profile portfolio value and the primary portfolio's holdings snapshot (direct stocks excluded); callers re-point it (rebalancing: held MF value; lumpsum: snapshot + lump sum) |
| `emergency_fund_needed` | `False` — the builder hardcodes it; only a per-turn `emergency_fund_needed` override turns it on. The default plan carves no emergency reserve |
| `months_to_fy_end` | whole months from today to the current FY-end (31 March) |
| `monthly_sip` | the profile's starting monthly investment, unless the caller passes one (SIP: the SIP amount; lumpsum: 0) |
| `short_term_holdings` | held debt and arbitrage funds except the income-plus-arbitrage FoF, off the preloaded holdings; `None` when no holdings are on file; rebalancing and lumpsum pass their own valuation |
| `goals` | active goals with a future target date; `amount_needed_fv` is the goal's cost on its date |

> Without a `CorpusPin`, `elss_corpus = 0.0`. Two callers pin it, both in `additional_investment`: the lumpsum run (snapshot total + lump sum, snapshot ELSS) and the SIP sizing run (notional ₹1 Cr, ELSS 0). The rebalancing builder sets `elss_corpus` itself, to the held ELSS rows' market value.

---

## 4. Output contract

`PracticalAllocationOutput` carries the **same eight fields** as `GoalAllocationOutput` — `client_summary`, `bucket_allocations`, `aggregated_subgroups`, `future_investments_summary`, `grand_total`, `all_amounts_in_multiples_of_100`, `asset_class_breakdown`, `goal_funding` — so any consumer that already reads the ideal output handles this with **zero change**. It adds two:

| Field | Type | Notes |
|---|---|---|
| `corpus_breakdown` | `CorpusBreakdown` | the practical-only extras (below) |
| `human_override_applied` | `HumanOverrideApplied?` | present only when a preference shaped the run; carries `shortfall_reason` (see §6a) |

`CorpusBreakdown` (all rupee amounts are whole `int`):

| Field | Meaning |
|---|---|
| `total_corpus_inr`, `elss_corpus_inr` | echoes of the inputs |
| `rebalancing_corpus_inr` | `total − elss` (ELSS is frozen out of the trade plan) |

**`goal_funding`** (`GoalFunding`, from step 2) is the one source of the short-term target and the SIP's goal share: `allocated_amount`, `from_corpus`, `shortfall`, `monthly_sip`, `monthly_sip_to_goals`, `asset_subgroup` (`short_debt` or `arbitrage`) and one `GoalFundingRow` per short-term goal (`amount_needed_fv`, `from_holdings`, `from_sip`, `from_corpus`, `shortfall`). It is `None` when a preference suspends step 2.

One more parity subtlety: `aggregated_subgroups` can gain **one extra row** the ideal engine never emits — `tax_efficient_equities` (ELSS in the `long_term` column), appended only when the ELSS amount is `> 0` (so an unpinned run never has it). It also appears in the structured `asset_class_breakdown`, rolled up as **equity**. There is no medium bucket: every row's `medium_term` column is 0.

Amounts are whole rupees; ₹100 rounding happens downstream on final trades, SIP and lumpsum amounts, so `all_amounts_in_multiples_of_100` is normally `false`.

---

## 5. How it thinks

`run_practical_allocation` wraps thin upstream carve-out steps and aggregation around one heavy step, then reports on the preference and snaps to current holdings. **Step 4 (`_run_practical_long_term`, Excel R157–R222) is the whole point of the module.**

| # | Step | Where | What it does |
|---|---|---|---|
| 0 | **ELSS freeze** | [`pipeline.py` `run_practical_allocation`](../../src/practical_asset_allocation/pipeline.py) | `rebalancing_corpus = total_corpus − elss_corpus`; if negative → `InfeasibleGoalError` (edge α). Build a sub-`AllocationInput` with `total_corpus = rebalancing_corpus`. |
| 1–2 | **emergency / short-term** | `step1_emergency` · `step2_short_term` (upstream, verbatim) | run on the *rebalancing* corpus — locked ELSS is never available to fund the near-term buckets. Step 1 carves 3 months of household expense into `short_debt` only when `emergency_fund_needed` (off in production). Step 2 is the goal waterfall for goals under `24 + months_to_fy_end` months (below). There is no medium bucket. |
| 4 | **long-term, rewritten** | [`_run_practical_long_term`](../../src/practical_asset_allocation/pipeline.py) | ELSS floor → practical others-gate → class split → amounts → multi-asset sleeve → phase-5 sub-groups → **v2 average-based equity slider** → debt and gold residuals. See below. |
| 5 | **aggregate + freeze** | [`_step5_aggregation_with_frozen`](../../src/practical_asset_allocation/pipeline.py) | wraps upstream `step5_aggregation.run` (against `total_corpus`, not the rebalancing corpus) and appends the frozen ELSS row so `grand_total` reconciles to the *full* corpus. |
| — | **preference report** | [`apply_human_override`](../../src/practical_asset_allocation/human_override.py) | reshapes nothing; when a preference is set, attaches `human_override_applied` with the shortfall note (§6a). |
| 6 | **snap-to-current** | [`allocation_snap.py`](../../src/practical_asset_allocation/allocation_snap.py) | a subgroup whose move is under `SNAP_THRESHOLD_PCT` (0.5% of the portfolio, env `PAA_ALLOCATION_SNAP_THRESHOLD_PCT`) keeps its current amount; the freed residual lands on the largest un-snapped mover, conserving `grand_total`. The frozen row is never snapped. Rewrites only `aggregated_subgroups`. Strict no-op without `current_subgroup_allocation` — which is every production run. |

### The short-term goal waterfall (step 2)

Goals with `time_to_goal_months < 24 + months_to_fy_end` are short-term; each is valued at its future value (`amount_needed_fv`, falling back to `amount_needed`). Nearest goal first:

1. **Held short-term money** (`short_term_holdings`, capped at the corpus left after step 1) covers what it can.
2. **The monthly SIP**, front-loaded: `monthly_sip_to_goals` is the remaining gap spread over the 6-month review window (`SIP_REVIEW_WINDOW_MONTHS`), raised for any goal due inside that window, rounded up to the rupee and capped at the SIP.
3. **Corpus** only for what the SIP cannot reach by each goal's date. With `short_term_holdings = None` (no holdings on file) the SIP share assumes no corpus can be moved.

The bucket's `allocated_amount` is held money + corpus needed, routed to `arbitrage` when `effective_tax_rate > 20%`, else `short_debt`. Anything the corpus cannot cover becomes a `short_term` `FutureInvestment` with the gap.

### The holdings-aware moves inside step 4

1. **ELSS as a floor, not a fund.** `total_long_term_corpus = remaining + elss` — the locked amount is added back and counted toward the long-term equity budget (R158). `min_equity_elss_pct = elss / total_long_term_corpus` becomes a *floor* on the equity % (R171): even if the risk-driven split wants less equity, ELSS drags it up, and debt / others share what is left pro-rata.
2. **Multi-asset sleeve sized on what can be bought.** The sleeve draws on the post-ELSS equity residual, not the whole equity budget. On the default path its equity slice is capped at `MULTI_ASSET_EQUITY_CAP_PCT` (40%) of that residual; a customer's sleeve pin replaces the cap (§6a). If the sleeve's commodity slice overshoots the commodity budget, the excess splits between debt (by the debt %, up to the remaining debt room) and equity.
3. **v2 average-based equity slider** (shared `apply_equity_subgroup_slider`): the leftover MF equity is split across the same styles as the ideal engine, but a sub-group's share — which decides whether it is dropped — is measured against **`residual_equity_corpus_final + multi_asset_amount`** (Excel R194+R187), not just the MF residual. The drop bar is `max(8 − max(0, elss/equities − 0.20) × 10, min(3, average sub-group %))`, so a large ELSS lock lowers it.

The rest of step 4: the long-term debt residual goes to `arbitrage_plus_income` (falling back to `short_debt` only when the customer excluded it — no tax-rate gate on this path), gold takes the commodity budget minus the sleeve's commodity slice, and long-term goals (at or past the boundary) whose summed `amount_needed` exceeds the corpus entering the long-term step (ELSS excluded) produce a `long_term` `FutureInvestment` for the difference.

## 6a. Customer preferences — the only engine that honours them

A customer's standing preference arrives as `human_override` and is applied **at the phase that decides each facet**, never as a post-hoc reshape.

| Facet | Phase | Behaviour |
|---|---|---|
| Asset-class split | `phase2_asset_class_pcts` | the requested split **IS** the output — the market-view tilt and the phase-1 risk bounds (the others-gate included) are bypassed. The ask is a share of the **overall** portfolio; `_lt_class_targets_from_overall` converts it to the long-term split after subtracting what steps 1–2 committed (the identity when they are suspended) |
| Multi-asset sleeve size | `phase4_multi_asset` via `_sleeve_size` | one `min()` over the equity, debt and (with a preference) commodity rooms plus the ask; an over-large ask is capped at the largest sleeve the class split can fund. Disclosed only when the trim exceeds `SLEEVE_CLAMP_DISCLOSURE_FLOOR_PCT` (0.25% of the portfolio) |
| Sub-group pins / exclusions | `phase5_equity_subgroups` | equity pins are placed as a share of the whole portfolio, exempt from the slider; over-subscribed pins scale proportionally. Gold and debt asks stay class residuals, and the debt residual splits pro-rata across the debt rows the customer named |

<div class="callout danger">
  <div class="title">⚠ Why preferences are inputs, not a final reshape</div>
  <p>Reshaping a finished allocation cannot work: by then the multi-asset sleeve is carved and fixed, so a reshape cannot move debt, and re-applying the ask to the built plan applies it twice — against a migratable basis rather than the class the customer named. Each facet therefore lands at the phase that decides it, and <code>apply_human_override</code> only reports.</p>
</div>

**One basis, end to end (D-A3).** `subgroup_emphasis` maps a sub-group to its share of the **whole portfolio**, never of its class; the engine reads `resolved_targets` verbatim. Market-cap asks arrive on the beta sub-groups (large→low, mid→medium, small→high) — one vocabulary, matching the output table.

**Zero is an exclusion, not a pin.** [`excludes()`](../../src/practical_asset_allocation/human_override.py) is the single definition, read by both the engine's pin extraction and the customer-facing report so the two cannot drift. `FROZEN_SUBGROUPS` is `{tax_efficient_equities}` — ELSS can never be refused; it is a holding the engine cannot trade. Excluding gold zeroes the commodity class and with it the sleeve (the fund holds gold, so "no gold" means no fund), and the freed rupees go to equity; excluding the multi-asset fund sizes the sleeve at 0; excluding `arbitrage_plus_income` re-routes the long-term debt residual to `short_debt` rather than stranding it in a refused fund. The engine never picks plain `arbitrage` for long-term money unasked. The preferences screen refuses a multi-asset pin above 0 when the class mix gives 0% to a class the fund holds, because `_sleeve_size` builds no sleeve without debt.

**Any preference suspends the steps 1–2 carve-outs.** Emergency fund and near-term goals are not carved, and the whole rebalancing corpus goes to the long-term step (`_no_carveout_buckets`); `goal_funding` is `None`, so downstream the whole SIP follows the stated split and a lumpsum fills gaps in it. A goal under the boundary leaves the plan entirely, and the report says so. [`carve_outs_at_risk()`](../../src/practical_asset_allocation/pipeline.py) reads the **profile**, so it answers both moments with one source: the warning the preferences screen shows before the customer commits, and the record attached to the run afterwards. The app builder sets `emergency_fund_needed=False`, so on the screen's path only `near_term_goals` fires.

**`apply_human_override` is the reporting point.** Always invoked, strict no-op when prefs are `None`/empty — that no-op is the golden-test guarantee that a no-preference run stays byte-identical. `HumanOverrideApplied` is deliberately thin (`preference_applied`, `shortfall_reason`): what was asked lives on the saved-preference row and what landed is the run's own breakdown, so the only new information is the shortfall note (scaled pins, a clamped sleeve, a class gap over 2 points, the suspended carve-outs).

**Where preferences come from in production.** `paa_engine/input_builder.py` is the single load point: the saved row rides the preloaded `User.saved_investment_preference` (`load_human_override_for_user`), and a per-turn `human_override_preferences` override merges field-level over it (one-off > saved > none). The one-off reaches the engine only from the preferences screen's preview and save path; chat runs no preference what-if — a preference ask gets the plan plus a pointer to the preferences page.

> **The ideal engine stays preference-free.** `asset_allocation_pydantic` remains Prozpr's own recommendation; only this engine bends. That is what makes "here's what we'd advise, here's your version" a real contrast. `phase2_asset_class_pcts` takes an optional `requested_class_pcts` that only this orchestrator passes.

## 6. Where the LLM is

**Nowhere. This module never calls an LLM.** Every number is produced by deterministic arithmetic over the input — the same input always yields the same output, which is exactly what a *target* allocation feeding a downstream trade engine must guarantee.

| Part | Deterministic? | Why it matters |
|---|---|---|
| ELSS freeze, steps 1–2, step 5 | yes — reused upstream pure-Python | reproducible; unit-testable with no I/O |
| step 4 (floor, sleeve, slider) | yes — pure arithmetic + shared slider | Rebalancing depends on byte-stable targets across reruns |
| customer-facing *narration* | **not here** | the chat brain's shared answer formatter narrates the output; this engine only produces structured numbers |

That reproducibility is load-bearing: `run_rebalancing` recomputes the practical plan inside every rebalancing run and builds its trades from it, while the rebalancing chat flow and additional_investment persist their own run to `practical_asset_allocation_runs` as the record of the plan. A non-deterministic allocation would let the persisted plan disagree with the targets the trades were built from.

## 8. Invariants & landmines

- **Emit plain `int`/`float`, never `Decimal`.** Practical amounts are whole-rupee ints/floats. Downstream Rebalancing rows are `Decimal`; the bridge coerces each lifted subgroup total with `Decimal(str(r.total))` (`Rebalancing/pipeline.py`, `_assign_subgroup_targets`). Pre-wrapping in `Decimal` here breaks that seam. (Per module CLAUDE.md.)
- **Steps 1–2 run on the *rebalancing* corpus; step 5 reconciles on the *total*.** Steps 1–2 see `total_corpus − elss_corpus` and step 4 adds ELSS back as a floor. But `_step5_aggregation_with_frozen` calls upstream `step5_aggregation.run(total_corpus, …)` and appends the frozen row, so `grand_total` matches the *full* corpus (± ₹500 tolerance). Don't "simplify" either denominator — they are deliberately different.
- **ELSS is frozen, never a fresh buy.** `elss_amount_frozen` is counted toward the long-term equity budget (as a floor) and surfaced as `tax_efficient_equities`, but the engine never routes new money into it, and it is *excluded* from the slider's share denominator.
- **The short/long horizon boundary is FY-anchored.** Inherited from `AllocationInput.months_to_fy_end`: step 2, the long-term step and `carve_outs_at_risk` all split goals at `HORIZON_BOUNDARY_MONTHS + months_to_fy_end` (24 + months to 31 March). It defaults to 0 for engine-only callers and the no-preference goldens; the production builder threads the real offset from today.
- **The slider's share denominator is the TOTAL equity pool, not the MF residual.** `residual_equity_corpus_final + multi_asset_amount` (Excel R194+R187). Using just the residual would drop the wrong subgroups. This is the practical engine's key divergence from the ideal slider — the shared helper takes it as `share_denominator` — so with ELSS = 0 the buckets match the ideal engine but the equity sub-group split can differ.
- **Long-term debt routing ignores the tax rate here.** The practical engine sends the long-term debt residual to `arbitrage_plus_income` at any tax rate; the ideal engine sends it to `short_debt` below 15%. Don't assume a low-tax customer's practical debt row matches the ideal one.
- **The 40% sleeve cap is the auto path's alone.** `MULTI_ASSET_EQUITY_CAP_PCT` bounds the sleeve only when the customer named no size; a sleeve pin replaces it and only the class rooms bind.
- **First blessed cross-agent import — upstream names are a contract.** A rename of any imported `asset_allocation_pydantic` symbol (steps, phase helpers, slider, `round_to_rupee`) is a cross-module change requiring a sweep here and in Rebalancing.
- **Persist is best-effort, never blocking** (app layer). `paa_engine/chat.py` swallows a persistence failure so it can't block the reply or the downstream rebalancing step.
- **A preference bypasses the risk bounds — that is intended, not a bug.** With `requested_class_pcts` present, `phase2_asset_class_pcts` returns the customer's split verbatim: the market-view tilt and the phase-1 bounds (others-gate included) do not run. Don't "restore" the clamp; the comply-and-caution contract is to honour the instruction and disclose the deviation, and the preference-free ideal is what carries our own opinion.
- **A preference also suspends steps 1–2.** The emergency and near-term carve-outs genuinely do not run — so any code reading step-1/2 output on a preference run sees the zeroed `_no_carveout_buckets` values. Its `asset_subgroup="short_debt"` is an inert placeholder that surfaces only in the `trace` dict, which no production caller passes.
- **One subgroup doesn't exist upstream.** `tax_efficient_equities` is not in `SUBGROUP_TO_ASSET_CLASS`; `human_override.CLASS_OF` adds it as equity, and `_build_asset_class_breakdown` rolls up through `CLASS_OF`. Don't expect it in the shared table.
- **`goal_funding` is the one source of the short-term target and the SIP's goal share** (`pipeline.py::_build_output`, `goal_funding=s2.goal_funding`). `None` when a preference suspends step 2 — `_no_carveout_buckets` builds its `Step2Output` with no `goal_funding` kwarg, so it defaults to `None`.
- **Snap-to-current is engine capability, not production behaviour.** No app caller sets `current_subgroup_allocation`, so every live run returns the unsnapped plan; only dev harnesses (e.g. the Rebalancing `Master_testing` bridge) exercise it. When it does run, it updates `aggregated_subgroups` only — `asset_class_breakdown` / `bucket_allocations` keep the pre-snap plan.

    codeEl.parentElement.replaceWith(div);
  });

  function slugify(text) {
    return text.toLowerCase().replace(/[^a-z0-9\s-]/g, '').trim().replace(/\s+/g, '-');
  }
  content.querySelectorAll('h2, h3').forEach((h) => { if (!h.id) h.id = slugify(h.textContent); });

  const tocList = document.getElementById('toc-list');
  content.querySelectorAll('h2, h3').forEach((h) => {
    const li = document.createElement('li');
    li.className = 'lvl-' + h.tagName.charAt(1);
    const a = document.createElement('a');
    a.href = '#' + h.id;
    a.textContent = h.textContent;
    li.appendChild(a);
    tocList.appendChild(li);
  });

  mermaid.initialize({
    startOnLoad: false,
    theme: 'default',
    flowchart: { curve: 'basis', htmlLabels: true },
    securityLevel: 'loose',
  });
  mermaid.run({ querySelector: '.mermaid' });

  const headings = Array.from(content.querySelectorAll('h2, h3'));
  const tocLinks = Array.from(tocList.querySelectorAll('a'));
  const linkById = new Map(tocLinks.map(a => [a.getAttribute('href').slice(1), a]));
  function onScroll() {
    const fromTop = window.scrollY + 80;
    let active = headings[0];
    for (const h of headings) { if (h.offsetTop <= fromTop) active = h; else break; }
    tocLinks.forEach(a => a.classList.remove('active'));
    if (active) { const link = linkById.get(active.id); if (link) link.classList.add('active'); }
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();
})();
</script>
</body>
</html>
