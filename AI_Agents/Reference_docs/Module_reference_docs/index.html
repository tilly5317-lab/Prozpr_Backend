# AI_Agents — Module Guides

> **What this folder is:** one engineer-facing guide per agent under [`AI_Agents/src/`](../../src/). Each guide answers the same four questions for its module — what it takes in, what it gives back, how it thinks, and where (if anywhere) the LLM is — pinned to the live code. Start here, then open the module you're actually digging into.
>
> **How it relates to the rest of the docs:** for the *whole-package* walkthrough — how the agents relate, the two blessed cross-module imports, the shared foundation, the landmines — read [../Tech_reference_docs/ARCHITECTURE.html](../Tech_reference_docs/ARCHITECTURE.html). For the *client-facing thesis* behind each engine (philosophy and approach, no proprietary weights) see [../Logics_reference_docs/](../Logics_reference_docs/). This folder sits between the two: more code-level than the Logics docs, more per-module than ARCHITECTURE.

## The two kinds of agents

The single most useful mental model is: is this a **deterministic engine** (pure-Python math — same input, same output, byte for byte; debug with unit tests) or **LLM-driven** (Claude via `langchain-anthropic`; constrained by structured output or prompt rules, but not byte-stable; debug by reading prompts and recent runs)? Several modules are **hybrid** — a deterministic core with an LLM confined to narration — and they sit in both columns.

| Module | Classification | The deterministic part | Where the LLM is |
|---|---|---|---|
| [intent_classifier](intent_classifier.html) | **LLM-driven** | — | one Haiku call labels the turn (structured output) |
| [risk_profiling](risk_profiling.html) | **Hybrid** | the 1–10 `effective_risk_score` (`scoring.py`) | Haiku writes only the summary paragraph |
| [market_commentary](market_commentary.html) | **LLM-driven** | the TTL cache — a written letter is reused verbatim within the window | Haiku extract + generate; Sonnet `chat_qa` |
| [asset_allocation_pydantic](asset_allocation_pydantic.html) | **Deterministic engine** | all seven steps produce the numbers | optional rationale prose at step 7 |
| [practical_asset_allocation](practical_asset_allocation.html) | **Deterministic engine** | the whole holdings-aware allocation | none |
| [Rebalancing](rebalancing.html) | **Deterministic engine** | every trade traces to steps 1–6 | none |
| [additional_investment](additional_investment.html) | **Deterministic engine** | the split + fund selection | none (extraction lives in the app layer) |
| [cashflow_statement](cashflow_statement.html) | **Hybrid** | the 8-stage Excel-parity engine | the LangGraph agent (Sonnet) decides tool calls; Haiku extract + summary |
| [portfolio_query](portfolio_query.html) | **LLM-driven** | rupee figures pre-computed by the app layer | one Haiku call narrates under guardrails |
| [mutual_fund_query](mutual_fund_query.html) | **LLM-driven** | every number pre-built into the facts | two Haiku passes (extract + narrate) |

Why it matters: a deterministic engine that gives a "wrong" answer is a bug in the math — reproducible, fix with a regression test. An LLM-driven agent that gives a "wrong" answer is usually the prompt or the input context — fix by adding to the eval set. The LLM-driven agents are mostly **thin**; the deterministic engines are where the surface area is.

<script>
(function () {
  const mdSource = document.getElementById('source-md').textContent;

  marked.use({ gfm: true, breaks: false, headerIds: true, mangle: false });

  const rawHtml = marked.parse(mdSource);
  const content = document.getElementById('content');
  content.innerHTML = rawHtml;

  // Convert ```mermaid code blocks into <div class="mermaid"> for rendering.
  content.querySelectorAll('pre code.language-mermaid').forEach((codeEl) => {
    const div = document.createElement('div');
    div.className = 'mermaid';
    div.textContent = codeEl.textContent;
    codeEl.parentElement.replaceWith(div);
  });

  function slugify(text) {
    return text.toLowerCase().replace(/[^a-z0-9\s-]/g, '').trim().replace(/\s+/g, '-');
  }
  content.querySelectorAll('h2, h3').forEach((h) => { if (!h.id) h.id = slugify(h.textContent); });

  const tocList = document.getElementById('toc-list');
  content.querySelectorAll('h2, h3').forEach((h) => {
    const li = document.createElement('li');
    li.className = 'lvl-' + h.tagName.charAt(1);
    const a = document.createElement('a');
    a.href = '#' + h.id;
    a.textContent = h.textContent;
    li.appendChild(a);
    tocList.appendChild(li);
  });

  mermaid.initialize({
    startOnLoad: false,
    theme: 'default',
    flowchart: { curve: 'basis', htmlLabels: true },
    securityLevel: 'loose',
  });
  mermaid.run({ querySelector: '.mermaid' });

  const headings = Array.from(content.querySelectorAll('h2, h3'));
  const tocLinks = Array.from(tocList.querySelectorAll('a'));
  const linkById = new Map(tocLinks.map(a => [a.getAttribute('href').slice(1), a]));
  function onScroll() {
    const fromTop = window.scrollY + 80;
    let active = headings[0];
    for (const h of headings) { if (h.offsetTop <= fromTop) active = h; else break; }
    tocLinks.forEach(a => a.classList.remove('active'));
    if (active) { const link = linkById.get(active.id); if (link) link.classList.add('active'); }
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();
})();
</script>
