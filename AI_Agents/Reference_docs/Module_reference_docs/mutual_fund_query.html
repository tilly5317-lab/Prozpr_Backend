# `mutual_fund_query` — grounded answers about one specific fund

> **One line:** when a customer asks about a *named* mutual fund — why we recommend it, what it returned, how it stacks up — this module answers using **only** numbers we can back up from our own stored data, and refuses to invent the rest.
>
> This is the engineer's guide to the module. For the client-facing philosophy (the "no invented numbers" thesis), see [Logics_reference_docs/Mutual_Fund_Query.md](../Logics_reference_docs/Mutual_Fund_Query.md). For where every agent sits in the package, see [Tech_reference_docs/ARCHITECTURE.html](../Tech_reference_docs/ARCHITECTURE.html).

<div class="at-glance">
  <div class="cell"><div class="k">Kind</div><div class="v">LLM-driven<br/>(narrates, never computes)</div></div>

  <div class="cell"><div class="k">Determinism</div><div class="v">numbers pre-computed<br/>wording probabilistic</div></div>
  <div class="cell"><div class="k">Peer imports</div><div class="v">none (peer agent)</div></div>

## 1. What it's about

The module lives at [`AI_Agents/src/mutual_fund_query/`](../../src/mutual_fund_query/). It handles its own **`mutual_fund_query`** chat intent (a sibling of `portfolio_query`) — a question aimed at a *specific fund by name*, e.g.:

- *"Why do you recommend Parag Parikh Flexi Cap?"* → **reasoning**
- *"What has HDFC Balanced Advantage returned?"* → **returns**
- *"How does it compare to other flexi-caps?"* / *"Fund A vs Fund B?"* → **comparison**

It is triggered by the intent classifier's `mutual_fund_query` label and routed by the chat brain's `FLOWS` table into the app-layer gateway `answer_mutual_fund_query` (see §2).

The defining design decision: **the LLM never produces a number.** Every figure it can state is pre-computed by the app layer and handed to it as facts. The model's only job is to *narrate* those facts in Pi's voice under a strict guardrail. A confidently-wrong return figure is treated as a worse failure than an honest "we don't have that history yet".

### The two-pass shape (why it's not one call)

```mermaid
flowchart LR
    Q([Customer question<br/>+ history]) --> EX["<b>Pass 1 · extract</b><br/>Haiku forced-tool<br/>name fund(s) + classify ask"]
    EX --> APP["<b>App layer</b><br/>resolve fund → DB returns<br/>+ ranking + peers"]
    APP --> FACTS[("MutualFundQueryFacts<br/>the ONLY numbers allowed")]
    FACTS --> NA["<b>Pass 2 · narrate</b><br/>Haiku forced-tool<br/>+ persona + guardrails"]
    NA --> R([answer / clarifying_question])
```

The engine ([`orchestrator.py`](../../src/mutual_fund_query/orchestrator.py)) owns passes 1 and 2 only. **Why two passes instead of one?** Because you can't fetch facts for a fund until the model has *named* it — pass 1 turns "the one you recommended" into an actual fund name; only then can the app layer look anything up; only then is there something safe to narrate. And the **middle step is deliberately outside the engine** — the engine is DB-agnostic and only ever sees DTOs, so it can be unit-tested without a database. All DB/CSV reads happen in the app layer.

---

## 2. Where it sits

The engine is a peer agent: it imports no other agent, and only the shared [`common.py`](../../src/common.py) (`read_text_bom_aware`) and [`persona.py`](../../src/persona.py) (`build_system_prompt`). Everything database-shaped is the app layer's job.

| Direction | Who | What flows |
|---|---|---|
| **Upstream** | `intent_classifier` → chat brain `FLOWS` | the `mutual_fund_query` intent routes here |
| **Gateway** | [`app/domains/mutual_funds/services/mutual_fund_query_service.py`](../../../app/domains/mutual_funds/services/mutual_fund_query_service.py) | `answer_mutual_fund_query(question, ctx)` — the ONLY caller of the engine |
| **Fund identity** | `fund_resolver_service.resolve_fund` | customer's words → a real scheme (Direct-Growth by default; a **held** fund resolves to the customer's own plan) |
| **Returns** | `fund_returns_service.trailing_cagr_for_scheme` | 1y/3y/5y CAGR from stored `mf_nav_history`, computed by the shared numeric kernel `financial_primitives.cagr`. **DB-only — never calls mfapi.in inline**, so thin stored history legitimately yields `null` |
| **House view + peers** | `fund_ranking_lookup` (`ranking_by_isin`, `peers_by_sub_category`) | our shortlist rank + `selection_reason`, and like-for-like category peers, from the fund-ranking CSV |

> **The engine touches no DB.** If you are looking for "where does the 3-year return come from", it is **not** in this module — it is `trailing_cagr_for_scheme` in the app layer. The engine only receives the finished number.

### What `ctx` must carry

The gateway signature is `answer_mutual_fund_query(question: str, ctx) -> str`. If you're wiring a new caller or debugging a dead turn, `ctx` (the chat brain's turn context) must provide:

| Attribute | Type | Used for |
|---|---|---|
| `ctx.db` | `AsyncSession` | fund resolution + NAV reads; `None` ⇒ instant generic-failure reply |
| `ctx.conversation_history` | `list[{role, content}]` | pronoun resolution in the extract pass ("the one you recommended") |
| `ctx.user_ctx` | pre-loaded `User` graph (portfolios → holdings → `fund_metadata`) | the held-fund map, so a fund the customer holds resolves to *their* plan |

---

## 3. Input contract

Two entry methods on `MutualFundQueryOrchestrator`, each with its own input.

**`extract(question, conversation_history)`** — pass 1:

| Field | Type | Notes |
|---|---|---|
| `question` | `str` | the customer's latest message |
| `conversation_history` | `list[ConversationTurn]` | prior turns, so pronouns ("it", "the one you recommended") resolve to a real fund name |

**`narrate(facts, question, conversation_history)`** — pass 2. The load-bearing input is `facts: MutualFundQueryFacts` (built by the app layer):

```
MutualFundQueryFacts
├── funds: list[FundFacts]          # the explicitly-named fund(s)
│     ├── fund_name, sub_category
│     ├── returns: FundReturns?     # return_{1y,3y,5y}_cagr_pct — any may be null
│     ├── house_reason: str?        # our selection_reason (only if has_house_view)
│     ├── shortlist_rank: int?      # house rank — NOT a category percentile
│     └── has_house_view: bool
└── peers: list[PeerFund]           # like-for-like category peers (3y CAGR + rank)
                                    # populated ONLY for a single-fund comparison;
                                    # empty when 2+ funds were named
```

All models are in [`models.py`](../../src/mutual_fund_query/models.py). The invariant that makes the guardrail work: **`funds[].returns` fields are the only numbers the narration is permitted to state.** A `null` horizon is a contract signal ("no history"), not a missing value to fill.

---

## 4. Output contract

**Pass 1** returns `ExtractResult`:

| Field | Type | Notes |
|---|---|---|
| `fund_names` | `list[str]` | resolved fund name(s); empty list = none identified |
| `asked_for` | `"reasoning" \| "returns" \| "comparison"` | drives which facts the app layer builds |

**Pass 2** returns `MutualFundQueryResponse`:

| Field | Type | Notes |
|---|---|---|
| `answer` | `str` | the reply, grounded only in the facts |
| `clarifying_question` | `str?` | set instead of answering when the fund is ambiguous/unidentified; else `null` |

The gateway `answer_mutual_fund_query` collapses these into a single customer-facing `str` for the chat brain.

---

## 5. How it thinks

The whole engine is [`orchestrator.py`](../../src/mutual_fund_query/orchestrator.py) — ~180 lines, no pipeline of steps, just two forced-tool calls around an app-built facts pack.

### Pass 1 — `extract`

1. Fill the **Extract User** prompt with the conversation history + question.
2. One Haiku call, forced to call `return_extract_result` (the `_EXTRACT_TOOL` schema). `tool_choice` pins the model to that tool, so the response is always a single structured `tool_use` block — no JSON parsing on our side.
3. Validate into `ExtractResult`. The prompt tells the model to resolve pronouns and, when in doubt between `returns` and `comparison`, prefer `comparison` if it sees "vs / compare / peers" or two fund names.

### (App layer builds the facts — not in this module)

`build_mutual_fund_query_facts` resolves each named fund, pulls trailing CAGR, looks up the house rank/reason, and — for a **single**-fund comparison — appends category peers. Two+ named funds ⇒ the named funds *are* the comparison set, so `peers` stays empty.

### Pass 2 — `narrate`

1. Fill the **Narrate User** prompt with `facts_json` (compact `model_dump(exclude_none=True)`), history, and question.
2. Wrap the **Narrate System** prompt with `build_system_prompt(..., format_profile="chat", question_aware=True)` so Pi's voice + the shared persona rules are prepended to the module's own guardrails.
3. One Haiku call, forced to call `return_mutual_fund_query_response`. Validate into `MutualFundQueryResponse`.

### Prompt plumbing

All four prompt bodies live in **one** markdown file, [`mutual_fund_query.md`](../../src/mutual_fund_query/mutual_fund_query.md), with YAML front-matter (`model`, `extract_max_tokens`, `narrate_max_tokens`). The orchestrator splits it on `---`, then carves four `## ` sections by name:

| Section | Used by | Contains |
|---|---|---|
| `Extract System` | pass 1 system | the routing-helper instructions |
| `Extract User` | pass 1 user | `{{conversation_history}}`, `{{question}}` |
| `Narrate System` | pass 2 system | narration rules **+ the embedded guardrails** |
| `Narrate User` | pass 2 user | `{{facts_json}}`, `{{conversation_history}}`, `{{question}}` |

`{{name}}` double-brace placeholders are filled by `_fill`; single-brace JSON (the tool schemas printed in-prompt) is left untouched. Editing product wording means editing this `.md` — no code change.

### A turn, end to end (worked example)

A customer asks about a fund we recommend. Watch a number *only ever get copied*, never invented.

</div>

<div class="step-panel">
  <div class="label">Pass 1 · extract → ExtractResult</div>
<pre><code>{ "fund_names": ["Parag Parikh Flexi Cap Fund"], "asked_for": "returns" }</code></pre>
</div>

<div class="flow-arrow">↓</div>

<div class="step-panel">
  <div class="label">App layer · build_mutual_fund_query_facts → MutualFundQueryFacts</div>
<pre><code>{
  "funds": [{
    "fund_name": "Parag Parikh Flexi Cap Fund",
    "sub_category": "Flexi Cap Fund",
    "returns": { "return_1y_cagr_pct": 24.6,
                 "return_3y_cagr_pct": 19.1,
                 "return_5y_cagr_pct": 22.3 },
    "house_reason": "Consistent across-cycle performer with a valuation-conscious, benchmark-agnostic mandate.",
    "shortlist_rank": 1,
    "has_house_view": true
  }],
  "peers": []   // empty: asked_for is "returns", not "comparison"
}</code></pre>
</div>

<div class="flow-arrow">↓</div>

<div class="chat">
  <div class="bubble pi"><div class="who">Pi (Pass 2 · narrate)</div>Parag Parikh Flexi Cap is our top-ranked flexi-cap pick. On an annualised (CAGR) basis it's returned about <strong>24.6%</strong> over 1 year, <strong>19.1%</strong> over 3 years, and <strong>22.3%</strong> over 5 years — all from our stored NAV history. We like it for its consistent across-cycle performance and valuation-conscious, benchmark-agnostic mandate.</div>
</div>

Every figure in the reply appears verbatim in the facts. "Top-ranked pick" is `shortlist_rank: 1` framed as a *house view* (not "1 of 24"). The rationale is `house_reason` in spirit. Nothing was computed. *(Values above are illustrative, not real CSV/NAV rows — don't grep for them.)*

### What the customer hears in the edge cases

Not every turn reaches the narrate pass — most clarification is decided earlier, in the **app-layer gateway** (`answer_mutual_fund_query`), before facts are ever built:

| Situation | Decided in | What the customer hears |
|---|---|---|
| No fund identified | gateway (after extract) | *"Which fund would you like to know about?"* |
| Ambiguous name (Regular vs Direct, two candidates) | gateway `Ambiguous` branch | *"Just to be sure — did you mean X or Y?"* |
| Fund not in our data | gateway (nothing resolves) | *"I couldn't find that fund in our data — could you double-check the name?"* |
| A return horizon is `null` | **narrate pass** (guardrail) | *"…we don't have a 5-year track record for this fund yet"* — never an estimate |
| Fund is off our shortlist (`has_house_view: false`) | **narrate pass** | returns if we have them, plus *"it isn't one we actively recommend"* — no invented rationale |
| Any LLM/DB failure | gateway `try/except` | a generic *"try again in a moment"* — never a stack trace |

So the engine's own `clarifying_question` is really the *last* rung — the gateway's canned replies handle the common ambiguity cases before narration runs.

---

## 6. Where the LLM is

**Both passes are LLM calls, both Haiku, both forced-tool-use** — but neither does arithmetic.

| Pass | Model | Determinism |
|---|---|---|
| extract | `claude-haiku-4-5` | probabilistic routing — which fund, which ask-type |
| narrate | `claude-haiku-4-5` | probabilistic *wording* over deterministic *numbers* |

The LLM client is [`llm_client.py`](../../src/mutual_fund_query/llm_client.py) — a thin `ChatAnthropic` (LangChain) wrapper. It binds exactly one tool with `tool_choice={"type": "tool", "name": ...}`, marks the system prompt with `cache_control: ephemeral` (Anthropic prompt caching), and returns `(tool_input, usage)`. `MODEL_MAP` resolves the `"haiku"` alias to the pinned model id.

<div class="callout danger">
  <div class="title">⚠ The failure mode this module designs against</div>
  <p>Haiku will happily <strong>invent</strong> a plausible-looking return or category rank if given the chance. The defence isn't a smarter prompt — it's that <strong>there is nothing to compute</strong>. Every number is pre-built into the facts (§3); the guardrail (§8) forbids stating any figure that isn't there. The model's only job is to copy. Widen the facts and you widen what it can say — so only add fields you can source.</p>
</div>

## 8. Invariants & landmines

- **The engine must never state a number that isn't in `facts`.** This is enforced by prompt, not code — the guardrail block in `mutual_fund_query.md`'s *Narrate System*. If you widen `MutualFundQueryFacts`, keep it to values you can source; a field the model *can* see, it *will* state.
- **`shortlist_rank` is a house view, not a percentile.** Never let wording drift into "ranks 3 of 24". The guardrail forbids it; a prompt edit that loosens this is a correctness bug, not a style change.
- **`null` return = "no history", never an estimate.** Thin `mf_nav_history` legitimately yields `null` 5y CAGR. The narration says so plainly. (See the memory note on NAV-coverage gaps — many recommended funds have thin stored history.)
- **`has_house_view == false` ⇒ don't invent a rationale.** For funds off our shortlist, give returns if we have them, state plainly it isn't one we recommend, and stop.
- **Peers only for a single named fund.** 2+ named funds ⇒ `peers` empty and the named funds are the comparison set. Don't repopulate `peers` in that branch.
- **Held funds resolve to the customer's own plan**, not the default Direct-Growth, so a "return" matches what they actually hold.
- **Prompt file is BOM-aware and split on `---`.** It contains `₹`/em-dashes and inline JSON tool schemas. `read_text_bom_aware` + the single-brace-safe `_fill` exist for this reason — don't switch to a naive `str.format` (it would choke on the JSON braces).
- **Failure is soft.** The gateway catches errors (incl. `AnthropicAuthenticationError`) and returns a generic "try again in a moment" reply — a fund lookup problem never surfaces a stack trace to the customer.

## 9. Extend & test

- **Change wording / guardrails** → edit [`mutual_fund_query.md`](../../src/mutual_fund_query/mutual_fund_query.md) only, then run the prompt eval gate (`scripts/run_prompt_eval_gate.sh`) before merging — the golden cases include mutual-fund-query turns. Because the Logics thesis grounds customer answers, bump [Logics_reference_docs/Mutual_Fund_Query.md](../Logics_reference_docs/Mutual_Fund_Query.md) when the *approach* changes (per the repo's "Logics docs track the engines" rule).
- **Add a fact the narration may state** → add the field to `MutualFundQueryFacts`/`FundFacts` in [`models.py`](../../src/mutual_fund_query/models.py), populate it in `build_mutual_fund_query_facts`, and describe it in the Narrate System "What the facts contain" list so the model knows it exists.
- **Tests** live at three levels:

  | Level | Where | Covers |
  |---|---|---|
  | engine plumbing | [`Testing/test_orchestrator.py`](../../src/mutual_fund_query/Testing/test_orchestrator.py), `test_models.py` | prompt assembly + DTO parsing, LLM stubbed |
  | facts builder | `app/domains/mutual_funds/tests/test_build_mutual_fund_query_facts.py` | house-view vs off-shortlist, peers-only-for-single-fund |
  | gateway e2e | `app/domains/mutual_funds/tests/test_mutual_fund_query_gateway.py` | the clarify ladder + failure branches |

  Run with the mac venv: `.venv-mac/bin/python -m pytest AI_Agents/src/mutual_fund_query/Testing/ app/domains/mutual_funds/tests/`. What none of these cover — the model's actual *wording* under the guardrail — lives in the chat eval gate, not unit tests.
- **Run the engine without an API key** — the pattern the module's own tests use: inject a stub at the LLM-client boundary. `call_structured` is the entire seam:

  ```python
  class StubLLM:
      async def call_structured(self, model, system, user, *, tool, max_tokens=1024):
          return {"answer": "..."}, {}          # any canned tool payload

  orch = MutualFundQueryOrchestrator(StubLLM())
  resp = await orch.narrate(my_handmade_facts, "why this fund?", [])
  ```

  Hand-build a `MutualFundQueryFacts` and you can reproduce any narration quirk — prompt text included — with no database and no Anthropic call.

<script>
(function () {
  const mdSource = document.getElementById('source-md').textContent;

  marked.use({ gfm: true, breaks: false, headerIds: true, mangle: false });

  const rawHtml = marked.parse(mdSource);
  const content = document.getElementById('content');
  content.innerHTML = rawHtml;

  // Convert ```mermaid code blocks into <div class="mermaid"> for rendering.
  content.querySelectorAll('pre code.language-mermaid').forEach((codeEl) => {
    const div = document.createElement('div');
    div.className = 'mermaid';
    div.textContent = codeEl.textContent;
    codeEl.parentElement.replaceWith(div);
  });

  function slugify(text) {
    return text.toLowerCase().replace(/[^a-z0-9\s-]/g, '').trim().replace(/\s+/g, '-');
  }
  content.querySelectorAll('h2, h3').forEach((h) => { if (!h.id) h.id = slugify(h.textContent); });

  const tocList = document.getElementById('toc-list');
  content.querySelectorAll('h2, h3').forEach((h) => {
    const li = document.createElement('li');
    li.className = 'lvl-' + h.tagName.charAt(1);
    const a = document.createElement('a');
    a.href = '#' + h.id;
    a.textContent = h.textContent;
    li.appendChild(a);
    tocList.appendChild(li);
  });

  mermaid.initialize({
    startOnLoad: false,
    theme: 'default',
    flowchart: { curve: 'basis', htmlLabels: true },
    securityLevel: 'loose',
  });
  mermaid.run({ querySelector: '.mermaid' });

  const headings = Array.from(content.querySelectorAll('h2, h3'));
  const tocLinks = Array.from(tocList.querySelectorAll('a'));
  const linkById = new Map(tocLinks.map(a => [a.getAttribute('href').slice(1), a]));
  function onScroll() {
    const fromTop = window.scrollY + 80;
    let active = headings[0];
    for (const h of headings) { if (h.offsetTop <= fromTop) active = h; else break; }
    tocLinks.forEach(a => a.classList.remove('active'));
    if (active) { const link = linkById.get(active.id); if (link) link.classList.add('active'); }
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();
})();
</script>
