## 6. The data-flow web

These dependencies aren't Python imports — they're **shape contracts** that the app layer (each feature's domain service) wires up. They matter because changing a field on one side breaks the caller silently.

```mermaid
flowchart LR
    RP_out["risk_profiling output<br/>{effective_risk_score, osi, savings_rate_adjustment}"]
    MC_out["market_commentary output<br/>{MacroSnapshot + markdown file}"]
    FHV_file["fund_house_commentry.md<br/>(hand-maintained)"]
    AA_in["AllocationInput / PracticalAllocationInput"]
    PA_out["PracticalAllocationOutput<br/>(aggregated_subgroups + goal_funding)"]
    RB_in["RebalancingComputeRequest"]
    AINV_in["AdditionalInvestmentInput"]
    PQ_in["portfolio_query facts<br/>(fund-house view slice)"]
    PREF["saved_investment_preferences row<br/>(app-side, resolved)"]

    RP_out -->|"caller fills fields"| AA_in
    PREF -->|"caller resolves → human_override"| AA_in
    MC_out -.->|"score block NOT wired — engine defaults used"| AA_in
    FHV_file -.->|"Prozpr-only slice, only when tools_needed says so"| PQ_in
    AA_in -->|"runs"| PA_out
    PA_out -->|"per-subgroup targets split across top 1-2 rows"| RB_in
    PA_out -->|"practical rows + goal_funding<br/>+ holdings snapshot + ranking"| AINV_in
```

The six things to internalise:

1. **`AllocationInput` is the join point — but only the risk half is actually wired.** It carries fields from both `risk_profiling` and `market_commentary`, and neither of those agents imports allocation; the calling domain service does the joining. That joining is one-sided: `app/domains/asset_allocation/services/aa_engine/input_builder.py` fills the risk fields (`effective_risk_score`, `osi`, `savings_rate_adjustment`, `gap_exceeds_3`, read off the persisted `effective_risk_assessments` row), but **no production code in `app/` ever sets `market_commentary`** — the symbol `MarketCommentaryScores` appears under `app/` only in a test. The field falls through to its `default_factory`, so every production allocation runs on the neutral house view in `asset_allocation_pydantic/tables.py` (`DEFAULT_MARKET_COMMENTARY_SCORES`, all 5.0). The engine consumes those scores for real (`steps/step4_long_term.py` phase-2 asset-class percentages and the subgroup/others gates) — it just always sees neutral. Wiring a live view is a caller-side capability nobody has connected. Note also that the agent's own output model is `MacroSnapshot` (macro indicators + `document_md`) — it emits **no** 1–10 score block at all, so a `MarketCommentaryScores` would have to be *derived* from the snapshot by a caller that does not exist.
2. **Market context reaches answers through files, not imports.** `market_commentary` writes `market_commentary_latest.md`, and its own fast path serves that file back as the document `flow_market` hands `general_chat`. The hand-maintained `fund_house_commentry.md` reaches `portfolio_query` (and the rebalancing chat) only as the Prozpr-only slice from `house_view.py`, and only when `tools_needed` asks for `fund_house_view` (§5.1, §5.8); otherwise the facts carry a placeholder. If you change either file's structure, you change a contract — and `house_view.py` fails closed on a `##` section it does not recognise.
3. **`Rebalancing` builds on `practical_asset_allocation`'s output.** It calls `run_practical_allocation` first, then lifts subgroup targets onto the ranked rows — held funds in the rank band reserve their holdings, the residual splits across the top 1-2 (§5.6).
4. **`additional_investment` consumes PAA output too — but caller-wired, not imported.** For lumpsum, the app layer runs PAA pinned at *holdings + deploy amount* (`CorpusPin`, `monthly_sip = 0`) and hands the engine both the practical rows and the current per-subgroup values (goal-used short-term money removed); the same subgroup vocabulary must hold on both sides or deficits silently misalign. For both cadences the goal share comes off that run's `goal_funding` (§5.9).
5. **The customer's preference is caller-wired too, and it has exactly one load point.** `PracticalAllocationInput.human_override` is filled by `app/domains/practical_asset_allocation/services/paa_engine/input_builder.py` off the preloaded `User.saved_investment_preference` relationship — engines never touch the DB. A contract test (`test_contract_single_computation_reader`) keeps that the one computation-time reader; a second would make historical runs unreproducible. Note the interaction with point 1: when a class preference is present, `phase2_asset_class_pcts` takes the requested split verbatim, so the neutral market scores are bypassed rather than merely neutral.
6. **`monthly_sip` / `short_term_holdings` — the goal waterfall's inputs (§5.4) — are threaded per caller, not by the engine.** The base builder (`aa_engine/input_builder.py::build_goal_allocation_input_for_user`, shared by the ideal path and, underneath, the practical one) sets `monthly_sip` from the profile's `starting_monthly_investment` and always passes `short_term_holdings=0.0`. The practical builder (`paa_engine/input_builder.py::build_practical_allocation_input_for_user`) then defaults `short_term_holdings` to the preloaded user's own holdings unless a caller overrides it: Rebalancing passes the value computed off the ledger rows it is about to rebalance; `additional_investment`'s lumpsum passes a freshly queried holdings snapshot and `monthly_sip = 0`, and its SIP overrides only `monthly_sip`, with the live deploy amount. `short_term_holdings=None` (nothing on file) lets the SIP plan assume the whole near-term gap is still open.

## 7. Conventions

- **`models.py` is the boundary — plus a short, named list of published exceptions.** Top-level pydantic schemas live in `models.py`, and the app layer imports from there and from the documented entry points (`pipeline.py`, `main.py`, `orchestrator.py`, `classifier.py`, and each package's `__init__.py`). It *does* reach past the boundary in these named places, and all of them are part of the published surface — grep `app/` before renaming any of these symbols:
  - `cashflow_statement.engine` → `compute_full_projection` (`goal_planning_engine/service.py`, `cashflow_compute_service.py`) and `ENGINE_VERSION` (`cashflow/routers/cashflow_router.py`); `cashflow_statement` (package root) → `custom_goal_fv` and `Assumptions` (`asset_allocation/services/aa_engine/input_builder.py`, converting each goal to the FY-inflated `amount_needed_fv` that step 2's waterfall reads, §5.4; `map_custom_goal` for the conversion is itself reused from `cashflow/services/goal_planning_engine/input_builder.py`). All are re-exported from `cashflow_statement/__init__.py`.
  - `asset_allocation_pydantic.tables` → `DEFAULT_MULTI_ASSET_COMPOSITION_PCTS` (`rebalancing/services/asset_class_breakdown.py`, `profile/services/screen_preference_service.py`); `asset_allocation_pydantic.equity_subgroup_slider` → `apply_equity_subgroup_slider` and `asset_allocation_pydantic.steps.step4_long_term` → `phase5_equity_subgroups` (`screen_preference_service.py` — the one production module that reaches into `steps/`).
  - `practical_asset_allocation.human_override` → `HumanOverridePreferences`, `CLASS_OF`, `FROZEN_SUBGROUPS`, `SETTABLE_SUBGROUPS` (the PAA input builder, the preferences screen and save services, the additional-investment input builder, the rebalancing chat); `practical_asset_allocation.pipeline` → `DEBT_DEFAULT_ORDER`, `carve_outs_at_risk` (`screen_preference_service.py`).
  - `Rebalancing.config` → `ST_THRESHOLD_MONTHS_EQUITY` / `_DEBT` (`rebal_engine/tax_aging.py`), `OTHERS_FUND_CAP_PCT` and the `AINV_*_FUND_CAP_FLOOR_INR` floors (`ainv_engine/input_builder.py`); `Rebalancing.tables` → `cap_pct_for` (`ainv_engine/input_builder.py`); `Rebalancing.consolidation` → `ConsolidationConstraints`, `constraints_active`, `reshape_response` (`rebal_engine/chat.py`).
  - `risk_profiling.scoring` → `OSI_MAP` (`profile/services/_effective_risk/calculation.py`); `risk_profiling.willingness` → `compute_risk_willingness` (`profile/services/_effective_risk/inputs.py`).
  - `intent_classifier.prompts` → `OUT_OF_SCOPE_MESSAGE`, `STOCK_ADVICE_MESSAGE` (`intent_classifier_engine.py`, `general_chat_engine.py`).
  - `mutual_fund_query.llm_client` → `LLMClient`; `portfolio_query.models` → `_DEFAULT_REDIRECT` (the two Q&A bridges).
  Separately, `financial_primitives` is a library, not an agent — the app layer imports `xirr`, `twr_wealth_index`, `cagr` and `months_to_fy_end` from it directly by design (see §4) — and the shared modules `common.py`, `persona.py`, `reasoned_reply.py`, `token_stream.py` and `house_view.py` are importable by the app layer too.
- **One entry point per agent.** `pipeline.py` for engine modules, `main.py` for LCEL-chain modules, `orchestrator.py` for class-based orchestrators. If you find yourself adding a second entry point, you're probably building a second agent.
- **Cross-module imports are forbidden by default.** The only blessed exceptions, listed in [AI_Agents/src/CLAUDE.md](../../src/CLAUDE.md), are:
  - `practical_asset_allocation` → `asset_allocation_pydantic` (steps 1, 2 and 5, selected `step4_long_term` helpers, the slider, `tables`, `utils`, models).
  - `Rebalancing` → `practical_asset_allocation` (`run_practical_allocation` + its I/O models, and `human_override.FROZEN_SUBGROUPS`).
  - `additional_investment` → `Rebalancing.config.funds_per_subgroup` — one function, so the 1-vs-2 fund-count rule has a single source; no peer logic.
- **Shared data flows through the caller, not through imports.** If two agents need to share data, the calling domain service wires it up. Period.
- **Agents produce facts and prompts; the shared answer formatter writes every customer-facing reply.** `app/domains/ai_engine/answer_formatter` makes the one Haiku call that turns a module's facts pack and body prompt into the reply (with the last 12 history rows, `FORMATTER_HISTORY_ROWS`). An agent under `src/` may make its own LLM calls for INTERNAL steps — classify, extract, research — but does not compose the chat answer; that is why `portfolio_query` and `mutual_fund_query` cannot answer standalone.
- **Shared src-level modules are exactly five:** `common.py` (INR formatting, risk categories, BOM-aware reads), `persona.py` (the PI voice — `build_system_prompt`), `reasoned_reply.py` (thinking-first forced-tool-use replies), `token_stream.py` (answer-token deltas — §4.1), `house_view.py` (the fund-house view slicer). Any agent may import these; keep them small, don't grow dumping grounds, and don't add a sixth without a design discussion. The bar each one cleared: an agent under `src/` needed it (or may need it), so it could not live in `app/`.
- **No LLM call may sample.** Pass `temperature=0` explicitly at every `ChatAnthropic(...)` site — see §3. A test scans for this and fails the build.
- **The customer never sees an internal section name.** The prompt sections the formatter assembles — `MODULE`, `ACTION_MODE`, `CUSTOMER_RECORD`, `PROFILE`, `RECENT_HISTORY`, `LOGIC_REFERENCE` — and the field names inside them are how *we* organise inputs; they mean nothing to a customer. The house rule stated in every answer prompt: when you can't answer, name the missing thing in the customer's own terms ("I can't see the returns on each individual fund yet"), never the plumbing ("that isn't in my CUSTOMER_RECORD", "the information provided to me"). The Python identifier for the `CUSTOMER_RECORD` payload is `facts_pack` — the two names refer to the same thing.
- **`Reference_docs/` top level is runtime data, not source.** `market_commentary_latest.md` / `.json` are rewritten on each commentary run — don't commit fresh outputs from a local run. The exception is `fund_house_commentry.md`, which is hand-maintained monthly and never machine-overwritten; the live fund-ranking CSV sits there too. Hand-authored docs live in the subfolders: `Tech_reference_docs/` (this doc), `Logics_reference_docs/` (client-safe thesis docs), `Module_reference_docs/` and `Business_reference_docs/`.
- **LangChain only for LLM calls.** All Claude calls go through `langchain-anthropic` (`ChatAnthropic` / LCEL). The only acceptable raw `anthropic` import is exception classes for `except` clauses. No `anthropic.Anthropic().messages.create(...)`.
- **All rupee numbers reaching an LLM are pre-formatted.** `format_inr_indian` produces the `_indian` sibling string. The prompt copies it verbatim. The LLM does not do arithmetic on rupees.
- **`sys.path` injection, not qualified imports.** Once the app layer has called `ensure_ai_agents_path()`, agents are imported as `from Rebalancing.models import ...`, not `from AI_Agents.src.Rebalancing.models import ...`. If you see the qualified form, it's a bug.

## 8. Landmines

1. **Trust the intent enum.** There are **nine** intents, plus the `OutOfScopeSubreason` sub-enum and the separate `Tool` enum behind `tools_needed`. The enum in [models.py](../../src/intent_classifier/models.py) is the only source of truth; a doc or comment naming another count is stale.

2. **The `Reference_docs/` market files are contracts.** `market_commentary_latest.md` is the agent's document cache and becomes the market answer's context verbatim; `fund_house_commentry.md` feeds three chat paths through `house_view.py`, which fails closed on an unrecognised `##` section. If you regenerate the commentary during testing, do not commit the result. If you change either file's structure, read `market_commentary/main.py` (`run_from_cache`) and `house_view.py` first.

3. **`asset_allocation_pydantic` step-4 phases are not numbered 1–7.** They're `phase1_bounds`, `phase2_asset_class_pcts`, `phase4_multi_asset`, `phase5_equity_subgroups` — there is no phase3. All four are lifted by `practical_asset_allocation` (and `phase5_equity_subgroups` by the app's preferences screen), so they're cross-module symbols (landmine 8). Don't renumber.

4. **`practical_asset_allocation/pipeline.py` is one file on purpose.** Don't split it "for tidiness" — the R157–R222 math is easier to follow contiguously. The file runs to ~1,500 lines, well past the ~500-line mark at which the design call was to *revisit* the question: the revisit is owed, so if you have a real reason to split, make the case rather than assuming the answer is still no.

5. **`Rebalancing` has no stock rows, and ELSS is a scalar.** Direct stocks are not an engine input at all, and ELSS exposure travels as `practical_allocation_input.elss_corpus`. If you're trying to add a row for either, you're misreading the input contract — re-read [Rebalancing/CLAUDE.md](../../src/Rebalancing/CLAUDE.md).

6. **`cashflow_statement/engine/_types.py` is private.** It's not re-exported from `__init__.py`. If you need a type at the boundary, it goes in [models.py](../../src/cashflow_statement/models.py).

7. **`financial_primitives/` serves two packages.** `cashflow_statement/engine/` plus six app-layer services (`portfolio/benchmark_service.py`, `portfolio/twr_service.py`, `mutual_funds/xirr_service.py`, `mutual_funds/fund_returns_service.py`, `mutual_funds/fund_screener_service.py`, `asset_allocation/aa_engine/input_builder.py`). Don't add abstractions for *hypothetical* consumers — but the kernel is not private to one agent. Grep the whole repo (not just `AI_Agents/`) before changing a signature: `xirr` and `cagr` each have two production callers.

8. **The blessed cross-module imports are by symbol name, not by package.** `practical_asset_allocation` imports `step1_emergency.run`, `phase1_bounds`, `round_to_rupee`, etc. by name; `Rebalancing` imports `FROZEN_SUBGROUPS`; `additional_investment` imports `funds_per_subgroup`. **Renaming any of those symbols on the upstream side is a cross-module change.** Grep before renaming.

9. **`risk_profiling` returns a `dict`, not a pydantic model.** This is intentional — the app layer indexes into it as JSON. Don't "fix" it into a pydantic output; you'll break the persistence layer.

10. **`market_commentary`'s indicators come from a web-search extraction, and it degrades silently.** If live retrieval fails wholesale, the pipeline serves the *cached* snapshot and tags `data_gaps` with `ALL_LIVE_DATA_FAILED`. If commentary numbers look off or stale, check `data_gaps` on the snapshot first.

11. **The cashflow agent's model is set in `graph.py`, not `nodes.py`.** `build_graph()` defaults to Sonnet (`claude-sonnet-4-6`) and `get_compiled_graph()` never overrides it — `nodes.py`'s `AGENT_MODEL_DEFAULT` (Haiku) is dead wiring. Change the model in `build_graph()`'s signature or you'll change nothing.

12. **Streamed deltas are not the answer.** `run_turn`'s return value is authoritative — the formatter throws away a truncated or failed response in favour of the module's deterministic fallback, and `portfolio_query`'s guardrail backstop swaps a streamed `answer` for the redirect line. Any client that paints deltas must replace them on `done`. Don't "optimise" that away.

13. **The token-stream sink is in process memory, so chat is single-worker.** Same constraint as `app.core.progress`. The Dockerfile runs one uvicorn worker; adding `--workers` silently breaks streaming (and progress) for every request that doesn't happen to land on the right process. Moving the sink out of process is the prerequisite, not a follow-up.

14. **`temperature` omitted means 1.0, not 0.** The most expensive one-line mistake in this codebase — it produced different rupee figures for the same customer on consecutive calls. Landmine, not preference: see §3.

15. **`ActionMode` is a closed `Literal` — and has no recompute mode.** A re-run is `compute` with `is_rerun: true` in the facts pack. The modes are `compute`, `narrate`, `educate`, `counterfactual_explore`, `consolidate`, `screen`, `fund_detail`, `category_probe`, `gather`, `redirect` and `pointer` (`answer_formatter/formatter.py`). A module that needs a new mode adds it to the `Literal`; an undeclared string is caught by the type checker (Pyright), not at runtime, so run it.

16. **The goal-ideal ships on the first answer only.** `rebal_engine/service.py` gates it behind `include_ideal`, which `chat.py` sets to `action_mode == "compute"`. Follow-up turns therefore contrast against the *recommended practical plan*, never the goal-ideal — a follow-up that re-quoted the ideal read as the plan having changed when nothing had. A preference-shaped plan is disclosed separately, by `preference_view.active_preferences_block`, whose `applied` / `shortfall_reason` come from the **run** (`human_override_applied`) rather than the saved row, so the claim always describes the plan actually in front of the customer; an output with no such field — AA's preference-free ideal fallback — yields `None` rather than a claim.

<script>
(function () {
  const mdSource = document.getElementById('source-md').textContent;

  marked.use({ gfm: true, breaks: false, headerIds: true, mangle: false });

  const rawHtml = marked.parse(mdSource);
  const content = document.getElementById('content');
  content.innerHTML = rawHtml;

  // Convert ```mermaid code blocks into <div class="mermaid"> for rendering.
  content.querySelectorAll('pre code.language-mermaid').forEach((codeEl) => {
    const div = document.createElement('div');
    div.className = 'mermaid';
    div.textContent = codeEl.textContent;
    codeEl.parentElement.replaceWith(div);
  });

  function slugify(text) {
    return text.toLowerCase().replace(/[^a-z0-9\s-]/g, '').trim().replace(/\s+/g, '-');
  }
  content.querySelectorAll('h2, h3').forEach((h) => { if (!h.id) h.id = slugify(h.textContent); });

  const tocList = document.getElementById('toc-list');
  content.querySelectorAll('h2, h3').forEach((h) => {
    const li = document.createElement('li');
    li.className = 'lvl-' + h.tagName.charAt(1);
    const a = document.createElement('a');
    a.href = '#' + h.id;
    a.textContent = h.textContent;
    li.appendChild(a);
    tocList.appendChild(li);
  });

  mermaid.initialize({
    startOnLoad: false,
    theme: 'default',
    flowchart: { curve: 'basis', htmlLabels: true },
    securityLevel: 'loose',
  });
  mermaid.run({ querySelector: '.mermaid' });

  const headings = Array.from(content.querySelectorAll('h2, h3'));
  const tocLinks = Array.from(tocList.querySelectorAll('a'));
  const linkById = new Map(tocLinks.map(a => [a.getAttribute('href').slice(1), a]));
  function onScroll() {
    const fromTop = window.scrollY + 80;
    let active = headings[0];
    for (const h of headings) { if (h.offsetTop <= fromTop) active = h; else break; }
    tocLinks.forEach(a => a.classList.remove('active'));
    if (active) { const link = linkById.get(active.id); if (link) link.classList.add('active'); }
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();
})();
</script>
