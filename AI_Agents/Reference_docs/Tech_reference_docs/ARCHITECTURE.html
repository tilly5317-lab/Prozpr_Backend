# AI_Agents — Architecture Walkthrough

> A narrative handoff doc for the `AI_Agents/` package itself: how each agent thinks, what it takes in, what it gives back, and how they relate. File paths are pinned so you can jump to the code; the prose carries the *why*. If a diagram contradicts the code, trust the code — and tell me, so I can fix the diagram. *(Last reconciled with the code: 2026-10-03.)*
>
> This doc is the **inside-the-package** view: what actually runs inside each agent. How chat requests reach the agents (HTTP → `ChatBrain` → the owning domain's module service) is covered by the `CLAUDE.md` layer under `app/` — start at `app/domains/ai_engine/CLAUDE.md`. This doc picks up after a domain service has called into `AI_Agents/src/`.

---

## How to read this

You're a Python engineer trying to understand why a recommendation came out the way it did, or to extend an agent without breaking the others. You don't need to memorise every file. You **do** need to understand:

1. There are two very different kinds of agents — **deterministic engines** (pure-Python math) and **LLM-driven** (Claude + structured output). They have different debuggability and different testing expectations.
2. Agents are **peers by default** — they don't import each other. Three blessed exceptions are documented (the allocation chain, plus one shared rebalancing constant).
3. The agents that look most like AI are usually the simplest. The agents that look like plain pipelines are usually where the product logic lives.

Skim section 2 (the map), read section 3 (the two kinds), and use section 5 (per-agent walkthrough) as a reference when you're actually digging into one.

---

## 1. Why this doc exists

A lot of this code was written with Claude in the loop. That's productive, but it has a failure mode: things get more abstract than they need to be, with multi-step pipelines that look intimidating until you realise each step is doing one small thing. After a few months even the person who built it can stare at `step4_long_term.py` and not remember which phase does what.

This doc is the antidote. For each agent it answers four questions:

- **What does it take in?** (the input contract)
- **What does it give back?** (the output contract)
- **How does it think?** (the step-by-step shape of the work)
- **Where is the LLM, if anywhere?** (so you know which parts are deterministic and reproducible vs. probabilistic)

If you ever sit down to "just quickly understand X", start with that agent's row in section 5.

## 3. The two kinds of agents

Sorting the agents by how they actually work is the single most useful mental model:

| Kind | Agents | What it means |
|---|---|---|
| **Deterministic engine** | `asset_allocation_pydantic`, `practical_asset_allocation`, `Rebalancing`, `additional_investment`, `cashflow_statement/engine`, `risk_profiling` (scoring half), `financial_primitives` | Pure Python. Same input → same output, byte for byte. Excel-parity for the cashflow engine. These are where the *product math* lives. Debug them with unit tests. Reading the code answers "why this number" definitively. |
| **LLM-driven** | `intent_classifier`, `market_commentary` (extraction, doc-gen, and the `chat_qa` Q&A), `mutual_fund_query` (its extract pass), `portfolio_query` (owns the skill prompt and guardrails, but makes no LLM call itself — the shared answer formatter in `app/` does), `cashflow_statement/agent` (LangGraph — **not on the production path**; exercised only by its own tests and `scripts/probe_cashflow_statement.py`. The production goal-planning turn calls the engine directly via `compute_full_projection` and does its LLM work in the app layer: a Haiku action detector in `goal_planning_engine/chat.py` plus the shared answer-formatter), `risk_profiling` (summary half) | Claude via `langchain-anthropic` is the load-bearing piece — Haiku for most calls, Sonnet for the cashflow agent node and market-commentary Q&A. Outputs are constrained by structured-output schemas or prompt-encoded house rules, but they're not byte-stable. Debug them by reading the prompt sources (`prompts.py`, or the skill `.md` files for the Q&A surfaces) and looking at recent runs. |

**Every LLM call site pins `temperature=0`.** Omitting it applies the Anthropic API default of **1.0**, and sampling does visible damage: measured, "when do I reach ₹10 crore?" answered FY2034/₹10.44cr and FY2035/₹11.85cr on consecutive calls with identical data, and 4 of 101 labelled turns changed intent between identical classifier runs. `app/domains/ai_engine/tests/test_temperature_is_pinned.py` scans every `ChatAnthropic(...)` call under `app/` and `AI_Agents/src/` and fails on any that omits it. The one indirection is the answer formatter, which passes its kwargs as a dict and reads `AILAX_FORMATTER_TEMPERATURE` — the env var is an escape hatch, but its **default is `"0"`**, and a second test pins that default. If you add an LLM call site, pass `temperature` explicitly as a literal or the scan will fail.

This split matters because the failure modes are different:

- **A deterministic engine gives a "wrong" answer** → it's a bug in the math or in the input shape. The fix is reproducible. Write a regression test.
- **An LLM-driven agent gives a "wrong" answer** → it's usually the prompt, the input context, or a structured-output schema that lets a bad value through. The fix is harder to make reproducible. Add a case to an eval suite — the tracked LLM suites in `AI_Agents/tests/` (built on `_eval_harness.py`), or the dev-only `chat_eval/` replay set.

The LLM-driven agents are mostly **thin** — `intent_classifier` is one classification call, `portfolio_query` is a skill prompt plus a facts pack that the shared formatter's one call consumes. The deterministic engines are where the surface area is.

## 4. Shared foundation

These pieces aren't agents — they're support: one numeric library and five shared modules.

### `financial_primitives/` — the numeric kernel

Pure-function library, no LLM, no I/O, fully unit-tested. It's the only thing that should be doing TVM math anywhere in `AI_Agents/`. The public API is flat — `from financial_primitives import xirr`.

| File | What's in it |
|---|---|
| [time_value.py](../../src/financial_primitives/time_value.py) | `future_value`, `present_value`, `compound` (monthly compounding) |
| [annuity.py](../../src/financial_primitives/annuity.py) | `pmt` / `rate` / `ipmt` via `numpy_financial` |
| [inflation.py](../../src/financial_primitives/inflation.py) | `inflate`, `real_rate` (real-vs-nominal) |
| [dates.py](../../src/financial_primitives/dates.py) | Indian FY helpers (`fy_for_date`, `fy_end_after`, `months_to_fy_end`), `eomonth`, `year_fraction` |
| [retirement.py](../../src/financial_primitives/retirement.py) | Retirement corpus closed-form |
| [xirr.py](../../src/financial_primitives/xirr.py) | XIRR (365-day year convention) |
| [twr.py](../../src/financial_primitives/twr.py) | Time-weighted return |
| [returns.py](../../src/financial_primitives/returns.py) | `cagr` — point-to-point growth as an annual % (fund track records) |

Consumers today: `cashflow_statement/engine/` (inflation, retirement, dates, annuity) plus six app-layer services — `app/domains/portfolio/services/benchmark_service.py` and `app/domains/mutual_funds/services/xirr_service.py` (both on `xirr`), `app/domains/portfolio/services/twr_service.py` (`twr_wealth_index`), `app/domains/mutual_funds/services/fund_returns_service.py` and `fund_screener_service.py` (both on `cagr`), and `app/domains/asset_allocation/services/aa_engine/input_builder.py` (`months_to_fy_end`, the FY anchor of the horizon boundary, §5.4). The `ROUND_THOUSAND` convention lives in `cashflow_statement/engine/dates.py`, not here. **Don't engineer it for hypothetical consumers** — extend only when a real caller appears — but grep every consumer before changing a kernel signature.

### `common.py` — cross-agent utilities

Four things in it:

| Symbol | What it does |
|---|---|
| `read_text_bom_aware(path)` | Read a runtime text artifact whatever encoding it was written in: sniffs a UTF-16 LE/BE or UTF-8 BOM, decodes as UTF-8 otherwise. The runtime files these agents read — the market-commentary cache, the fund-house view, `portfolio_query`'s `portfolio_query.md` skill and `guardrails.md`, `mutual_fund_query.md` — may be produced by PowerShell on Windows (UTF-16 LE + BOM), and bare `Path.read_text()` both blows up on byte 0xff and falls back to the OS locale (cp1252). **Never read one of those files without this.** Callers: `portfolio_query/orchestrator.py`, `portfolio_query/skill_executor.py`, `mutual_fund_query/orchestrator.py`, `market_commentary/main.py`, `market_commentary/chat_qa.py`, `house_view.py`. |
| `format_inr_indian(amount)` | Rupee → Indian notation (`123456` → `"₹1.23 lakh"`, `22600000` → `"₹2.26 crore"`). Used wherever an LLM-driven agent is about to see a rupee number, so the model **copies** the formatted string rather than reinventing the lakh/crore conversion (Haiku gets this wrong if you let it — frequently drops an order of magnitude). |
| `RISK_CATEGORIES` | Tuple of the five canonical risk-category names: `Conservative`, `Moderately Conservative`, `Moderate`, `Moderately Aggressive`, `Aggressive`. The app layer re-imports it; no parallel copy to keep in sync. |
| `category_for_effective_risk_score(score)` | Maps a 1.0–10.0 `effective_risk_score` to one of those five categories using band midpoints (`2.125 / 4.375 / 6.625 / 8.875`). |

Rule: every rupee number that touches an LLM prompt has a sibling `_indian` string. The formatter does that conversion deterministically; the prompt then tells the LLM "use the `_indian` form verbatim".

The app layer re-imports the three risk/money helpers via [`app/domains/ai_engine/common.py`](../../../app/domains/ai_engine/common.py) so there's exactly one source of truth. `read_text_bom_aware` is not re-exported there — it has no app-layer caller today; agents under `src/` import it directly with `from common import read_text_bom_aware`.

### `persona.py`, `reasoned_reply.py`, `token_stream.py`, `house_view.py` — shared LLM and context plumbing

Four more src-level shared modules (same rule as `common.py` — keep them small):

- [`persona.py`](../../src/persona.py) — the single source of truth for Ask PI's customer-facing voice. Any surface building a free-text prompt calls `build_system_prompt(...)`. Imported by `market_commentary`, `risk_profiling`, and the cashflow summarizer; the app layer's shared answer formatter imports it directly (after `ensure_ai_agents_path()`).
- [`reasoned_reply.py`](../../src/reasoned_reply.py) — the forced-tool-use reply schema for free-text surfaces: the *thinking* field is declared FIRST (load-bearing — the model reasons before it drafts), then discarded; it is never shown to the customer. Used by `market_commentary`'s document generator and `chat_qa`. The answer formatter reads its own answer-only tool with `extract_reasoned_reply` but declares no thinking field.
- [`token_stream.py`](../../src/token_stream.py) — the answer-token stream for one chat turn, re-exported to the app layer by `app/domains/ai_engine/streaming.py`. See §4.1.
- [`house_view.py`](../../src/house_view.py) — the structure-aware slicer for the hand-maintained `Reference_docs/fund_house_commentry.md` (§5.3). `load_house_view(prozpr_only=True)` emits only `Prozpr view:` paragraphs under their section/question headers — an allow-list, so no fund house can leak into advice; `prozpr_only=False` returns the whole multi-house file. Fail-closed: a missing or empty file, or one with a `##` section outside Equities / Bonds / Commodities, returns `None`. Imported by `portfolio_query` and, in the app layer, by the market-side fund-house view module and the rebalancing chat.

### 4.1 `token_stream.py` — how an answer streams

Every customer-facing answer surface produces its text through a **forced tool call**, so the reply arrives as partial JSON inside a tool argument, not as plain text. This module turns that into incremental deltas.

It lives under `src/` rather than `app/` for the same reason `persona.py` does: **agents must not import the app layer**, so anything an agent might need sits here. Canonical definition here, re-exported there. Its one call site today is the shared answer formatter in `app/`.

| Piece | What it does |
|---|---|
| `TokenStream` | Async-iterable sink of answer-text deltas for one turn. The queue is **unbounded on purpose** — bounding it would drop deltas from the middle of an answer and silently corrupt the rendered text; the producer is capped by the call site's `max_tokens` anyway. |
| `open_token_stream()` | Async context manager that installs a stream for the current context and always closes it on the way out, so a consumer can never hang on a turn that already died. |
| `current_token_stream()` | Reads the active stream, or `None`. |
| `astream_tool_answer(llm, messages, answer_field=…)` | Runs `llm.astream` over a forced-tool call, parsing the half-built tool-call JSON each chunk and publishing the growth in `answer_field`. Returns the accumulated message, which duck-types what `ainvoke` returns — callers keep reading `.tool_calls` and `.response_metadata` unchanged. |
| `FINE_GRAINED_TOOL_STREAMING` | The Anthropic beta flag that makes any of this worth doing (see below). |

Four things that are load-bearing:

1. **Nothing streams unless a stream is open.** With no open stream the call site uses `ainvoke`, so the blocking endpoint is byte-for-byte unaffected. The beta flag is likewise set *only* while streaming.
2. **The beta is required, not an optimisation.** By default the API buffers a tool call's input JSON server-side and flushes it near the end of the response, which makes token streaming nearly pointless — measured on a ~4,500-char answer, the first 10% of text arrived 11.55s into a 15.86s call. With the beta the same answer delivered 10% by 2.71s of 11.94s. The trade-off it buys: input JSON is not validated before it is sent, so a malformed tool call is possible — the formatter degrades safely to the module's deterministic fallback, so the cost is a lost formatter run, not a broken reply.
3. **Identity travels in a `ContextVar`, not an argument.** The answer-producing call site sits five-plus frames below the request handler and takes no `TurnContext`. `asyncio.create_task` copies the context, so a turn spawned inside `open_token_stream` inherits the sink.
4. **Deltas are PROVISIONAL — whatever `run_turn` returns wins.** The formatter discards a truncated or failed response in favour of the module's deterministic fallback, and `portfolio_query`'s guardrail backstop replaces a streamed `answer` with the redirect line when the guardrail fires (§5.8). A client that has painted deltas must replace them with the final content.

**Single-instance only**, the same trade-off as `app.core.progress`: the sink lives in process memory, so the streaming request and the turn must share a worker. The Dockerfile runs one uvicorn worker — do not add `--workers` without moving the sink out of process.

The one producing call site is `answer_formatter/formatter.py` (`_invoke_llm`), which streams the `answer` field of its forced tool. Every surface whose reply the formatter writes — every engine module, `general_chat`'s compose pass, `portfolio_query`, `mutual_fund_query`'s fund-detail answer — streams through it; the formatter's extra non-prose tool fields (e.g. `portfolio_query`'s `redirect_message`) never stream. Token and cost accounting reads `usage_metadata` through a LangChain callback (`app/domains/ai_engine/usage_tracking.py`), which the streaming path populates like the blocking one.

## 5. Per-agent walkthrough

Each subsection gives you the same four answers: input → output, how it thinks, where the LLM is. Skim the column you need.

### 5.1 `intent_classifier/` — what is the user asking?

- **In:** `ClassificationInput` (question + conversation history + optional active intent).
- **Out:** `ClassificationResult` (one of 9 intents, confidence, `is_follow_up`, reasoning, optional `out_of_scope_message` / `out_of_scope_subreason`, and `tools_needed`).
- **How it thinks:** [classifier.py](../../src/intent_classifier/classifier.py) builds an LCEL chain over Claude Haiku with structured output. The system prompt in [prompts.py](../../src/intent_classifier/prompts.py) enumerates the intents and gives examples; reasoning is capped at ~12 words so it can't eat the token budget. The chain returns a parsed `ClassificationResult`. That's it — one model call.
- **LLM:** Claude Haiku, structured output, `temperature=0`, Anthropic prompt caching on the system prompt. `max_tokens` stays at 1024 as pure headroom — hitting the cap truncates the tool call and raises rather than degrading.
- **The nine intents** are the enum in [models.py](../../src/intent_classifier/models.py): `asset_allocation`, `goal_planning`, `stock_advice`, `portfolio_query`, `general_market_query`, `rebalancing`, `additional_investment`, `mutual_fund_query`, `out_of_scope`. **The enum is the source of truth.** If a doc says any other count, trust the enum.
- **Out-of-scope has sub-reasons.** `OutOfScopeSubreason` (same `models.py`): `gibberish`, `identity_or_meta`, `security_or_credentials`, `chat_summary`, `off_topic`, `other`. The app layer picks a different canned/tailored reply per sub-reason. **`out_of_scope` is not a fallback** — the prompt requires a positive reason (a domain we don't handle, non-financial chatter, adversarial input). Merely short, vague or ambiguous is explicitly *not* sufficient; those resolve from `active_intent` or history instead.
- **`tools_needed` — a second, independent verdict.** `Tool` (same `models.py`) is a small enum: `market_commentary` (current factual market DATA) and `fund_house_view` (Prozpr's stance plus the major fund houses' outlooks). It answers "what extra data does the ANSWER stage need?", and **it does not affect the intent**. The brain copies it onto `TurnContext.tools_needed` and handlers fetch only what is listed; empty means the customer's own record is enough. Two implementation notes that bite: the guidance for this field lives in the pydantic `Field(description=…)` and **not** in `prompts.py`, because the same text in the system prompt primes the market intent and misroutes benchmark questions; and a new `Tool` member also needs `_ToolLiteral` in `classifier.py`, which a drift test enforces. Consumers: `flow_market` (the market-query flow) reads both tools — factual data when `market_commentary` is listed or neither tool is, the whole multi-house view when `fund_house_view` is; `portfolio_query` (§5.8) and the rebalancing chat read only `fund_house_view`, and get the Prozpr-only slice.
- **Why no imports of other agents:** the classifier returns a label, nothing else. Routing — what to actually do with `asset_allocation` — happens outside `src/`, in `app/domains/ai_engine`'s FLOWS table.
- **What it does NOT decide: `action_mode`.** A natural but wrong assumption. `ClassificationResult` has no mode field. Routing and mode are separate LLM decisions in separate places — the mode is chosen *inside* each module after routing, by that module's own detector.

### 5.2 `risk_profiling/` — how much risk can this client take?

- **In:** `RiskProfileInput` (age, income, assets, debt, occupation, stated risk willingness, etc.).
- **Out:** a `dict` with `step_name`, `inputs`, `calculations`, `output`. The `output` block carries `effective_risk_score` and the `risk_summary` paragraph. The shape is intentionally open — the app layer indexes into it and persists `calculations`/`output` as JSON.
- **How it thinks:** [scoring.py](../../src/risk_profiling/scoring.py) is pure Python. Risk *capacity* is anchored on age (clamped to [20, 90], then interpolated between the anchors 20→10 … 90→1), nudged by half the net-asset score's distance from 5 (expense coverage, current debt, property owned), then clamped to [1, 10]. The final score is `0.7 × risk_willingness + 0.3 × risk_capacity` — **stated willingness carries the larger weight, and it arrives as an already-computed input**, not something `scoring.py` derives (see the willingness note below). The OSI and the savings-rate adjustment are computed alongside and written into `calculations` for downstream consumers (the allocation input builder reads both), but neither enters the score. Then [main.py](../../src/risk_profiling/main.py) appends a Haiku-generated summary paragraph via an LCEL chain.
- **LLM:** Haiku, but only for the prose summary. **The score itself is fully deterministic.** If a customer disputes their score, reading `scoring.py` answers the question. The LLM is doing PR, not arithmetic.
- **Downstream:** the `effective_risk_score` is one of the fields `asset_allocation_pydantic`'s `AllocationInput` expects. The caller (bridge) wires it across — `risk_profiling` does not import allocation, nor vice versa.

> **Where `risk_willingness` comes from: [`willingness.py`](../../src/risk_profiling/willingness.py).** This module exports `compute_risk_willingness` — the canonical scorer for the **4-question customer risk-willingness questionnaire** (Q1 investment preference, Q2 investment experience, Q3 investment focus, Q4 drop reaction → 1–10 float via `min(mean(Q1,Q3,Q4), lift, Q2_cap)`, where `lift = min(Q1,Q3,Q4) + 2` when that minimum is below 5, else 10). Unanswered or unrecognised answers drop out of the mean/min/lift; a missing Q2 drops the cap.
>
> `scoring.py` consumes `risk_willingness` as an *already-computed* float on `RiskProfileInput`. The app layer computes it in [`derive_risk_willingness`](../../../app/domains/profile/services/_effective_risk/inputs.py): an explicitly stored `RiskProfile.risk_willingness` (a rarely set manual override) wins; otherwise it calls `compute_risk_willingness` with the onboarding `risk_level` (Q1) and the three behavioural answers stored on the risk profile; only when nothing is answerable does it fall back to [`risk_willingness_from_risk_level`](../../../app/domains/profile/services/_effective_risk/calculation.py), then to 5.0.
>
> **Do not** reinvent the Q1–Q4 mapping in the app layer or the frontend — the bands, the lift rule, and the experience cap are product decisions encoded here. The Q2–Q4 reference tables match the frontend's option sentences byte for byte; a reworded option scores as unanswered, not as an error.

### 5.3 `market_commentary/` — what does the macro picture look like right now?

- **In:** none. The agent goes and gets the data itself.
- **Out:** `MacroSnapshot` (14 indicators + `data_gaps` + `document_md`). Also persisted to disk:
  - [Reference_docs/market_commentary_latest.json](../market_commentary_latest.json)
  - [Reference_docs/market_commentary_latest.md](../market_commentary_latest.md)
- **How it thinks:** [main.py](../../src/market_commentary/main.py) drives a two-pass flow. Pass 1 — `run_websearch_extraction` (`main.py`) — a Claude call with Anthropic **web search** enabled gathers current values and extracts them into a structured `MacroSnapshot` (no HTML scraping; `_archive/` holds an unused scraper). Pass 2 — `generate_document` in [document_generator.py](../../src/market_commentary/document_generator.py) — turns the snapshot into the markdown commentary via forced tool-use (`reasoned_reply`).
- **Caching:** the JSON snapshot is a TTL cache (`MARKET_COMMENTARY_CACHE_MAX_AGE_SEC`, read by the app layer, default 86,400s); the `.md` is regenerated only when missing or older than the JSON — the document is a deterministic function of the snapshot (`run_from_cache`). If live data fails entirely, the pipeline falls back to the cached snapshot and tags `data_gaps` with `ALL_LIVE_DATA_FAILED`.
- **LLM:** Haiku for extract + generate. There is also a third surface: [chat_qa.py](../../src/market_commentary/chat_qa.py) — a **Sonnet** Q&A sub-agent that answers customer questions over the commentary (forced tool-use via `reasoned_reply`). **It is dormant in production:** nothing under `app/` calls it (the app imports the `market_commentary` package, whose `__init__.py` re-exports `answer_question`, but no code path invokes it). The market-query chat flow ([flow.py](../../../app/domains/ai_engine/services/flow.py) `flow_market`) takes the commentary document from the agent (`app/domains/market_commentary/services/market_commentary_engine.py`: the `run_from_cache` fast path, else a full `run`, under a 120s timeout) and hands it to `general_chat`, which runs its own Haiku research pass (web search allowed) and then lets the shared answer formatter write the reply. `chat_qa` is exercised only by `chat_eval/` and its own test — treat it as a staged surface, not a live one.
- **The persistence is the contract.** [Reference_docs/market_commentary_latest.md](../market_commentary_latest.md) is the agent's own document cache: `run_from_cache` returns it verbatim whenever it is at least as fresh as the JSON, so its content is exactly what `flow_market` feeds `general_chat` (and what `chat_qa` reads). No other agent reads it — `portfolio_query` takes no factual market data. **If you change the file's shape, you change every market answer.**
- **A second, hand-maintained file — the fund-house view.** [Reference_docs/fund_house_commentry.md](../fund_house_commentry.md) holds Prozpr's monthly qualitative stance plus the outlooks of major fund houses (ICICI, HDFC, PPFAS, …). Unlike the factual `.md` it is **not** machine-generated — a human updates it monthly. It is read only through `house_view.py` (§4), and only when the classifier's `tools_needed` asks for `fund_house_view`. `flow_market` loads the **whole** multi-house file (via `app/domains/market_commentary/services/fund_house_view_module_service.py`), and its answer may **surface the named houses as research sources** (Prozpr still leads and advises). The advice paths — `portfolio_query` and the rebalancing chat — load the **Prozpr-only** slice, which names no house. A missing or invalid file yields no view, and each path degrades to answering without it.

### 5.4 `asset_allocation_pydantic/` — the goal-based allocation engine

This is the most important deterministic engine. Sit with this one.

- **In:** `AllocationInput` — client profile, goals (each with horizon + target corpus), `effective_risk_score`, OSI, savings-rate adjustment, `emergency_fund_needed`, `months_to_fy_end` (the FY anchor, below), a `market_commentary` score block, `total_corpus` (total investable), and `monthly_sip` / `short_term_holdings` for step 2's goal-funding waterfall (below). The **risk** fields are wired in by the caller; the `market_commentary` block is **not wired by anyone** and falls through to the neutral defaults — see §6, point 1. Liabilities are not an allocation input (risk scoring and the cashflow engine still use them), and neither are direct stocks: the production builder (`pick_total_corpus`) values the portfolio from its holdings with direct equity skipped.
- **Out:** `GoalAllocationOutput` — eight fields: `client_summary`, `bucket_allocations` (emergency, short-term, long-term, each carrying fixed template `rationale` / `goal_rationales` prose), `aggregated_subgroups`, `future_investments_summary`, `grand_total`, `all_amounts_in_multiples_of_100` (a legacy flag, almost always `False` because amounts are whole rupees), `asset_class_breakdown` (per-asset-class splits), `goal_funding` (the short-term waterfall's result, below). `aggregated_subgroups` rows are **asset-subgroup** names — `short_debt`, `arbitrage`, `arbitrage_plus_income`, `multi_asset`, `low_beta_equities`, `medium_beta_equities`, `high_beta_equities`, `value_equities`, `sector_equities`, `us_equities`, `gold_commodities` (canonical order in [step5_aggregation.py](../../src/asset_allocation_pydantic/steps/step5_aggregation.py)) — **not fund recommendations**. The output commits only to asset class and subgroup: no fund names or ISINs appear, and [Testing/test_no_fund_mapping.py](../../src/asset_allocation_pydantic/Testing/test_no_fund_mapping.py) (gitignored, dev machines only) guards it by rejecting `fund_mapping`/`recommended_fund`/`isin`/`sub_category` keys anywhere in the payload and pinning each subgroup row to exactly its six keys. Fund selection happens downstream in `Rebalancing` / `additional_investment` (see the fund-ranking CSV).

- **How it thinks:** six steps in [steps/](../../src/asset_allocation_pydantic/steps/), orchestrated by [pipeline.py](../../src/asset_allocation_pydantic/pipeline.py). The files keep their numbers and there is no step 3: the horizon has two buckets, short-term and long-term.

  | Step | File | What it does |
  |---|---|---|
  | 1 | [step1_emergency.py](../../src/asset_allocation_pydantic/steps/step1_emergency.py) | Carve out the emergency fund first (3 months of household expense, into `short_debt`) when `emergency_fund_needed` is set. Everything below it works on what's left. **The production input builder passes `emergency_fund_needed=False`** (no profile column backs it), so the default plan carves no emergency reserve; only an asset-allocation chat what-if switches it on. |
  | 2 | [step2_short_term.py](../../src/asset_allocation_pydantic/steps/step2_short_term.py) | Fund goals below the FY-anchored short/long boundary through the goal waterfall (below), into `arbitrage` when the tax rate is above 20%, else `short_debt`. |
  | 4 | [step4_long_term.py](../../src/asset_allocation_pydantic/steps/step4_long_term.py) | The heaviest step. Multi-phase: `phase1_bounds` (risk-score → asset-class bounds), `phase2_asset_class_pcts` (the class split, tilted by the market view), `phase4_multi_asset` (multi-asset fund sleeve), `phase5_equity_subgroups` (the beta / value / sector / US equity subgroups, with the drop threshold from the slider in [equity_subgroup_slider.py](../../src/asset_allocation_pydantic/equity_subgroup_slider.py)). |
  | 5 | [step5_aggregation.py](../../src/asset_allocation_pydantic/steps/step5_aggregation.py) | Combine the per-bucket results into aggregated subgroup rows. |
  | 6 | [step6_guardrails.py](../../src/asset_allocation_pydantic/steps/step6_guardrails.py) | **Checks only — adjusts nothing.** Validates step 4/5 against the guardrails (subgroup sum vs `total_allocated`; asset-class pcts inside the Phase-1 risk bounds; equity-subgroup shares of `multi_asset.equity_for_subgroups` inside the Phase-5 bounds, within `PHASE5_SHARE_TOLERANCE_PP`; no unmapped subgroup) and returns the violation list. `adjustments_made` is always empty, and `Step6Output` is not passed to step 7 nor carried on `GoalAllocationOutput` — it survives only in the state dict from `run_allocation_with_state`, where the app logs `all_rules_pass` and a violation count. A breach is recorded, never clamped. |
  | 7 | [step7_presentation.py](../../src/asset_allocation_pydantic/steps/step7_presentation.py) | Assemble the final `GoalAllocationOutput` and attach the fixed template "why" text per bucket and per goal. |

- **The short/long horizon boundary is FY-anchored.** A goal is short-term below `HORIZON_BOUNDARY_MONTHS + months_to_fy_end` (24 + the months to the current financial-year end) and long-term at or above it ([step2_short_term.py](../../src/asset_allocation_pydantic/steps/step2_short_term.py), [step4_long_term.py](../../src/asset_allocation_pydantic/steps/step4_long_term.py)) — the 24-month line is pushed out to the current financial-year end. `AllocationInput.months_to_fy_end` defaults to 0, so the engine tests and no-preference goldens see the flat line; the production [`aa_engine/input_builder.py`](../../../app/domains/asset_allocation/services/aa_engine/input_builder.py) threads the real offset from today (`financial_primitives.months_to_fy_end`).
- **Step 2 funds short-term goals nearest-first through a waterfall, not a flat corpus carve** (`goal_waterfall` in [step2_short_term.py](../../src/asset_allocation_pydantic/steps/step2_short_term.py)). Sorted by `time_to_goal_months`, each goal draws first on held short-term money (`short_term_holdings` — every debt/arbitrage fund except income-plus-arbitrage, `SHORT_TERM_HOLDING_SUBGROUPS` in `app/domains/mutual_funds/services/scheme_classification.py`), then the stated monthly SIP (`monthly_sip`) FRONT-LOADED — the whole SIP goes to the nearest uncovered goal until it's covered, then the next, never split proportionally, at a rate held constant within a `SIP_REVIEW_WINDOW_MONTHS` (6-month) review window — and only then corpus, for whatever the SIP can't reach by the goal's date. A goal values at its inflated future cost when the caller supplies one (`Goal.amount_needed_fv`, sourced from the cashflow engine's `custom_goal_fv` via `map_custom_goal` — §6, §7); the un-inflated `amount_needed` is the fallback. `short_term_holdings=None` (nothing on file) means the SIP's goal share assumes no corpus can be moved. The result lands on `GoalAllocationOutput.goal_funding` (a `GoalFunding`: `allocated_amount`, `from_corpus`, `shortfall`, `monthly_sip`, `monthly_sip_to_goals`, `asset_subgroup`, and a per-goal `GoalFundingRow` breakdown of `from_holdings` / `from_sip` / `from_corpus` / `shortfall`) — `None` whenever a customer preference suspends step 2's carve-outs entirely (§5.5). The ideal engine runs the same waterfall; its production builder passes `short_term_holdings=0.0`. `goal_funding` is also the one source `additional_investment` reads for a SIP or lumpsum's near-term-goal share (§5.9).
- **LLM:** none. Step 7's per-bucket and per-goal prose is fixed templates — chat displays the *practical* allocation, which carries no such text. [`test_no_rationale_llm.py`](../../../app/domains/asset_allocation/services/tests/test_no_rationale_llm.py) fails on any `langchain_anthropic` / `ChatAnthropic` reference in this package (outside `Testing/` and `Master_testing/`).
- **Whole rupees, not ₹100.** Every amount is rounded to the rupee, and each split pushes its rounding remainder onto its largest part, so the allocated total equals `int(total_corpus)` exactly and the multi-asset sleeve's three slices add back to the sleeve ([`AI_Agents/tests/test_rounding_at_final_step.py`](../../tests/test_rounding_at_final_step.py)). ₹100 rounding happens only where money moves — Rebalancing's `rounding_step` on trades (§5.6) and `additional_investment`'s `rounding_multiple_inr` on buys (§5.9).
- **Static lookups:** [tables.py](../../src/asset_allocation_pydantic/tables.py) holds the Phase-1 risk→asset-class bounds and Phase-5 equity-subgroup bounds, the subgroup→asset-class roll-up, emergency-fund months (3 for every customer; the separate portfolio-income key is also 3), the horizon boundary (`HORIZON_BOUNDARY_MONTHS = 24`) and SIP review window, the multi-asset equity cap (`MULTI_ASSET_EQUITY_CAP_PCT = 0.40` — the multi-asset sleeve's equity slice may use at most 40% of long-term equity), and the default market-commentary scores and multi-asset composition (65/25/10) used when the caller supplies no view. **No fund mappings** — specific fund/ISIN picks come from the fund-ranking CSV read by the app layer for `Rebalancing` and `additional_investment`; allocation only commits to asset class and subgroup. If a recommended subgroup looks wrong, it's almost always a table issue, not a step issue.
- **Why pydantic everywhere:** each step has its own `StepNOutput` schema. Step N+1 takes Step N's output as input. This means you can run a single step in isolation in a notebook with the right `StepNOutput` JSON, which is essential for reproducing customer-reported quirks.

### 5.5 `practical_asset_allocation/` — holdings-aware version of the above

This is the first cross-agent import in the package, the only one that mutates the allocation math, and **the only engine that honours a customer's standing investment preferences**.

- **In:** `PracticalAllocationInput` — `AllocationInput` plus one corpus scalar (`elss_corpus`), an optional `human_override` carrying the customer's resolved preference, and an optional `current_subgroup_allocation` for the snap-to-current step (below). The model forbids unknown fields, so no other corpus — direct stocks included — can ride in.
- **Out:** `PracticalAllocationOutput` — shape-parity with `GoalAllocationOutput` plus a `corpus_breakdown` block and an optional `human_override_applied` report. Consumers that handle `GoalAllocationOutput` handle this with zero change for the shared eight fields — `goal_funding` included: it is `None` whenever a preference suspends step 2 (`_no_carveout_buckets` builds no `goal_funding`, so it defaults to `None`), and otherwise is the one source of the short-term target and the SIP/lumpsum goal share (§5.9).
- **How it thinks:** [pipeline.py](../../src/practical_asset_allocation/pipeline.py) (one file on purpose — the models, the orchestrator, and the R157–R222 long-term math together, ~1,500 lines; the math is easier to follow contiguously, so don't split it for tidiness). It calls `asset_allocation_pydantic` steps 1, 2 and 5 directly, lifts selected step-4 helpers (`phase1_bounds`, `phase2_asset_class_pcts`, `phase4_multi_asset`, `phase5_equity_subgroups`) plus the shared slider, and **reimplements step 4 itself** to be holdings-aware:
  - ELSS is **frozen** at the customer's existing exposure (SEBI 3-year lock-in means we can't trade it): `elss_corpus` is subtracted before the steps run and comes back as a frozen `tax_efficient_equities` row. In production only the lumpsum's run supplies a non-zero ELSS corpus (from its holdings snapshot, §5.9); every other caller passes 0.
  - Direct stocks / PMS are **not an input** — the engine allocates mutual-fund money only.
  - Equity subgroups run through the **same shared v2 average-based slider** as the upstream module ([equity_subgroup_slider.py](../../src/asset_allocation_pydantic/equity_subgroup_slider.py)) — what differs are the inputs. Practical passes the frozen ELSS as `locked_amount` where the ideal engine passes `0`, and measures each subgroup's share against the MF residual plus the multi-asset sleeve (ELSS excluded). With nothing locked the slider pins at the flat 8% base, and it only starts sliding down once locked exposure passes 20% of the equity budget — so for a customer with no meaningful locked holdings, practical and ideal apply the same threshold.
  - **Snap-to-current runs last** ([allocation_snap.py](../../src/practical_asset_allocation/allocation_snap.py)): a subgroup whose proposed move is under `SNAP_THRESHOLD_PCT` (0.5%, env `PAA_ALLOCATION_SNAP_THRESHOLD_PCT`) of the portfolio keeps its current amount, and the freed residual lands on the single largest un-snapped mover, so `grand_total` is unchanged. It rewrites only `aggregated_subgroups` and is a strict no-op without `current_subgroup_allocation` — **which no production caller supplies**, so it is dormant in the live app.
- **Investment preferences — honoured as INPUTS, at the phase that decides each facet**, never as a reshape of a finished allocation: once the multi-asset sleeve is carved, a post-hoc reshape cannot move debt, so it misses a class ask or guts a buffer to hit it. The facets enter separately:

  | Facet | Where it lands |
  |---|---|
  | Asset-class split | `phase2_asset_class_pcts` — the requested split **IS** the output; the market-view tilt and the phase-1 bounds (the others-gate included) are bypassed |
  | Multi-asset sleeve size | `phase4_multi_asset` |
  | Sub-group pins / exclusions | `phase5_equity_subgroups` |

  Gold and the long-term debt bucket are pure residuals of their class, so pinning either has the same shape as an equity pin — a ceiling on the sleeve. Every sub-group preference therefore collapses into one rule: *the sleeve is the smallest size any class room allows*, and each residual is what it leaves behind. The 40% multi-asset equity cap (§5.4) is one of those rooms only on the auto-sized path; a customer who names a sleeve size bypasses it. Sub-group shares are a % of the **whole portfolio**, never of their class ([D-A3](../../src/practical_asset_allocation/human_override.py)); a share of `0` is a **hard exclusion**, not a pin of zero. Excluding gold zeroes the commodity class and with it the sleeve — the fund holds gold, so "no gold" means no fund. Excluding a debt bucket re-routes to the other one rather than stranding money in a refused fund.
- **Setting any preference suspends the steps 1–2 carve-outs.** Emergency fund and near-term goals stop being carved, and the whole corpus goes to the long-term step (`_no_carveout_buckets`); the run therefore carries no `goal_funding`. This is a real trade the customer is making, so `carve_outs_at_risk()` reads the profile for both the screen's pre-commit warning and the record attached to the run — one source, so the two cannot disagree. With production's `emergency_fund_needed=False`, only near-term goals can be at risk.
- **`apply_human_override` is the reporting point, not a reshape.** It is always invoked and is a strict no-op on empty preferences (the golden-test guarantee: a no-preference run is byte-identical to the golden fixture). What it reports is what only it knows — whether anything stopped the ask landing: over-subscribed pins scale proportionally, while an over-large multi-asset sleeve is *capped* instead, because the sleeve is one fund rather than a share of a class pool.
- **The ideal engine stays preference-free.** `asset_allocation_pydantic` remains Prozpr's own recommendation; preferences shape only the practical, holdings-aware plan. That is what makes "here's what we'd advise, here's what you asked for" a truthful contrast rather than two views of the same tilted number.
- **LLM:** none.
- **Why a separate module:** the original `asset_allocation_pydantic` is what you'd recommend if the customer had no existing holdings. The practical one says "given what they already hold, here's the closest target we can realistically reach without a tax-suicidal rebalancing." If you confuse the two, the recommendation will tell the customer to sell things SEBI won't let them sell.

### 5.6 `Rebalancing/` — what trades to actually do

The bridge from "ideal target" to "transactions you submit".

- **In:** `RebalancingComputeRequest` — the nested `practical_allocation_input` (which carries the corpus: `total_corpus` is a property read off it), tax state (regime, rate, STCG budget, carryforward losses), the rounding step, and a single homogeneous list of `FundRowInput` rows. In production the app's input builder builds the rows from the MF transaction ledger of the customer's active CAS statement, plus every recommended fund in the ranking CSV. Recommended funds carry `rank ≥ 1`; held-but-not-recommended ("BAD") funds arrive in two flavours, both `is_recommended = False`: **force-exit** — `rank = FORCE_EXIT_RANK` (9999), `target_amount_pre_cap = 0`; step 2 sets `exit_flag`, step 4 sells it regardless of buy demand (LT in full, ST within the STCG budget) — and **NEUTRAL** — `rank = 0`, `target_amount_pre_cap = st_value_inr` (the locked ST minimum), so `diff = -lt_value` and only the migratable LT portion ever reads as sellable. Two things have special handling:
  - **ELSS** → the scalar `practical_allocation_input.elss_corpus`, not rows. The scalar never becomes a trade (lock-in), and [step6_presentation.py](../../src/Rebalancing/steps/step6_presentation.py) emits a frozen `tax_efficient_equities` `SubgroupSummary` for it so the customer view still shows the ELSS allocation. The production rebalancing builder sums the held ELSS rows into `elss_corpus` and strips every ELSS row (ranked or held), so the frozen summary is the only place ELSS appears; the Invest-page bars and the chat facts count it as held equity.
  - **Direct stocks** → nothing. They are not an engine input — no scalar, no row, no trade: the MF transaction ledger the rows come from holds no direct equity.
- **Out:** `RebalancingComputeResponse` — per-fund rows after step 5, subgroup summaries, totals, the trade list, warnings, metadata (`engine_version`, currently **1.15.0** — `config.ENGINE_VERSION`, bumped on any output-altering change). Also surfaces the upstream `practical_allocation` output verbatim for the customer view.
- **How it thinks:** [pipeline.py](../../src/Rebalancing/pipeline.py) calls `practical_asset_allocation.run_practical_allocation` first (this is why the import edge exists), then lifts each MF subgroup's practical total onto its ranked rows (`_assign_subgroup_targets`) — an overwrite, not a fill: whatever the input builder set there is discarded. The lift runs reserve-then-residual:
  - **Absent means zero.** A subgroup the practical plan gives nothing to gets a zero target, so ranked rows there are not bought.
  - **NEUTRAL ST offset.** The target is reduced (floored at zero) by the ST value of that subgroup's `rank = 0` rows, because that locked ST is already exposure to the subgroup and skipping the offset double-allocates.
  - **Reserve.** A held recommended fund within `RANK_PROTECT_BAND` (5, exclusive) of the best rank present, and rated at or above `EXIT_FLOOR_RATING`, keeps its holding as a floor (trimmed worst-rank-first if the floors exceed the target), so a rank-2 holding is not sold to buy rank 1.
  - **Residual.** Only what the floors leave splits equally across the subgroup's top 1 or 2 eligible ranked rows (`config.funds_per_subgroup` / `_residual_shares`): 1 fund below ₹50L of total corpus, 2 at or above (`SUBGROUP_FUND_COUNT_THRESHOLD_INR`); the best-ranked recipient takes the rounding remainder.
  - The frozen subgroup (`human_override.FROZEN_SUBGROUPS` = `tax_efficient_equities`) is exempt from the lift entirely.

  Then it runs the six steps (plus 2b) in [steps/](../../src/Rebalancing/steps/):

  | Step | File | What it does |
  |---|---|---|
  | 1 | [step1_cap_and_spill.py](../../src/Rebalancing/steps/step1_cap_and_spill.py) | Rounds the assigned targets to the rounding step. Despite its name it neither caps nor spills — no per-fund cap bounds a rebalance (`max_pct` reports a flat 100). |
  | 2 | [step2_compare_and_decide.py](../../src/Rebalancing/steps/step2_compare_and_decide.py) | For each fund: target vs. current → `diff`. **The trade bar:** a row is `worth_to_change` only when `abs(diff) ≥ min(1% of total corpus, 50% of max(target, present))` (`config.min_change_threshold`), or when `exit_flag` is set (force-exit rank, or rating below `EXIT_FLOOR_RATING`) — an exit always trades. |
  | 2b | [step2b_suppress_debt_switch.py](../../src/Rebalancing/steps/step2b_suppress_debt_switch.py) | Cancels matched debt sell/buy *intents* before step 3 classifies gains, across every Debt-class subgroup (`DEBT_NETTING_POOL` in `tables.py`, kept in parity with the app's classifier by a dedicated test) — including off-list (rank 0) holdings, so a held debt fund is never sold just to buy another. Force-exits still exit; a sell with no matching debt buy still goes through; surviving rows are re-tested against the same trade bar. |
  | 3 | [step3_tax_classification.py](../../src/Rebalancing/steps/step3_tax_classification.py) | For each sell candidate, compute the STCG and LTCG embedded in its ST and LT lots. (The ST/LT split itself is made upstream by holding period — `ST_THRESHOLD_MONTHS_EQUITY` 12 / `_DEBT` 24 in `config.py`, applied by the app's `tax_aging.py`.) |
  | 4 | [step4_initial_trades_under_stcg_cap.py](../../src/Rebalancing/steps/step4_initial_trades_under_stcg_cap.py) | First pass. Forced sells run regardless of buy demand, LT first, ST only within the STCG offset budget; optional sells (over-target recommended funds) are LT-only and fill only the remaining buy demand; buys are scaled to the cash raised. Forced-exit cash the passing buys don't need **tops up recommended buys that fell under the bar**, biggest gap first, so exit money is never left idle. |
  | 5 | [step5_loss_offset_top_up.py](../../src/Rebalancing/steps/step5_loss_offset_top_up.py) | Second pass: use SHORT-term losses (carryforward plus pass-1 realised) to unlock ST sells the budget blocked. LT losses never offset STCG. |
  | 6 | [step6_presentation.py](../../src/Rebalancing/steps/step6_presentation.py) | Emit the trade list, the subgroup summary (plus the frozen ELSS entry), the customer-view rationale strings (from [rationales.py](../../src/Rebalancing/rationales.py)). |

- **LLM:** none. **This engine is fully deterministic.** Every "why am I being asked to sell this" question has an answer that traces to step 1–5 and the `reason_code` in `rationales.py`.
- **Env knobs:** thresholds, the fund-count line, the rank band and tax rates are env-overrideable (the `REBAL_*` variables in [Rebalancing/config.py](../../src/Rebalancing/config.py)); the two trade-bar fractions fail at startup unless strictly between 0 and 1. Useful when SEBI changes a rule and you want to reproduce both worlds. The per-fund cap knobs and `cap_pct_for` remain in `config.py` / `tables.py` but constrain no rebalance — only the additional-investment input builder reads them, and its engine ignores them.
- **Investment preferences reach this engine only through the upstream practical allocation** it rebalances toward (§5.5) — one carrier, applied once, at the phase that decides each facet. The engine takes no per-turn tilt; [`test_preference_extraction.py::test_legacy_sleeve_tilt_is_gone_everywhere`](../../../app/domains/rebalancing/tests/test_preference_extraction.py) greps `app/` and `AI_Agents/src/` and fails on any tilt vocabulary (`asset_class_tilt`, `market_cap_tilt`, `pure_equity_only`, `scope_only_asset_classes` and friends).
- **Chat runs no preference what-ifs.** The Haiku follow-up detector (`chat.py` `_detect_rebal_action`) still *extracts* `preference_asks` — the schema and `_handle_preference_what_if` are kept deliberately as the re-enable seam, so don't delete them as dead code — but a filled `preference_asks` produces the one shared `PREFERENCE_REDIRECT_MESSAGE` (relayed with `action_mode="pointer"`) plus `show_preferences_pill`, and fires the **content-free** `preference_unserved` PostHog event (`capture_preference_unserved` — `flow`, a fixed `failure_class` token and the session/user ids, never chat text). A *servable* override in the same turn (cash injection, tax rate) is still run and answered, with the pointer attached, because returning the pointer alone would drop a real question. Saved preferences still shape the plan and are still disclosed in the reply.
- **Consolidation reshapes only the buy side.** `consolidation.py`'s F3-B reshape redistributes only the *buy* budget across allowed funds (every sell and the total buy preserved; identity when nothing binds). The chat's consolidate path fills `ConsolidationConstraints` from the detector: `target_fund_count` (fewer new-buy funds), `allowed_categories` (where this plan's new money goes), `excluded_categories` (only the ELSS / lock-in exclusion for new buys), and `category_weight_targets` (a category we don't track as a preference, e.g. banking funds). Every other exposure ask is a `preference_asks` entry and gets the redirect above.

### 5.7 `cashflow_statement/` — goal planning (engine + agent)

This is the only place we use LangGraph, and the only agent with a real loop.

#### The engine — [engine/pipeline.py](../../src/cashflow_statement/engine/pipeline.py)

- **In:** `GoalPlanningInput` — profile (age, income, expenses), retirement plan, properties (with mortgages), custom goals, one-off events.
- **Out:** `GoalPlanningOutput` — headline status (on-track / shortfall / surplus), per-goal funding, annual cashflow projection, fund-flow summary. Month-by-month rows (`monthly_cashflow`) are emitted **only when `detail_level == "full"`** — otherwise the field is `None`. `detail_level` defaults to `"default"`, and the product goal-planning path (app `input_builder`) passes `"default"`; the REST compute route passes `"full"`.
- **How it thinks:** an 8-stage pipeline, one file per stage:

  | Stage | File | What it does |
  |---|---|---|
  | 1 | [profile.py](../../src/cashflow_statement/engine/profile.py) | Normalise the profile (age in months, current FY, etc.). |
  | 2 | [retirement.py](../../src/cashflow_statement/engine/retirement.py) | Project retirement corpus required + accumulated. |
  | 3 | [mortgages.py](../../src/cashflow_statement/engine/mortgages.py) | Build mortgage amortisation schedules. |
  | 4 | [properties.py](../../src/cashflow_statement/engine/properties.py) | FV / PV property values; net of mortgage. |
  | 5 | [goals_table.py](../../src/cashflow_statement/engine/goals_table.py) | One row per goal, with FV target and PV-discounted corpus required. |
  | 6 | [cashflow.py](../../src/cashflow_statement/engine/cashflow.py) | Month-by-month projection: income, expenses, EMIs, goal payouts. |
  | 7 | [funding.py](../../src/cashflow_statement/engine/funding.py) | Walk the cashflow; split shortfalls proportionally across that month's outflows. **One shared corpus pool**, not per-goal. |
  | 8 | [summary.py](../../src/cashflow_statement/engine/summary.py) | Roll up into headline status + per-goal funding tables. |

- **Time conventions:** all inflation FV math and PV-of-corpus-to-today use **day-precise `EOMONTH(target_date)/365`** — symmetric inflate/discount across every stage. Indian FY runs April–March; `fy_for_date` returns the closing year (April 2026 → FY27). **₹1000 rounding** is applied to FV cashflow anchors only; PV/display fields stay unrounded.
- **Sign conventions:** shortfalls positive, EMI/expense/goal payouts positive magnitudes, `surplus_or_shortfall_today` signed.
- **LLM:** none. The engine is Excel-parity by design.
- **Internal types live in `engine/_types.py`** and are NOT re-exported from `__init__.py`. Cross-boundary types live in [models.py](../../src/cashflow_statement/models.py). If you need to use a type from the app layer, it must be in `models.py`.

#### The agent — [agent/graph.py](../../src/cashflow_statement/agent/graph.py)

This is the only LangGraph usage in the codebase — and, today, **it is not on the production path**: `app/` imports only `cashflow_statement.engine`, `models`, and the package facade for model types (`input_builder.py`), never `agent/`; the live customer conversation runs through the goal-planning chat bridge (`app/domains/cashflow/services/goal_planning_engine/`), which calls `compute_full_projection` directly. Everything below describes how the agent works, not how a customer question is answered. The reason it earns LangGraph: it's a genuine multi-turn loop where the LLM needs to (1) extract structured goals/properties/events from natural language, (2) decide which deterministic tool to call next, (3) see the tool result and decide again, (4) eventually summarise. That's what `StateGraph` + a tool-calling node was built for.

##### LangChain vs LangGraph — they're different things

This trips people up most often, so worth being explicit:

- **LangChain** is the broader framework. **LCEL chains** (the `prompt | llm | parser` pipes you see in `risk_profiling`, `intent_classifier`, the cashflow `summarizer`) are LangChain's composition primitive — a straight pipeline.
- **LangGraph** is a separate layer that sits *on top of* LangChain. It adds a state machine with named nodes, conditional edges, and tool-calling primitives (`ToolNode`, `InjectedState`, `Command`). LangGraph still uses `ChatAnthropic` under the hood for the actual LLM call.

The rule of thumb:

| Use… | When… | Example |
|---|---|---|
| **LCEL** (LangChain) | Input → prompt → LLM → output. One pass. | `intent_classifier`, `risk_profiling` summary, the cashflow `summarizer` |
| **LangGraph** | The LLM needs to **loop**: call a tool, see the result, decide whether to call another tool, eventually stop. | The cashflow agent — the only such place in this codebase |

If a flow can be expressed as `prompt | llm | parser`, you don't need LangGraph. Reach for LangGraph only when an LLM is genuinely deciding "what do I do next" in a loop.

##### The graph, drawn

```mermaid
flowchart LR
    Start([User question<br/>+ baseline input]) --> Ingest["<b>ingest_baseline</b><br/>validate staged overrides<br/>reset per-turn fields"]
    Ingest --> Agent{"<b>agent</b><br/>Claude Sonnet<br/>+ 6 bound tools"}
    Agent -->|"wants a tool"| Tools["<b>tools</b> (ToolNode)<br/>executes one of 6"]
    Tools -->|"tool result<br/>(ToolMessage)"| Agent
    Agent -->|"no more tool calls"| Finalize["<b>finalize</b><br/>fallback compute_projection<br/>+ summarize_plan"]
    Finalize --> End([GoalPlanningSnapshot])
```

Four nodes, defined in `build_graph()` in [graph.py](../../src/cashflow_statement/agent/graph.py):

| Node | What it does |
|---|---|
| `ingest_baseline` | Resets per-turn audit fields (`actions_taken_this_turn`, `extracted_events_this_turn`). Compares the new baseline's **profile block** against the cached `last_output` (`last_output.input_echo.profile != baseline_input.profile`); on a mismatch it discards the cache (`last_output` set to `None`) and flags state as `dirty` (dropping an orphaned override also sets `dirty`). Note the comparison is profile-only — a changed goal, property, mortgage or one-off event does not by itself invalidate the cached projection, which `compute_projection` short-circuits on whenever state is not `dirty`. It also carries an orphan check that applies only to overrides exposing a `property_name`, validated against `current_properties` + `goal_properties` — no current `OverrideSpec` variant (`NumericOverride`, `RateOverride`) has that attribute, so the branch never fires and nothing is dropped today. Goal-name orphans (e.g. a `GoalMutation` naming a deleted custom goal) are never validated here. |
| `agent` | The LLM. Claude **Sonnet** (`claude-sonnet-4-6` — the `build_graph()` default in `graph.py`; note `nodes.py`'s `AGENT_MODEL_DEFAULT` Haiku constant is bypassed), system prompt = a compact summary of profile + goals + mortgages + one-off cashflows ([nodes.py: `_format_baseline_summary`](../../src/cashflow_statement/agent/nodes.py)). The six tools are *bound* via `.bind_tools(TOOLS)`. The LLM decides whether to call a tool or to finish. |
| `tools` | LangGraph's prebuilt `ToolNode` over the six `@tool`-wrapped functions. Whichever tool the LLM called gets executed; its return value comes back as a `ToolMessage`. |
| `finalize` | End-of-turn cleanup. If the LLM never called `compute_projection`, this runs the engine as a fallback so the snapshot is always populated. Then `summarize_plan` writes the customer-facing `PlanSummary`. |

The only conditional edge is `should_continue` — it inspects the last LLM message for `tool_calls`: yes → loop to `tools` → back to `agent`; no → exit via `finalize`. Recursion is capped at **15 iterations** (`AGENT_RECURSION_LIMIT`); past that the graph errors out and a fallback snapshot is returned with the failure flagged in `error_log`. **The customer always gets something** — never a bare exception.

##### The six tools

All defined in [tools.py](../../src/cashflow_statement/agent/tools.py). Each has a pure-Python `_impl` (unit-testable in isolation) plus a thin `@tool`-decorated wrapper that adapts it to LangGraph's `InjectedState` + `Command` protocol.

| Tool | What the LLM uses it for |
|---|---|
| `extract_financial_event` | Parse free-text ("buy a house in 5 years for ₹1.5 crore") into a structured `ExtractedGoal` / `ExtractedProperty` / `ExtractedCashflow` / `ExtractedMutation`. Delegates to [extractor.py](../../src/cashflow_statement/agent/extractor.py) — a separate Haiku structured-output call. |
| `apply_override` | Stage a what-if parameter change (income, expense, SIP, growth rate). Accumulates across turns until cleared. |
| `clear_overrides` | Undo all or specific overrides. |
| `mutate_goal` | Remove or update an existing goal (including retirement). |
| `compute_projection` | Run the deterministic [engine](../../src/cashflow_statement/engine/pipeline.py). Idempotent (short-circuits if state isn't `dirty` and `last_output` exists). |
| `propose_levers` | Generate up to 3 deterministic recommendations via [levers.py](../../src/cashflow_statement/agent/levers.py) (A/B/C/D/E/F: delay retirement, increase savings, reduce a goal, etc.). The LLM picks which to surface; the lever search and ranking are plain Python. |

##### One turn, end to end

Customer says: *"What if I delay retirement by 3 years?"*

1. **ingest_baseline** — pull in the latest `GoalPlanningInput`, drop the cached projection if the profile block changed, reset per-turn audit fields, hand off.
2. **agent (LLM turn 1)** — Claude sees the question + the compact baseline summary in its system prompt. Decides it needs two tools and emits both: `apply_override({key: "retirement_age", value: 63})` and `compute_projection()`.
3. **tools** — `ToolNode` runs both. `apply_override` stages the override onto state. `compute_projection` merges all staged overrides into a fresh `GoalPlanningInput`, runs the 8-stage engine, stashes the result on `last_output`, and returns a bounded "feasibility + top-3 underfunded goals" summary as a `ToolMessage`.
4. **agent (LLM turn 2)** — sees the `ToolMessage`s. Decides it has enough to answer; emits a final assistant message with no tool calls.
5. **finalize** — `last_output` is already populated (skips the fallback compute), runs `summarize_plan` to produce a customer-facing `PlanSummary`.
6. Done. Returns a `GoalPlanningSnapshot` — **in the agent's own tests.** No `app/` caller invokes this graph today: the live goal-planning turn calls the engine directly (`compute_full_projection`) from the chat bridge in `app/domains/cashflow/services/goal_planning_engine/service.py`, and `chat.py` hands the resulting `facts_pack` to the shared answer formatter. `summarize_plan`, the agent nodes, and `agent/prompts.py` never run in production. Read this section for how the graph is wired, not for how a customer question is answered.

That whole sequence is three LLM calls (two agent turns plus `summarize_plan` in `finalize`, which runs every turn) + one engine run. The graph's job is to wire them up so the LLM can decide *during the turn* what to do, instead of you having to hand-write the if/else.

##### Other pieces

- **State** ([state.py](../../src/cashflow_statement/agent/state.py)) — `AgentState` TypedDict: `accumulated_overrides`, `captured_goals`, `captured_properties`, `captured_cashflows`, `captured_mutations`; per-turn fields reset on every `ingest_baseline`. **There is no checkpointer**: `get_compiled_graph()` compiles with `checkpointer=None` — each invocation gets fresh state, and the caller passes the full accumulated state back in via `state_update` each turn. (The `thread_id: chat_session_id` config is set but inert; `MemorySaver` appears only in tests.)
- **Extractor** ([extractor.py](../../src/cashflow_statement/agent/extractor.py)) — Haiku structured-output extractor that turns conversation into `GoalPlanningInput` fields. Called from inside `extract_financial_event`.
- **Levers** ([levers.py](../../src/cashflow_statement/agent/levers.py)) — deterministic feasibility levers A/B/C/D/E/F. Pure Python. The LLM picks which to propose via `propose_levers`; the search and ranking are not LLM-driven.
- **Summariser** ([summarizer.py](../../src/cashflow_statement/summarizer.py)) — Haiku **LCEL chain** (LCEL here, not LangGraph — it's a straight prompt-to-summary pipe) that turns `GoalPlanningOutput` into a `PlanSummary`. **All rupee values are pre-formatted to Indian notation before the prompt is built.** The model copies them verbatim and never does its own arithmetic.

**Don't add LangGraph elsewhere without discussion.** The chat brain itself is intentionally hand-written async; LangGraph there would add ceremony without expressive power. The bar for adding it to a second agent is "we have a real tool-calling loop with intermediate state and have tried plain async first."

### 5.8 `portfolio_query/` — answering Q&A about the customer's own portfolio

Triggered by the `portfolio_query` intent.

- **In:** `ClientContext`, `PortfolioContext` (asset-class + sub-category + per-fund detail; the holdings list is capped to the largest by value, with counts computed over the full portfolio), and `want_fund_house_view`.
- **Out:** the agent does **not** answer. [orchestrator.py](../../src/portfolio_query/orchestrator.py) exposes `build_facts(client, portfolio, want_fund_house_view=False)` → one INR-enriched facts dict (`fund_house_view`, `client_profile`, `current_portfolio`), and `query_body` → the skill's System Prompt with `guardrails.md` filled in. The app bridge ([`portfolio_query_service.py`](../../../app/domains/portfolio/services/portfolio_query_service.py)) passes both to the shared answer formatter (`action_mode="narrate"`), which makes the LLM call. The reply's tool also carries non-prose fields: `guardrail_triggered`, `redirect_message`, `preference_question` (drives the preferences-page pill), and two telemetry-only fields — `path` (X = out of scope, M = market question, P = portfolio question; the skill tells the model to set it every turn) and `suggested_intent` (usually null). The app layer records `path` on every answered turn and `suggested_intent` only when it names a different module; neither changes the reply and nothing downstream branches on them.
- **How it thinks:** [orchestrator.py](../../src/portfolio_query/orchestrator.py) is the entry point. It builds the facts dict — every `*_inr` field gets a `*_indian` sibling — and renders the skill through [skill_executor.py](../../src/portfolio_query/skill_executor.py), which loads:
  - [portfolio_query.md](../../src/portfolio_query/portfolio_query.md) — the prompt skill, with YAML front matter; the Step 1–5 checklist lives in its System section, because the formatter owns the user message
  - [guardrails.md](../../src/portfolio_query/guardrails.md) — embedded into the system prompt; defines in-scope vs. out-of-scope

  There is no `llm_client.py` here, so the package cannot answer standalone — drive a real chat turn to exercise it.
- **The fund-house view is GATED — this is the classifier's `tools_needed` in action.** Loaded unconditionally, market context leads the model to compare a portfolio's small-cap *allocation* percentage against a *valuation* P/E. The bridge passes `want_fund_house_view = "fund_house_view" in ctx.tools_needed` (default `False`). When false, the block is an explicit placeholder telling the model to answer from holdings and profile and not to speculate about Prozpr's market view; when true, it is the **Prozpr-only** slice from `house_view.load_house_view(prozpr_only=True)` (§4) — Prozpr's own stance, no fund house named — or, if the file is missing or invalid, a placeholder telling the model not to invent a stance and **not to mention that the view is missing**. The factual `market_commentary_latest.md` never reaches this agent.
- **Two different XIRRs reach the prompt.** `holdings[].xirr_pct` is one fund's annualised return; the portfolio-level `xirr_pct` is the whole portfolio's. Per-fund values are looked up from `UserMfLatestSnapshot` keyed by `scheme_code` (which is `ticker_symbol` on the holding) and are populated for mutual funds with enough transaction history — so the model *can* rank and compare funds by it. The lookup returns `{}` on any failure by design: a missing XIRR degrades one line of an answer and must never fail the turn.
- **LLM:** none inside the package. The formatter's single Haiku call (`temperature=0`, prompt caching, forced tool) writes the reply and streams only its `answer` field when the turn has an open token stream. The bridge hands the formatter a pre-annotated history (`history_override=_build_history(...)`: time gaps marked, long prior answers excerpted) so a fortnight-old thread does not read as live context.
- **Why "skill" markdown files:** the prompt is long and product-owned; keeping it in `.md` lets non-engineers iterate without touching code. The YAML front matter lets `SkillExecutor` parse out the system/user templates without bespoke string handling.
- **The guardrail layer matters.** If the question drifts into "should I buy X?" territory or asks for things outside the portfolio, the model is instructed to set `guardrail_triggered=True` and return a `redirect_message`. The guardrail is not prompt-only: the bridge's `_apply_guardrail_backstop` **discards `answer`** whenever the flag is set (the model may have written an out-of-scope reply before deciding it was Path X) and sends `redirect_message`, else the canned `_DEFAULT_REDIRECT` from `models.py`. The bridge passes `allow_empty_answer=True` so a Path-X null `answer` does not read as a formatter failure.

### 5.9 `additional_investment/` — deploying fresh money

"I want to invest another ₹5 lakh — which funds?" or "start a ₹20,000 SIP" lands here.

- **In:** `AdditionalInvestmentInput` — deploy amount + cadence (`LUMPSUM` / `SIP_MONTHLY`; for a SIP the amount is monthly), the practical allocation's per-bucket subgroup rows, optional `current_value_by_subgroup` (lumpsum only: the customer's holdings, aggregated to subgroups — goal-used short-term money already stripped out, below), `goal_share_inr` / `goal_subgroup` (near-term goal money and which subgroup it buys, ahead of everything else), the ranked fund list, `investable_corpus_inr` (decides 1 vs 2 funds per subgroup), `rounding_multiple_inr` (₹100), and `exclude_subgroups` (the frozen ELSS subgroup). The per-subgroup cap knobs (`cap_pct_by_subgroup`, `default_cap_pct`, `*_fund_cap_floor_inr` — still filled by the builder) and `rebal_buy_isins_by_subgroup` are vestigial: still on the model, ignored by selection.
- **Out:** `AdditionalInvestmentOutput` — per-subgroup `SubgroupTarget` table, the BUY list (`FundBuy`, with `monthly_amount_inr` set for a SIP), `target_bucket` (a truthful *label*, not a selector: `short_term` once the goal share is at least half the deploy amount, else `long_term`; `medium_term` exists only in the enum), and `deployed_inr` / `undeployed_inr`.
- **How it thinks:** [pipeline.py](../../src/additional_investment/pipeline.py) calls `compute_goal_first_targets` — goal money first, then one of two splits for the rest — then selects funds:
  - **Goal money first:** [ratio.py](../../src/additional_investment/ratio.py)'s `compute_goal_first_targets` sends `goal_share_inr` straight to `goal_subgroup` by name, ahead of any ratio; the rest is never weighted by the short-term column, which the goal share has already claimed. A SIP's goal share is rounded UP to the next ₹100 first (capped at the SIP), because the allocation engines hand it over in exact rupees and nearest-₹100 would leave the goal short every month.
  - **Long-term split** (SIP): `compute_long_term_targets` renormalises the remainder across each eligible subgroup's long-term column.
  - **Deficit-fill** (lumpsum): on the remainder, `compute_deficit_targets` runs each subgroup's `total − short_term` (the goal money already claimed the short-term column) against current holdings, splitting across the `max(0, ideal − current)` gaps — falling back to the ideal ratios if everything is at/above ideal.
  - [selection.py](../../src/additional_investment/selection.py) then gives each subgroup's target to its **top 1 or 2 ranked funds**, by `Rebalancing.config.funds_per_subgroup(investable_corpus_inr)` — 2 at/above ₹50L, else 1, the same rule as rebalancing. Each subgroup's amount rounds to the nearest ₹100 **once**, then splits across its funds in whole ₹100 steps with rank 1 taking any extra step, so two funds total the same as one; a fund left below ₹100 gets no buy. Selection is holding-agnostic and identical for SIP and lumpsum. A lumpsum then pushes sub-₹100-per-subgroup rounding dust into its largest buy so it deploys the exact amount; genuine fund scarcity (a subgroup with no ranked fund) stays in `undeployed_inr`. BUY-only; it never sells.
- **The goal share is the app layer's call, capped at the deploy amount** ([`ainv_engine/service.py`](../../../app/domains/additional_investment/services/ainv_engine/service.py), `AINV_ENGINE_VERSION = "ainv-3.8.0"`). There is no cashflow projection on this path. The service first runs the practical allocation for the cadence, then `goal_share_for` ([`ainv_engine/input_builder.py`](../../../app/domains/additional_investment/services/ainv_engine/input_builder.py)) reads that run's `goal_funding` (§5.4):
  - **SIP:** the practical run uses the SIP amount as `monthly_sip` (held short-term money comes off the preloaded user); the goal share is `monthly_sip_to_goals`, the rest follows the long-term column. When that long-term column is under ₹10,000 (e.g. a near-zero corpus), the long-term split comes instead from a second run sized at a notional ₹1 crore (`CorpusPin`) — the ratios are scale-invariant — and the chat narrates that sized run.
  - **Lumpsum:** the practical run is pinned to *holdings + deploy amount* from one freshly loaded holdings snapshot (`CorpusPin`, with the snapshot's ELSS as `elss_corpus` and its short-term money as `short_term_holdings`) and uses `monthly_sip = 0`, so the goal share — `from_corpus` — is the goals' full remaining need, not reduced by an assumed future SIP. Only the goal-used portion of the held short-term money is then removed before the deficit fill — pro rata across held short-term funds (`_long_term_holdings`) — so holdings beyond what the goals used still count toward the other targets. The persisted `deficit_facts` carry a `goal_row` flag on the goal's own subgroup (its `ideal_inr` adds the goal's `allocated_amount`, its `current_inr` adds back all the goal-used holdings); [`lumpsum_reasoning.py`](../../../app/domains/additional_investment/services/lumpsum_reasoning.py) turns that into prose that says what a holding *counts toward*, never what it *sits in*, and the goal row's sentence names the near-term goals by name.
  - **A saved investment preference** suspends the carve-outs (§5.5), so the run has no `goal_funding` and the goal share is 0: the whole SIP follows the stated split, and a lumpsum fills the gaps in it.
- **LLM:** none — pure engine. The Haiku extraction of "how much / lumpsum-or-SIP / which category" from the customer's words happens in the app layer (`app/domains/additional_investment`), not here.
- **One peer import, no peer logic.** The engine imports `funds_per_subgroup` from `Rebalancing.config`, so the 1-vs-2 fund-count rule has one source; everything else — PAA's output rows, the holdings snapshot, the fund-ranking CSV — is wired in by the app layer. The holdings snapshot skips direct equity, so stocks never enter a deploy. Distinct from `Rebalancing`: that engine moves *existing* money (buy+sell, tax-aware); this one only places *new* money.

### 5.10 `mutual_fund_query/` — questions about funds themselves

Triggered by the `mutual_fund_query` intent. "What are Parag Parikh's returns?", "how does it compare to peers?", "which are the best large cap funds?" land here.

The distinction that governs routing: **`mutual_fund_query` is about funds in the abstract, held or not; `portfolio_query` is about funds the customer owns.** The prompt's scope test is to read the possessive first — a superlative does not override it, so "the best funds" is a screen but "my best funds" is `portfolio_query`. And a *verdict* on their existing holdings ("do I have the right funds?") is `rebalancing`, not either of these.

- **In:** the question and optional conversation history (for the extract pass); the narration pass is fed a `MutualFundQueryFacts` container built by the app layer.
- **Out:** `extract` returns an `ExtractResult` (fund names, `asked_for`, and the screen fields below); `narrate_body` exposes the Narrate System prompt section. The customer-facing reply is written by the shared answer formatter in `app/`, not by this package.
- **How it thinks:** **two passes — no agentic loop**:
  1. `extract` ([orchestrator.py](../../src/mutual_fund_query/orchestrator.py)) — one forced-tool call that names the fund(s) with pronouns resolved from context, and classifies the ask as `reasoning` / `returns` / `comparison`. It also sets `is_screen` (plus optional `screen_category` / `screen_horizon_years`) for a generic "best performing funds" question that names no fund. **This pass must not answer the question**, only identify it.
  2. Narration — the app bridge ([`mutual_fund_query_service.py`](../../../app/domains/mutual_funds/services/mutual_fund_query_service.py)) passes `narrate_body` as the formatter's body prompt with `action_mode="fund_detail"`, so the grounded facts are rendered under the guardrail rules in the shared PI voice.
- **The engine is DB-agnostic — it only ever sees DTOs.** Between the two passes the app layer resolves fund names and assembles `MutualFundQueryFacts` (per-fund returns, our `house_reason` and `shortlist_rank` where the fund is on our shortlist, and peer rows — peers only for a single named fund; two or more named funds are the comparison set). Nothing under `src/` touches the database.
- **`shortlist_rank` is our house rank, NOT a category percentile.** The field name invites the wrong reading; `has_house_view` is what tells you whether we have an opinion at all.
- **The screen path skips the facts build.** When `extract` sets `is_screen`, the app service calls `screen_top_funds` and answers through the shared answer formatter with `action_mode="screen"` instead of `fund_detail`.
- **All prompt content lives in one file.** [mutual_fund_query.md](../../src/mutual_fund_query/mutual_fund_query.md), split into three sections (Extract System / Extract User / Narrate System), with the guardrail rules embedded in Narrate System. Read with `read_text_bom_aware` (§4) and filled with a brace-safe `{{name}}` replacer, because the file carries inline JSON.
- **LLM:** Haiku for the extract pass via [llm_client.py](../../src/mutual_fund_query/llm_client.py), `temperature=0`, forced tool-use, prompt caching; it does not stream — it produces no customer-facing prose. The narration is the formatter's call, which streams its `answer`.
