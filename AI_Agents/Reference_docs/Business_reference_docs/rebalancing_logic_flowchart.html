# Rebalancing — the decision logic, end to end

> **Where this document starts.** Two things are already known: **what the customer holds** (each mutual fund, split into short-term and long-term units) and **the target plan** (a rupee target per subgroup, from the practical asset-allocation engine). Everything from that point on is what this document traces.
>
> **Every section ends with the same customer**, so you can watch one portfolio move through each rule as you read it.
>
> **Internal document.** It contains our proprietary caps, bands and ordering rules. The client-facing version, which deliberately omits the numbers, is `Logics_reference_docs/Rebalancing.md`.

<div class="at-glance">
  <div class="cell"><div class="k">What it decides</div><div class="v">Per fund: buy, trim, exit, or leave alone — and by how much</div></div>
  <div class="cell"><div class="k">How it decides</div><div class="v">Fixed arithmetic. No AI, no judgement calls</div></div>
  <div class="cell"><div class="k">Repeatable?</div><div class="v">Same inputs always give the same trades</div></div>
  <div class="cell"><div class="k">Engine version</div><div class="v">1.15.0</div></div>
</div>

---

## The two inputs

**1 — What the customer holds.** Every mutual fund on the customer's active statement, rebuilt from its purchase and redemption transactions (a redemption uses up the oldest units first; switches and dividend reinvestments are not counted), with four figures each. The short-term/long-term split is by holding period per purchase lot: **24 months** for a fund our fund-rating record marks as debt, **12 months** for everything else — including any fund with no rating record. Units held exactly at the threshold count as long-term.

| Per fund | |
|---|---|
| Short-term value / cost | Units bought inside the threshold, at today's price and at purchase price |
| Long-term value / cost | Units bought before the threshold, same two prices |

**2 — The target plan.** A rupee target per subgroup (`low_beta_equities`, `short_debt`, `gold_commodities`, `multi_asset`, and so on). Rebalancing runs the practical (holdings-aware) allocation engine itself, on the customer's mutual-fund value, with their goals, risk score, tax rate and any saved investment preference. The engine can also carry a frozen ELSS amount; the live app passes it as zero (see Step 8).

The corpus being rebalanced is **what is already invested in mutual funds** — this is a rebalance, not a deployment of fresh money. Direct stocks sit outside it entirely: no row, no trade, no sale proceeds.

A plan is computed when the customer asks for one in chat or opens the Invest page, and silently in the background after a new statement is processed, so a plan is already waiting when they look.

<div class="callout rule">
  <div class="title">Near-term goals are funded first — nearest goal first</div>
  <p>Before the target plan reaches rebalancing, every goal due within 24 months after the end of the current financial year is already funded, in a fixed order: first from debt and arbitrage money already held (every debt-category fund except income-plus-arbitrage, which counts as long-term debt), then from the customer's stated monthly SIP — counted nearest goal first, each goal taking what the SIP can build up by its own date after the goals before it — and only then from corpus, for whatever the SIP cannot reach by that goal's own date. Goals are costed at their future value, inflation included. The money is planned into arbitrage when the customer's tax rate is above 20%, otherwise into short-duration debt.</p>
  <p>This near-term goal money is not fresh money — it comes out of the same portfolio this document rebalances. Held debt or arbitrage beyond what the goals need is not ring-fenced: it joins the long-term plan and is rebalanced like everything else, which can mean it ends up funding long-term equity.</p>
  <p>A saved investment preference suspends this carve-out: no money is set aside for near-term goals, and the whole plan follows the customer's stated split.</p>
</div>

### Vocabulary

| Term | Meaning |
|---|---|
| **Subgroup** | A sleeve of the portfolio. Targets are set per subgroup, then split across funds. |
| **Rank** | Research's ordering of funds within a subgroup. Rank 1 is our top pick. |
| **Corpus** | The customer's mutual-fund value — the money being rebalanced. |
| **Off-list fund** | Held, not on our recommended list (rejected by research, or never evaluated). Handled gently — see Step 1. |
| **Force-exit fund** | Held, explicitly flagged by research for removal. Sold in full regardless of tax. |

## The flow on one page

```mermaid
flowchart TB
  A["Holdings, split ST/LT<br/>+ per-subgroup targets"] --> B["STEP 1<br/>Reserve what good held funds<br/>already hold"]
  B --> C["STEP 2<br/>Share the rest across<br/>one or two funds"]
  C --> D["STEP 3<br/>Is this change<br/>worth making?"]
  D --> E["STEP 4<br/>Cancel debt-for-debt<br/>switches"]
  E --> F["STEP 5<br/>Price the gain on<br/>everything we plan to sell"]
  F --> G["STEP 6<br/>Decide who sells, in what order,<br/>and how far the cash goes"]
  G --> H["STEP 7<br/>Use available losses to<br/>unlock more selling"]
  H --> I["STEP 8<br/>Write the trade list<br/>and the reasons"]
```

Each step adds a decision on top of the last. The consequence worth checking hardest: **the "worth changing" test at Step 3 runs before any tax is calculated**, so a sale we judge too small is never even priced. The one look back is on the buy side: cash left over at Step 6 can top up a fund whose shortfall Step 3 judged too small.

---

## Step 1 — reserving what good held funds already hold

This step carries the single most consequential business rule in the engine.

### The problem it solves

If the whole subgroup target went to our top picks and every other rank got zero, a customer holding a perfectly good rank-2 fund would have all of it sold to buy rank 1 — pure churn, real tax, no change in what they actually own.

Not an edge case: **around 69% of real holdings sit at rank 2 or worse.**

### The rule: reserve, then residual

```mermaid
flowchart TB
  A["Subgroup target"] --> B["Deduct the locked short-term portion<br/>of any off-list holdings"]
  B --> C{"For each held<br/>recommended fund"}
  C --> D{"Rank gap to the best-ranked<br/>fund in the ladder is under 5?"}
  D -->|"No — gap 5 or more"| E["No protection.<br/>Target 0 — available to be sold"]
  D -->|"Yes"| G["PROTECTED.<br/>Reserve what it already holds"]
  G --> H{"Do the reserves exceed<br/>the subgroup target?"}
  H -->|"Yes"| I["Trim reserves,<br/>worst-ranked first,<br/>until they fit"]
  H -->|"No"| J["Residual = target − reserves"]
  I --> J
  J --> K["Residual goes to the top one or two<br/>ranked funds — Step 2.<br/>Every other fund gets just its reserve"]
```

**The band is 5 and it is exclusive.** Gap of 4 protects; gap of 5 sells. The gap is measured from the best-ranked fund in research's ladder for that subgroup (normally rank 1), whether or not the customer holds it.

| Situation | Outcome |
|---|---|
| Holds rank 3, best available rank 1. Gap 2 | Kept. Their money stays; new money goes to the top-ranked funds. |
| Holds rank 7, best available rank 1. Gap 6 | Sold. Too far down the ladder to defend. |
| Holds rank 2 **and** rank 4, together exceeding the target | Rank 4 trimmed first — they lose the poorer position. |
| Holds a recommended fund in a subgroup the plan does not fund | Sold. A zero target leaves nothing to reserve. |

The engine can also withhold protection from a fund rated below 5 on our 1–10 scale. The live app does not pass fund ratings yet — every fund goes in rated 10 — so in practice the rank gap alone decides.

<div class="callout">
  <div class="title">Confirm this one</div>
  <p>The band of 5 is <strong>absolute</strong>, not a fraction of ladder depth. A subgroup with 3 ranked funds protects all of them; one with 10 protects only the top 5. As research ladders deepen the rule automatically gets stricter at the bottom. Deliberate — but worth confirming it is what you intended.</p>
</div>

### Three kinds of row

| Type | Its target | What happens to it |
|---|---|---|
| **Recommended** | Reserve + its share of the residual, per above | Bought, trimmed, or held |
| **Off-list** | Its **short-term value** | Only the long-term portion may migrate into a recommended fund. Short-term units stay put — we do not realise short-term tax on a fund that is merely off-list. |
| **Force-exit** | **Zero** | Sold in full, regardless of tax cost |

Setting the off-list target to the short-term value makes the shortfall exactly equal to the long-term value — so the engine offers up precisely the long-term units and nothing else.

## Step 2 — one fund or two per subgroup

The residual — the fresh money left after reserves — goes to the top of research's ladder, and the number of funds sharing it depends only on the size of the portfolio.

| Total corpus | Funds that share a subgroup's residual |
|---|---|
| Under **₹50,00,000** | **One** — the best-ranked fund |
| **₹50,00,000** or more | **Two** — the two best-ranked funds, in equal shares |

```mermaid
flowchart TB
  A["Residual for the subgroup<br/>= target − reserves"] --> B{"Total corpus<br/>₹50 lakh or more?"}
  B -->|"No"| C["All of it to the<br/>best-ranked fund"]
  B -->|"Yes"| D["Split equally between the<br/>two best-ranked funds"]
  D --> E["Each share rounded down to ₹100;<br/>the remainder goes to the best-ranked fund"]
  C --> F["Fund target = its reserve + its share,<br/>rounded to the nearest ₹100"]
  E --> F
```

The two funds are ranks 1 and 2 of the ladder whether or not the customer holds them, and a protected fund keeps its reserve whether or not it is one of the two. The equal split is of the residual only, so a protected fund can end up far larger than its partner.

<div class="callout rule">
  <div class="title">No per-fund concentration cap</div>
  <p>Nothing in the plan limits how much of the portfolio sits in one fund. A subgroup's whole residual can land in a single fund, and a protected reserve is never trimmed for concentration. Concentration is controlled by the fund count instead — one or two funds per subgroup, chosen by portfolio size.</p>
  <p>A real trade-off to confirm: the split applies to any residual, however small, so a small top-up can open a small new position in a second fund (Harpreet gets two — see Step 3).</p>
</div>

## Step 3 — is this change worth making?

```mermaid
flowchart TB
  A["Difference between<br/>target and holding"] --> B{"Flagged by research<br/>for removal?"}
  B -->|"Yes"| C["MUST ACT.<br/>Full exit, no size test"]
  B -->|"No"| D{"Difference at least the trade bar?<br/>Smaller of 1% of the corpus and<br/>50% of the larger of target and holding"}
  D -->|"No"| E["LEAVE ALONE.<br/>No sale, no tax"]
  D -->|"Yes, positive"| F["BUY candidate"]
  D -->|"Yes, negative"| G["SELL candidate"]
```

**The trade bar is the smaller of two figures:** 1% of the total corpus, or 50% of the larger of the fund's target and its holding. The portfolio leg sets a ceiling — for Harpreet's ₹54,90,000, no change of ₹54,900 or more is ever ignored. The fund leg keeps the bar in proportion for small positions.

Two consequences follow from the arithmetic. A **brand-new position** always clears the bar, because its whole target is the change. A **full exit to a zero target** always clears it too. So the bar only ever filters partial adjustments to funds already held.

**One condition bypasses the test entirely** and forces a full exit: research has flagged the fund for removal. It is neither size-tested nor tax-tested — a flagged fund is sold in full even if that realises short-term gains. The engine also force-exits any fund rated below **5**, but with every fund passed in rated 10 that never fires today; the live ranking file flags no fund for removal.

## Step 4 — never sell debt to buy debt

**The problem.** The allocation engine picks a debt wrapper — short-duration, arbitrage, or arbitrage-plus-income — from the customer's tax rate and the goal's remaining tenure. As either drifts the preferred wrapper changes, one subgroup's target falls and another's rises, and the naive rebalance executes a switch that **leaves total debt exposure unchanged and costs real tax**.

**The rule.** We treat every debt-fund category the customer might hold as **one economic sleeve** — not just the three tax-driven wrapper choices, but every category of debt fund, including an off-list one. Matched sell and buy intentions inside it are cancelled against each other before any tax is computed.

```mermaid
flowchart TB
  A["Collect all debt-sleeve<br/>sell and buy intentions"] --> B["Carve out sells we must keep:<br/>force-exit funds only —<br/>a bad fund still exits in full"]
  B --> C["Reserve buy demand equal to any<br/>forced-exit debt proceeds — that cash<br/>already has a destination"]
  C --> D["Cancel amount = smaller of<br/>remaining sells and<br/>remaining buy capacity"]
  D --> E["Reduce the sell side<br/>proportionally"]
  E --> F["Give the surviving buy demand to the<br/>best-ranked debt buyers first,<br/>each up to its own shortfall"]
  F --> G{"Does a leftover sliver still<br/>fall under the trade bar?"}
  G -->|"Yes"| H["Cancel it too, and book it —<br/>so the plan still reconciles"]
  G -->|"No"| I["Keep it"]
```

**Why here and not later.** Once Step 6 has selected lots and scaled buys, those operations cannot be reversed cleanly. Cancelling while it is still an *intention* means the tax arithmetic runs once, forward, on the corrected picture.

**One deliberate carve-out:** a force-exit sale always survives — a bad fund is still bad, even in debt. Everything else in the sleeve is fair game for cancelling, including a held off-list debt fund — it is kept rather than sold to fund a recommended one. Netting only cancels a *matched* amount, though: debt with no offsetting debt buy to net against is still sold as normal.

**What the customer is told:** *"Kept ₹X in your existing debt funds rather than moving it into similar ones — switching would have triggered a tax bill without changing what you actually hold."* If a kept fund then holds more than our usual single-fund level (30% of the corpus for short-duration debt, arbitrage and arbitrage-plus-income funds, 10% for any other debt category, never below ₹1,00,000), we say so, and say new investment will correct it rather than a sale.

## Step 5 — pricing the gain

For each fund we intend to sell:

```
short-term gain = short-term value − short-term cost
long-term gain  = long-term value − long-term cost
```

Both are **signed** — a negative figure is a realised loss, and losses are useful at Step 7. Funds we are not selling carry zero; they realise nothing.

## Step 6 — who sells, in what order

The heart of the tax logic. Three pools in a fixed order, then a sweep of any cash left over.

```mermaid
flowchart TB
  A["Sort all sell candidates by average<br/>tax cost per rupee sold, cheapest first"] --> B["POOL 1 — FORCED SELLS<br/>Funds research flagged for removal"]
  B --> C["Sell each in FULL, whether or not<br/>anyone needs the cash.<br/>Long-term units first, then short-term"]
  C --> D["Cash raised"]
  D --> E{"Enough to cover<br/>total buy demand?"}
  E -->|"Yes"| F["No optional selling at all"]
  E -->|"No"| G["POOL 2 — OPTIONAL SELLS<br/>Funds above target"]
  G --> H["Sell only up to the remaining shortfall,<br/>cheapest fund first.<br/>LONG-TERM UNITS ONLY"]
  H --> I["POOL 3 — BUYS"]
  F --> I
  I --> J{"Cash raised at least<br/>equal to buy demand?"}
  J -->|"Yes"| K["Everyone gets their full buy"]
  J -->|"No"| L["Scale every buy by the same factor,<br/>then round each DOWN to ₹100"]
  K --> M["LEFTOVER CASH<br/>Tops up recommended funds whose<br/>shortfall fell under the trade bar,<br/>biggest shortfall first"]
  L --> M
```

<div class="callout rule">
  <div class="title">The three rules that define our tax posture</div>
  <p><strong>1. Long-term units are always sold before short-term ones</strong> — 12.5% against 20%.</p>
  <p><strong>2. A routine trim never realises short-term gains.</strong> Optional sells are long-term-only, full stop. Short-term gains are realised <em>only</em> on a forced exit, where the quality problem outweighs the tax.</p>
  <p><strong>3. The engine never invents cash.</strong> Total buys can never exceed total sells. When cash falls short every buy is scaled down proportionally and the shortfall is reported, not hidden.</p>
</div>

**Cheapest-first ordering.** Each candidate is scored on its average tax cost per rupee sold — its long-term and short-term gain ratios weighted by how much of the holding sits in each bucket, at the respective rates. A fund sitting on a short-term loss scores negative and is sold *first*: it raises cash and a useful loss at once.

**The short-term-gains budget** is an optional ceiling on the short-term gain one plan may realise. The live plan sets none, so a forced exit sells its short-term units in full; a ceiling is set only when the customer asks a chat what-if with one. When a ceiling is set and a forced sale would breach it, we sell only the fraction that fits and record the rest, with a warning. Realised *losses* increase the remaining budget, because they absorb gains.

**Leftover cash.** Whatever the buys do not use — forced-exit proceeds beyond the buy demand, or the few hundred rupees that rounding each buy down leaves behind — goes to recommended funds whose shortfall was under the trade bar, biggest shortfall first, each rounded down to ₹100. Forced-exit money is never left idle; it also means a rounding remainder can turn into a ₹100 top-up.

**Direct stocks play no part.** Rebalancing works only with mutual funds: it never sells shares to fund a buy, and no stock appears in the plan.

## Step 7 — putting losses to work

```mermaid
flowchart TB
  A["Available offset = carried-forward<br/>short-term losses + short-term losses<br/>realised in this plan"] --> B["Net off against short-term gains<br/>realised in this plan"]
  B --> C["Leftover offset<br/>becomes extra headroom"]
  C --> D{"Was any FORCED sale blocked<br/>by a short-term budget?"}
  D -->|"No"| E["Done"]
  D -->|"Yes"| F["Re-run those sales against the extra<br/>headroom, least-gain-per-rupee first"]
  F --> G["Convert what fits<br/>into actual sales"]
```

<div class="callout">
  <div class="title">Only short-term losses are pooled here — a statutory requirement</div>
  <p>Under Indian capital-gains rules a <strong>long-term</strong> capital loss may be set off only against long-term gains, never against short-term. Carried-forward long-term losses are recorded but deliberately unused in this calculation.</p>
</div>

Only **forced** sales are eligible for this second pass. An optional trim that stopped at the long-term boundary did so by rule, not because a budget blocked it — loss headroom cannot unlock what was never blocked. With no short-term budget in the live plan, no forced sale is ever blocked, so the second pass only runs on a what-if that sets one; the netting of short-term losses against short-term gains always applies to the tax estimate.

**The tax estimate:** short-term gains net of offsets at **20%**; long-term gains above the **₹1,25,000** annual exemption at **12.5%**. Losses do not generate refunds — the figure is floored at zero.

## Step 8 — the instruction and its reason

```mermaid
flowchart TB
  A["Fund row after all steps"] --> B{"Any units<br/>sold?"}
  B -->|"Yes"| C{"Flagged by research,<br/>off-list, or recommended?"}
  C -->|"Flagged by research"| E["EXIT — 'flagged for removal'"]
  C -->|"Off-list"| F["SELL — 'migrate to recommended fund'"]
  C -->|"Recommended"| G["SELL — 'trim back to target'"]
  B -->|"No"| H{"Any units<br/>bought?"}
  H -->|"Yes, the subgroup's best-ranked buyer"| I["BUY — 'top up to target'"]
  H -->|"Yes, the second of two funds sharing it"| J["BUY — 'spreading across your top funds'"]
  H -->|"No"| K["No instruction.<br/>The fund is left alone"]
```

There is no instruction for direct stocks: they sit outside rebalancing.

Two labels worth noting for review:

- A **second-fund buy says "spreading across your top funds"**, not "top up" — the honest explanation that the portfolio is large enough to hold two funds in this category, so part of the money goes to our next top-ranked fund.
- A **trim of a recommended fund explicitly says the fund is still recommended.** Without that, a customer reading "SELL" on a fund we told them to buy would reasonably conclude we had changed our mind. The same wording appears when the plan gives the fund's whole category nothing — Harpreet's small-cap and mid-cap funds read "just above its planned share".

Each instruction also carries research's own written reason for that fund — the selection reason on a buy or trim, the rejection reason on an exit or migration. When short-term units were held back, the reason adds how much and why.

**ELSS is held, never traded.** The live plan carries the ELSS you hold as a frozen amount — shown and counted toward the growth target, never traded — because SEBI's 3-year lock-in would make an instruction undeliverable. The freeze covers every held ELSS unit, including units already past the lock-in.

Alongside the trades, the Invest page shows three bars per asset class — the goal mix, where this plan lands, and today. When the plan lands 3 or more percentage points away from the goal mix in a class, one line says by how much, and a tap explains why: a rebalance adds no new money, and — where short-term units were held back — how many rupees that locked. A SIP or lump sum, invested at the goal mix directly, is named as the quicker way to close the rest.

## Every rule, in the order it applies

| Order | If this is true | Then |
|---|---|---|
| 1 | Holding is a direct stock, or anything else that is not a mutual fund | Outside rebalancing — no row, no trade |
| 2 | Fund is ELSS | Frozen: shown and counted toward the growth target, never traded |
| 3 | Research flagged the fund for removal | Full exit, regardless of size or tax |
| 4 | Fund is off-list but not flagged | Target = short-term value; only long-term units may migrate |
| 5 | The plan gives the fund's subgroup nothing | Target zero for every fund in it |
| 6 | Held recommended fund, rank gap under 5 | Reserve what it holds; never sold to fund a neighbour |
| 7 | Reserves within a subgroup exceed its target | Trim worst-ranked first |
| 8 | Residual left after reserves | To the best-ranked fund under a ₹50 lakh corpus; split equally between the top two at ₹50 lakh or more |
| 9 | Difference under the trade bar and no exit rule applies | Leave the fund alone |
| 10 | Sell and buy both land inside the debt sleeve | Cancel them against each other |
| 11 | Selling units | Long-term first, always |
| 12 | Sale is an optional trim | Long-term only; never realise short-term gains |
| 13 | Sale is a forced exit | Sold in full, short-term units included |
| 14 | A short-term budget is set and runs out mid-sale | Sell only the fraction that fits; report the rest |
| 15 | Short-term losses available | Net them off, then reopen blocked forced sales |
| 16 | Long-term losses available | Recorded, not used against short-term gains — statutory |
| 17 | Cash raised is less than buy demand | Scale all buys proportionally and round each down |
| 18 | Cash left after the buys | Top up under-bar shortfalls in recommended funds, biggest first |

## The decisions we would most want you to confirm

1. **The rank protection band of 5.** Step 1. It decides whether a held fund is defended or liquidated, it is absolute rather than proportional to ladder depth, and it is the largest single driver of how much churn a plan produces.
2. **No per-fund cap; one or two funds per subgroup by corpus.** Step 2. A fund may hold any share of the portfolio, and a small residual still opens a small new position in a second fund once the corpus reaches ₹50 lakh.
3. **Debt is never sold to buy debt.** Step 4. Covers every debt category a customer might hold, not just the three tax-driven wrapper choices — an off-list debt fund is kept rather than switched. Accepts wrapper drift as the price of avoiding tax on an economically neutral switch.
4. **A routine trim never realises short-term gains.** Step 6. Some over-weight positions are therefore only partly corrected this round; the rest waits for the units to age.
5. **The trade bar.** Step 3. The smaller of 1% of the corpus and 50% of the position — large positions are judged against the portfolio, small ones against themselves, and new positions and full exits always pass.
6. **Forced exits have no short-term-gains ceiling.** Step 6. The live plan sets no budget, so a fund research flags is sold in full even when that realises short-term gains.
7. **All held ELSS is frozen.** Step 8. Every ELSS unit is shown and counted but never traded, including units already past the 3-year lock-in, which a unit-by-unit rule could release for switching.
