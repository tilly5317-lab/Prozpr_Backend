# Additional Investment — deploying fresh money, end to end

> **What this covers.** When a customer adds money to an existing plan — a monthly **SIP** or a one-time **lump sum** — this is the engine that decides *which funds to buy, and how much into each*. It only ever **buys**. It never sells, never trims, never touches what is already invested. (Selling and trimming is the rebalancing engine's job — see the companion trace, `rebalancing_logic_flowchart_081326.html`.)
>
> **Every section ends with the same customer** you met in the rebalancing document — Harpreet Singh — so you can watch one portfolio receive new money under each rule.
>
> **Internal document.** It contains our proprietary caps, floors and ordering rules.

<div class="at-glance">
  <div class="cell"><div class="k">What it decides</div><div class="v">Which funds to buy with new money — and how much into each</div></div>
  <div class="cell"><div class="k">How it decides</div><div class="v">Fixed arithmetic. No AI, no judgement calls</div></div>
  <div class="cell"><div class="k">What it never does</div><div class="v">Sell, trim, or switch existing holdings</div></div>
  <div class="cell"><div class="k">Two modes</div><div class="v">Lump sum fills the gaps · SIP follows the ideal mix</div></div>
</div>

---

## The two jobs, one engine

Money arrives in two ways, and the engine treats them differently:

- **A lump sum** — a one-time amount. When we already know what the customer holds (the normal case), it goes where the portfolio sits **furthest below its ideal** — it *fills the gaps*.
- **A SIP** — a fixed monthly amount. It follows the **ideal mix** for the nearest goal the customer has not yet funded — it *builds steadily* toward plan, the same split every month.

Everything after that — how funds are picked, the caps, the rounding — is shared.

> **This is a pure calculator.** Give it the same inputs and it returns the same buys, every time. It does no research and no allocation maths of its own — those arrive already computed.

---

## The inputs

Four things arrive, all computed upstream:

| Input | What it is |
|---|---|
| **The deposit** | The amount to deploy, and its cadence — one-time **lump sum** or monthly **SIP**. |
| **The ideal plan** | A rupee figure per subgroup, split across time-horizon buckets (emergency / short / medium / long), from the practical asset-allocation engine. |
| **Current holdings** | What the customer already holds in each subgroup — supplied for a lump sum, so gaps can be measured. |
| **The ranked ladder** | Research's ordered list of recommended funds per subgroup — rank 1 is the top pick. Buys come only from here. |

Plus the policy knobs: the per-fund **caps**, the **rupee floors**, and the **excluded sleeves**.

### Vocabulary

| Term | Meaning |
|---|---|
| **Subgroup / sleeve** | A slice of the portfolio (`arbitrage_plus_income`, `multi_asset`, `gold_commodities`, and so on). Money is split across sleeves first, then across funds within each. |
| **Horizon bucket** | Emergency, short-, medium-, long-term. The ideal plan carries a rupee figure per sleeve *per bucket*. |
| **Rank** | Research's ordering of funds within a sleeve. Rank 1 is the top pick. |
| **Deploy amount** | The money being invested this run. For a SIP it is the **monthly** figure. |

### Two sleeves never receive fresh money

- **ELSS (`tax_efficient_equities`)** — a 3-year lock-in; we do not push new money into a locked instrument.
- **Direct stocks / PMS (`non_mf_equities`)** — there is no mutual fund to buy.

Their share is set aside and the remaining sleeves are re-weighted to fill the gap.

## The flow on one page

```mermaid
flowchart TB
  A["New money + the ideal plan<br/>+ (for a lump sum) current holdings"] --> B{"Lump sum,<br/>with holdings on file?"}
  B -->|"Yes"| C["FILL THE GAPS<br/>split by how far each sleeve<br/>sits below its ideal"]
  B -->|"No — a SIP,<br/>or no holdings"| D["FOLLOW THE IDEAL MIX<br/>aim at the nearest unfunded goal,<br/>split by that horizon's plan"]
  C --> E["Per sleeve: pick funds<br/>rank 1 first, spill down<br/>under the per-fund cap"]
  D --> E
  E --> F["Round each buy to ₹100"]
  F --> G["Lump sum: sweep up any dust<br/>SIP: leave as is"]
  G --> H["BUY list + anything undeployed"]
```

The engine picks its mode once, at the top, and never switches. Both modes then converge on the same fund-selection machinery.

## Which mode runs — the fork

One decision at the top of the run:

<div class="step-panel">
<div class="label">the mode switch</div>
<pre><code>LUMP SUM   and current holdings are on file   →  FILL THE GAPS        (deficit-fill)
SIP                                            →  FOLLOW THE IDEAL MIX (bucket-targeting)
LUMP SUM   with no holdings on file            →  FOLLOW THE IDEAL MIX (same as a SIP)</code></pre>
</div>

The everyday reading: **a lump sum fills the gaps; a SIP follows the ideal mix.** The third line is a safety fallback — a lump sum with nothing on file has no gaps to measure, so it follows the ideal mix instead.

---

## Step A — Lump sum: fill the gaps

Fresh money should first repair wherever the portfolio has drifted **furthest below** where it should be.

```mermaid
flowchart TB
  A["Recompute the ideal at<br/>corpus + deposit"] --> B["For each sleeve:<br/>gap = max(0, new ideal − held)"]
  B --> C{"Any sleeve<br/>behind its ideal?"}
  C -->|"Yes"| D["Split the deposit by gap share:<br/>deposit × (its gap ÷ total gap)"]
  C -->|"No — all at/above ideal"| E["Fall back to splitting<br/>by the ideal ratios"]
```

1. **Recompute the ideal at the new, larger corpus.** Adding money changes the ideal rupee figure for every sleeve, so the ideal is re-run at *corpus + deposit* — the plan the customer *should* hold *after* investing.
2. **Measure each gap:** `gap = max(0, new ideal − what you already hold)`. A sleeve already at or above its ideal has a gap of zero and gets nothing.
3. **Split the money by gap share:** each sleeve receives `deposit × (its gap ÷ total gap)`.
4. **If nothing is behind,** fall back to the ideal ratios — keep building toward plan rather than deploy nothing.

<div class="callout rule">
  <div class="title">Fill, not rebalance</div>
  <p>Only sleeves with a <strong>positive</strong> gap get money. A sleeve you hold that has since dropped out of your ideal gets <strong>no buy</strong> — and, because this engine never sells, <strong>no sell either</strong>. That correction, if it is needed, is the rebalancing engine's job.</p>
  <p>The plan still reports a "target horizon" for a lump sum, but in gap-fill mode that is just a <em>label</em> — the dominant horizon of where the money landed. It did not drive the split.</p>
</div>

## Step B — SIP: follow the ideal mix

A SIP does not chase gaps; it drips toward the plan, the same split every month.

```mermaid
flowchart TB
  A["Are short-term<br/>goals funded?"] -->|"No"| S["Aim SHORT-TERM"]
  A -->|"Yes"| B["Are medium-term<br/>goals funded?"]
  B -->|"No"| M["Aim MEDIUM-TERM"]
  B -->|"Yes"| L["Aim LONG-TERM<br/>(the fallback — keep building wealth)"]
```

1. **Pick the target horizon** — the nearest goal not yet funded: short-term if that is still short; else medium-term; else long-term. **Emergency is never a SIP target** — it is a one-time cushion, not a monthly build.
2. **Split across sleeves by that horizon's plan** — weight each sleeve by the rupees the ideal plan assigns it *in the chosen bucket's column*.

## Step C — Choosing the funds

Once each sleeve has a rupee target, the engine fills it from the ranked ladder — **rank 1 first, then spill down** — under a per-fund cap. This step is the same in both modes.

```mermaid
flowchart TB
  A["Sleeve target"] --> B["Start at rank 1"]
  B --> C["Per-fund cap = larger of<br/>(cap% × the deposit) and the rupee floor"]
  C --> D{"Target above<br/>the cap?"}
  D -->|"No"| E["Buy the whole target here.<br/>Round to nearest ₹100"]
  D -->|"Yes"| F["Buy up to the cap here.<br/>Spill the rest to the next rank"]
  F --> C
  E --> G["Sleeve done"]
```

**The per-fund cap keeps any one fund from swallowing the whole deposit.** It is the larger of two numbers:

- **cap% × the deposit** — 30% for the short-debt and arbitrage sleeves, 20% for multi-asset, 10% everywhere else; and
- **a flat rupee floor** — **₹10,000** for a SIP, **₹40,000** for a lump sum.

<div class="callout rule">
  <div class="title">On a small deposit the rupee floor wins</div>
  <p>The cap is a percent of the <strong>money being deployed</strong>, not of the whole portfolio — so on any normal SIP the percentage barely bites. A ₹25,000 SIP into arbitrage: 30% × ₹25,000 = ₹7,500, but the ₹10,000 floor lifts the cap to ₹10,000. Without the floor a deposit would shatter into tiny slivers down the ladder; the floor keeps the money in a few funds.</p>
</div>

**A SIP has one extra first move.** Before walking the ladder, a SIP tries to **mirror the customer's latest rebalancing plan** — if that plan bought certain funds, the SIP tops up the same ones first, so the monthly investment reinforces the last rebalance instead of drifting to different funds. Only then does it walk the ranking for anything left. *(In this simulation no prior rebalancing plan was supplied, so every SIP buy below comes from the rank-walk.)*

The cap is why a single sleeve can end up spread across two funds: the top pick fills to its ceiling, and the remainder flows to the next rank down.

---

## Step D — Rounding, dust and under-deployment

- **Every buy rounds to the nearest ₹100.** Rounding can leave the total a little off the deposit in either direction.
- **A lump sum sweeps up the dust.** If the rounded buys land just short of the deposit, the small remainder is added to the largest buy, so a lump sum deploys the full amount (give or take a ₹100 rounding step). A SIP skips this — a few rupees over or under is fine on a recurring instruction.
- **Anything the plan cannot place is reported, never hidden.** If the caps bind, or a sleeve has no ranked fund, the leftover surfaces as **undeployed** — a visible number, not a silent drop.

For Harpreet neither deposit leaves anything undeployed: the ₹25,000 SIP places ₹25,000 in full, and the ₹10,00,000 lump sum places ₹10,00,100 (a single ₹100 of rounding overshoot), nothing undeployed.

---

## SIP vs lump sum — what actually differs

| | Lump sum (with holdings) | SIP |
|---|---|---|
| **How the split is decided** | Fills gaps below the recomputed ideal | Follows the ideal mix of the nearest unfunded goal |
| **Uses current holdings?** | Yes — to measure gaps | No |
| **Fund-selection first move** | Straight to the ranked ladder | Mirror the latest rebalancing plan, then the ladder |
| **Rupee floor on the per-fund cap** | ₹40,000 | ₹10,000 |
| **Rounding remainder** | Swept into the largest buy | Left as is |
| **Frequency** | One-time | The same split, every month |

The subgroup ratios themselves do not depend on cadence: a SIP and a lump-sum-*without*-holdings compute the *same* split — only the framing (monthly vs one-time) and the fund-selection niceties differ. A lump sum *with* holdings is the one that genuinely computes a different split, because it fills gaps.

## Every number in the logic

| # | Setting | Value | Acts at | Tunable without code change? |
|---|---|---|---|---|
| 1 | Default per-fund cap | **10%** of the deposit | Step C | Yes |
| 2 | Multi-asset per-fund cap | **20%** | Step C | Yes |
| 3 | Short-debt per-fund cap | **30%** | Step C | Yes |
| 4 | Arbitrage per-fund cap | **30%** | Step C | Yes |
| 5 | Rupee floor, SIP | **₹10,000** | Step C | Yes |
| 6 | Rupee floor, lump sum | **₹40,000** | Step C | Yes |
| 7 | Trade rounding | **₹100**, nearest | Steps C, D | Per run |
| 8 | Excluded sleeves | ELSS, direct stocks / PMS | The inputs | Caller policy |

The caps are the *same percentages* the rebalancing engine uses — but here they apply to the **deposit**, whereas rebalancing applies them to the **corpus**.

---

## Every rule, in the order it applies

| Order | If this is true | Then |
|---|---|---|
| 1 | Sleeve is ELSS or direct stocks | Excluded — no fresh money; re-weight the rest |
| 2 | Lump sum, and current holdings are on file | Fill gaps: split by how far each sleeve is below its recomputed ideal |
| 3 | Every sleeve is at or above its ideal | Fall back to splitting by the ideal ratios |
| 4 | A SIP, or a lump sum without holdings | Follow the ideal mix of the nearest unfunded goal (short → medium → long) |
| 5 | The emergency horizon | Never a SIP target |
| 6 | Filling a sleeve | Rank 1 first, spill down the ladder |
| 7 | A fund would exceed its cap | Buy up to the cap; spill the rest to the next rank |
| 8 | The deposit is small | The rupee floor, not the percentage, sets the cap |
| 9 | A SIP, with a recent rebalancing plan | Mirror those funds first, then walk the ladder |
| 10 | Rounded buys fall just short of a lump sum | Sweep the remainder into the largest buy |
| 11 | Caps bind, or a sleeve has no fund | Report the leftover as undeployed |

---

## The decisions we would most want you to confirm

1. **The per-fund cap is a percent of the deposit, not the portfolio — and the rupee floor usually decides.** On any normal SIP, and on smaller lump sums, the ₹10,000 / ₹40,000 floors set the split, not the percentages. Confirm those floor levels are where you want them.
2. **A lump sum fills gaps; it does not rebalance.** It never sells, so it cannot correct an over-weight sleeve — only starve it of new money. A sleeve that has dropped out of the ideal entirely gets no buy *and* no sell.
3. **The engine is blind to which specific funds you already own within a sleeve.** Every pick comes off the top of the ladder; it will not deliberately avoid re-buying a fund you hold, nor prefer one you do not. (A SIP's mirror step is the one nod to your existing plan.)
4. **A SIP always builds the nearest unfunded horizon.** Once short and medium are funded, every SIP rupee builds long-term — even years ahead of a long-term goal. Confirm that is intended, rather than, say, splitting a SIP across horizons.
5. **Emergency is never fed by a SIP,** and naturally draws nothing from a lump sum. Confirm the emergency cushion is expected to be funded some other way.

<script>
(function () {
  const mdSource = document.getElementById('source-md').textContent;

  marked.use({ gfm: true, breaks: false, headerIds: true, mangle: false });

  const rawHtml = marked.parse(mdSource);
  const content = document.getElementById('content');
  content.innerHTML = rawHtml;

  content.querySelectorAll('pre code.language-mermaid').forEach((codeEl) => {
    const div = document.createElement('div');
    div.className = 'mermaid';
    div.textContent = codeEl.textContent;
    codeEl.parentElement.replaceWith(div);
  });

  function slugify(text) {
    return text.toLowerCase().replace(/[^a-z0-9\s-]/g, '').trim().replace(/\s+/g, '-');
  }
  content.querySelectorAll('h2, h3').forEach((h) => { if (!h.id) h.id = slugify(h.textContent); });

  const tocList = document.getElementById('toc-list');
  content.querySelectorAll('h2, h3').forEach((h) => {
    const li = document.createElement('li');
    li.className = 'lvl-' + h.tagName.charAt(1);
    const a = document.createElement('a');
    a.href = '#' + h.id;
    a.textContent = h.textContent;
    li.appendChild(a);
    tocList.appendChild(li);
  });

  mermaid.initialize({
    startOnLoad: false,
    theme: 'default',
    flowchart: { curve: 'basis', htmlLabels: true },
    securityLevel: 'loose',
  });
  mermaid.run({ querySelector: '.mermaid' });

  const headings = Array.from(content.querySelectorAll('h2, h3'));
  const tocLinks = Array.from(tocList.querySelectorAll('a'));
  const linkById = new Map(tocLinks.map(a => [a.getAttribute('href').slice(1), a]));
  function onScroll() {
    const fromTop = window.scrollY + 80;
    let active = headings[0];
    for (const h of headings) { if (h.offsetTop <= fromTop) active = h; else break; }
    tocLinks.forEach(a => a.classList.remove('active'));
    if (active) { const link = linkById.get(active.id); if (link) link.classList.add('active'); }
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();
})();
</script>
